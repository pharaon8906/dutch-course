], ["My umbrella breaks!", "Моя парасолька ламається!"]], [["But in the afternoon the rain stops.", "Але вдень дощ припиняється."], ["The sun comes out.", "Виходить сонце."], ["There is a rainbow!", "З'являється веселка!"], ["Now the weather is nice.", "Тепер гарна погода."]]], "q": [{"q": "Скільки градусів за Цельсієм?", "o": ["Приблизно 10", "Приблизно 50", "Приблизно 30"], "a": 0}, {"q": "Що ламається?", "o": ["Парасолька", "Автобус", "Вікно"], "a": 0}, {"q": "Що з'являється вдень?", "o": ["Сніг", "Веселка", "Туман"], "a": 1}]}, {"id": "t15", "lv": "A0", "e": "📱", "t": "My phone", "uk": "Мій телефон", "p": [[["My phone is very important to me.", "Мій телефон для мене дуже важливий."], ["I use it all day.", "Я користуюся ним цілий день."]], [["In the morning it wakes me up.", "Уранці він мене будить."], ["I read the news and check the weather.", "Я читаю новини і дивлюся погоду."], ["On the bus I listen to music.", "В автобусі я слухаю музику."]], [["At work I send emails.", "На роботі я надсилаю листи."], ["I text my friends.", "Я пишу повідомлення друзям."], ["I video call my mother.", "Я дзвоню мамі по відео."], ["Then I can see her face.", "Тоді я бачу її обличчя."]], [["I also learn English on my phone.", "Я також вчу англійську на телефоні."], ["Ten minutes every day.", "Щодня по десять хвилин."]], [["But in the evening I put my phone away.", "Але ввечері я відкладаю телефон."], ["Then I read a book.", "Тоді я читаю книжку."], ["It's better for my eyes.", "Це краще для моїх очей."], ["And I sleep better.", "І я краще сплю."]]], "q": [{"q": "Що вона робить в автобусі?", "o": ["Читає", "Слухає музику", "Спить"], "a": 1}, {"q": "Як вона дзвонить мамі?", "o": ["По відео", "Звичайним дзвінком", "Не дзвонить"], "a": 0}, {"q": "Що вона робить увечері?", "o": ["Дивиться відео", "Читає книжку", "Працює"], "a": 1}]}, {"id": "t16", "lv": "A0", "e": "🎂", "t": "A birthday", "uk": "День народження", "p": [[["Today is my mother's birthday.", "Сьогодні в мами день народження."], ["She is sixty years old.", "Їй шістдесят років."]], [["At three o'clock the family comes.", "О третій приходить родина."], ["Everybody says: \"Happy birthday!\"", "Усі кажуть: «З днем народження!»"], ["There are balloons in the living room.", "У вітальні повітряні кульки."]], [["We eat a big chocolate cake.", "Ми їмо великий шоколадний торт."], ["There are sixty candles on it!", "На ньому шістдесят свічок!"], ["My mother makes a wish and blows out the candles.", "Мама загадує бажання і задуває свічки."], ["We all sing \"Happy Birthday to You\".", "Ми всі співаємо «З днем народження тебе»."]], [["My mother gets many presents: flowers, a book and a nice scarf.", "Мама отримує багато подарунків: квіти, книжку і гарний шарф."], ["She is very happy.", "Вона дуже щаслива."], ["At six o'clock we have dinner together.", "О шостій ми разом вечеряємо."], ["It's a wonderful day.", "Це чудовий день."]]], "q": [{"q": "Скільки років мамі?", "o": ["50", "60", "70"], "a": 1}, {"q": "Що кажуть усі?", "o": ["З днем народження!", "Смачного!", "До побачення!"], "a": 0}, {"q": "Який торт?", "o": ["Шоколадний", "Яблучний", "Сирний"], "a": 0}]}, {"id": "t17", "lv": "A0", "e": "🌳", "t": "In the park", "uk": "У парку", "p": [[["It's Sunday and the sun is shining.", "Неділя, світить сонце."], ["I go to the park with my children.", "Я йду з дітьми в парк."]], [["The park is big and green.", "Парк великий і зелений."], ["There is a pond with ducks.", "Там є ставок з качками."], ["The children look at the ducks.", "Діти дивляться на качок."]], [["There is also a playground.", "Є також дитячий майданчик."], ["My son goes on the swing.", "Мій син гойдається на гойдалці."], ["My daughter plays in the sand.", "Моя донька грається в піску."]], [["I sit on a bench and read.", "Я сиджу на лавці і читаю."], ["An old man sits next to me.", "Поруч зі мною сидить старий чоловік."], ["He says: \"Beautiful day, isn't it?\"", "Він каже: «Гарний день, правда?»"], ["\"Yes, it's lovely!\" I say.", "«Так, чудовий!» — кажу я."]], [["At four o'clock we buy ice cream.", "О четвертій ми купуємо морозиво."], ["Then we go home, tired and happy.", "Потім ідемо додому втомлені й щасливі."]]], "q": [{"q": "Хто живе у ставку?", "o": ["Риби", "Качки", "Жаби"], "a": 1}, {"q": "Що робить донька?", "o": ["Гойдається", "Грається в піску", "Читає"], "a": 1}, {"q": "Що вони купують о четвертій?", "o": ["Каву", "Морозиво", "Квіти"], "a": 1}]}, {"id": "t18", "lv": "A0", "e": "🏘️", "t": "My neighbor Henry", "uk": "Мій сусід Генрі", "p": [[["My neighbor's name is Henry.", "Мого сусіда звати Генрі."], ["He is eighty years old.", "Йому вісімдесят років."], ["He lives alone.", "Він живе сам."]], [["Henry has a small dog.", "У Генрі маленький песик."], ["The dog's name is Max.", "Песика звати Макс."], ["Every morning Henry walks Max down the street.", "Щоранку Генрі вигулює Макса вулицею."]], [["Henry is always cheerful.", "Генрі завжди веселий."], ["Every day he says: \"Good morning, neighbor!\"", "Щодня він каже: «Доброго ранку, сусідко!»"], ["Sometimes we drink coffee together.", "Іноді ми разом п'ємо каву."], ["He tells me stories about the old days.", "Він розповідає мені історії про давні часи."]], [["Henry can't walk very well.", "Генрі погано ходить."], ["So sometimes I go shopping for him.", "Тому іноді я купую для нього продукти."], ["He gives me flowers from his garden.", "Він дає мені квіти зі свого саду."], ["Henry helps me with my English.", "Генрі допомагає мені з англійською."], ["He is a good neighbor.", "Він добрий сусід."]]], "q": [{"q": "Скільки років Генрі?", "o": ["70", "80", "90"], "a": 1}, {"q": "Як звати песика?", "o": ["Макс", "Генрі", "Флафі"], "a": 0}, {"q": "Що Генрі дає авторці?", "o": ["Гроші", "Квіти", "Книжки"], "a": 1}]}, {"id": "t19", "lv": "A0", "e": "🚗", "t": "My first car", "uk": "Моя перша машина", "p": [[["I have a car!", "У мене є машина!"], ["It's not new, but it's mine.", "Вона не нова, але моя."], ["It's blue and small.", "Вона синя і маленька."]], [["In America many people need a car.", "В Америці багатьом людям потрібна машина."], ["The cities are big and the distances are long.", "Міста великі, а відстані довгі."], ["In my town there is no subway.", "У моєму місті немає метро."]], [["First I got my driver's license.", "Спершу я отримала водійські права."], ["I took a test at the DMV.", "Я склала іспит у відділі транспорту."], ["It was difficult, but I passed!", "Було важко, але я склала!"]], [["Now I drive to work every day.", "Тепер я щодня їжджу на роботу машиною."], ["It takes twenty minutes.", "Це двадцять хвилин."], ["On the weekend we drive to the lake.", "На вихідних ми їздимо до озера."], ["Gas is not cheap, but it's okay.", "Бензин недешевий, але нічого."], ["I love my little blue car.", "Я люблю свою маленьку синю машину."]]], "q": [{"q": "Якого кольору машина?", "o": ["Синя", "Червона", "Чорна"], "a": 0}, {"q": "Чому багатьом потрібна машина?", "o": ["Великі відстані", "Немає автобусів", "Холодно"], "a": 0}, {"q": "Куди вони їздять на вихідних?", "o": ["До моря", "До озера", "У гори"], "a": 1}]}, {"id": "t20", "lv": "A1", "e": "🚆", "t": "On the train", "uk": "У потязі", "p": [[["Every day I take the train from New Jersey to New York.", "Щодня я їжджу потягом з Нью-Джерсі до Нью-Йорка."], ["The trip takes forty minutes.", "Поїздка триває сорок хвилин."], ["I buy my ticket on an app on my phone.", "Я купую квиток у застосунку на телефоні."]], [["The train leaves at seven fifteen from track three.", "Потяг відправляється о 7:15 з колії три."], ["It's usually on time, but sometimes it's late.", "Зазвичай він приходить вчасно, але іноді запізнюється."], ["Then a voice says: \"We apologize for the delay.\"", "Тоді голос каже: «Перепрошуємо за затримку»."]], [["In the morning the train is crowded.", "Вранці потяг переповнений."], ["Many people stand.", "Багато людей стоїть."], ["I always look for a seat in the quiet car.", "Я завжди шукаю місце в тихому вагоні."], ["You can't make phone calls or talk loudly there.", "Там не можна дзвонити і голосно розмовляти."], ["I read a book or look out the window.", "Я читаю книжку або дивлюся у вікно."]], [["The conductor comes and checks the tickets.", "Приходить кондуктор і перевіряє квитки."], ["I show him my phone.", "Я показую йому телефон."], ["At Penn Station I get off.", "На станції Пенн я виходжу."], ["It's very big and busy.", "Вона дуже велика і людна."], ["Then I walk ten minutes to my office.", "Потім я йду десять хвилин пішки до офісу."]]], "q": [{"q": "Скільки триває поїздка?", "o": ["14 хвилин", "40 хвилин", "4 години"], "a": 1}, {"q": "Що не можна робити в тихому вагоні?", "o": ["Читати", "Дзвонити", "Їсти"], "a": 1}, {"q": "Як вона показує квиток?", "o": ["На телефоні", "Паперовий", "Не показує"], "a": 0}]}, {"id": "t21", "lv": "A1", "e": "🩺", "t": "At the doctor's office", "uk": "У лікаря", "p": [[["For a week I've had pain in my back.", "Уже тиждень у мене болить спина."], ["I call my doctor's office at eight in the morning.", "Я дзвоню в кабінет свого лікаря о восьмій ранку."], ["The receptionist asks: \"What are your symptoms?\"", "Реєстраторка питає: «Які у вас симптоми?»"], ["I tell her about my back.", "Я розповідаю про спину."], ["\"You can come today at two,\" she says.", "«Можете прийти сьогодні о другій», — каже вона."]], [["At the office I fill out a form.", "У кабінеті я заповнюю бланк."], ["I also show my insurance card.", "Я також показую картку медстрахування."], ["In the waiting room there are three other people.", "У приймальні ще троє людей."], ["After twenty minutes a nurse calls my name.", "Через двадцять хвилин медсестра називає моє ім'я."]], [["The doctor is young and friendly.", "Лікарка молода і привітна."], ["She asks many questions.", "Вона ставить багато питань."], ["\"Do you sit at a computer a lot?\"", "«Ви багато сидите за комп'ютером?»"], ["\"Yes, eight hours a day,\" I say.", "«Так, вісім годин на день», — кажу я."]], [["She examines my back.", "Вона оглядає мою спину."], ["\"It's nothing serious,\" she says.", "«Нічого серйозного», — каже вона."], ["\"You should move more and take a short break every hour.\"", "«Вам варто більше рухатися і щогодини робити коротку перерву»."], ["She gives me some exercises.", "Вона дає мені вправи."], ["If it doesn't get better, I can see a physical therapist.", "Якщо не покращає, я можу піти до фізіотерапевта."]]], "q": [{"q": "Що болить?", "o": ["Голова", "Спина", "Нога"], "a": 1}, {"q": "Що вона показує в кабінеті?", "o": ["Паспорт", "Картку медстрахування", "Права"], "a": 1}, {"q": "Що радить лікарка?", "o": ["Більше рухатися", "Пити ліки", "Більше спати"], "a": 0}]}, {"id": "t22", "lv": "A1", "e": "🔑", "t": "A new apartment", "uk": "Нова квартира", "p": [[["Last month I moved.", "Минулого місяця я переїхала."], ["Now I live in an apartment on the third floor.", "Тепер я живу в квартирі на третьому поверсі."], ["There's no elevator, so I take the stairs every day.", "Ліфта немає, тож я щодня ходжу сходами."]], [["The apartment has one bedroom, a kitchen and a bathroom.", "У квартирі одна спальня, кухня і ванна."], ["The living room is bright because the windows are big.", "Вітальня світла, бо вікна великі."], ["I have a view of a park.", "У мене вид на парк."]], [["The rent is fifteen hundred dollars a month.", "Оренда — тисяча п'ятсот доларів на місяць."], ["That's a lot, but it's normal in this city.", "Це багато, але для цього міста нормально."], ["I pay for electricity and internet separately.", "За електрику та інтернет я плачу окремо."]], [["I still need to buy many things.", "Мені ще треба багато чого купити."], ["I have a bed and a table, but no sofa yet.", "У мене є ліжко і стіл, але ще немає дивана."], ["Online I find a used sofa for fifty dollars.", "В інтернеті я знаходжу вживаний диван за п'ятдесят доларів."], ["My neighbor helps me carry it upstairs.", "Сусід допомагає мені занести його нагору."]], [["I also have to change my address.", "Мені також треба змінити адресу."], ["I do it on the post office website.", "Я роблю це на сайті пошти."], ["Now the apartment really feels like home.", "Тепер квартира справді відчувається як дім."]]], "q": [{"q": "На якому поверсі квартира?", "o": ["На першому", "На третьому", "На п'ятому"], "a": 1}, {"q": "Скільки коштує оренда?", "o": ["$500", "$1500", "$5000"], "a": 1}, {"q": "Скільки коштує вживаний диван?", "o": ["$50", "$150", "$500"], "a": 0}]}, {"id": "t23", "lv": "A1", "e": "💼", "t": "My workday", "uk": "Мій робочий день", "p": [[["I work as a cook in a restaurant in San Francisco.", "Я працюю кухарем у ресторані в Сан-Франциско."], ["My workday starts at two in the afternoon.", "Мій робочий день починається о другій."]], [["First I check what products we have.", "Спершу я дивлюся, які є продукти."], ["Then I prepare everything with my coworkers: we cut vegetables, make sauces and marinate meat.", "Потім з колегами все готуємо: ріжемо овочі, робимо соуси, маринуємо м'ясо."], ["At five o'clock we eat together.", "О п'ятій ми разом їмо."], ["We call it \"family meal\".", "Ми називаємо це «сімейна їжа»."]], [["At six the first guests come.", "О шостій приходять перші гості."], ["Then the kitchen gets busy.", "Тоді на кухні стає гаряче."], ["The servers bring in the orders.", "Офіціанти приносять замовлення."], ["I have to work fast and well.", "Я мушу працювати швидко і добре."], ["Sometimes it's stressful, but I like it.", "Іноді це напружено, але мені подобається."]], [["My chef is strict, but fair.", "Мій шеф суворий, але справедливий."], ["He teaches me a lot.", "Він багато мене вчить."], ["At eleven we clean the kitchen.", "Об одинадцятій ми прибираємо кухню."], ["I finish at eleven thirty.", "Я закінчую о пів на дванадцяту."], ["Then I take the bus home, tired but happy.", "Потім їду автобусом додому, втомлений, але задоволений."]]], "q": [{"q": "Ким він працює?", "o": ["Офіціантом", "Кухарем", "Шефом"], "a": 1}, {"q": "Що вони роблять о п'ятій?", "o": ["Їдять разом", "Прибирають", "Йдуть додому"], "a": 0}, {"q": "О котрій він закінчує?", "o": ["23:00", "23:30", "00:30"], "a": 1}]}, {"id": "t24", "lv": "A1", "e": "✉️", "t": "A note from school", "uk": "Записка зі школи", "p": [[["My daughter brings a note home from school.", "Донька приносить додому записку зі школи."], ["I read it slowly.", "Я читаю її повільно."]], [["\"Dear parents,\" it says.", "«Шановні батьки», — написано там."], ["\"Next Friday we are going on a field trip to the zoo.\"", "«Наступної п'ятниці ми їдемо на екскурсію до зоопарку»."], ["\"We will leave at eight thirty by bus and come back at three.\"", "«Ми вирушаємо о пів на дев'яту автобусом і повертаємося о третій»."]], [["\"Please give your child a packed lunch and something to drink.\"", "«Будь ласка, дайте дитині з собою обід і щось попити»."], ["\"Candy is not allowed.\"", "«Цукерки заборонені»."], ["\"The trip costs fifteen dollars.\"", "«Поїздка коштує п'ятнадцять доларів»."], ["\"Please sign the permission slip and send it back by Monday.\"", "«Будь ласка, підпишіть дозвіл і поверніть до понеділка»."]], [["\"We are also looking for three parents to help.\"", "«Ми також шукаємо трьох батьків на допомогу»."], ["\"If you want to come, please email Ms. Garcia.\"", "«Якщо хочете поїхати, напишіть міс Гарсії»."]], [["I want to go.", "Я хочу поїхати."], ["Then I can practice English with the other parents.", "Тоді я зможу практикувати англійську з іншими батьками."], ["I send Ms. Garcia an email.", "Я пишу міс Гарсії."], ["She answers quickly: \"Great, thank you so much!\"", "Вона швидко відповідає: «Чудово, дуже дякую!»"]]], "q": [{"q": "Куди їдуть діти?", "o": ["До музею", "До зоопарку", "На пляж"], "a": 1}, {"q": "Що не можна брати?", "o": ["Воду", "Цукерки", "Сендвічі"], "a": 1}, {"q": "Що треба підписати?", "o": ["Дозвіл", "Договір", "Квиток"], "a": 0}]}, {"id": "t25", "lv": "A1", "e": "🦃", "t": "Thanksgiving", "uk": "День подяки", "p": [[["Thanksgiving is a big holiday in the United States.", "День подяки — велике свято в США."], ["It's on the fourth Thursday of November.", "Він припадає на четвертий четвер листопада."], ["Families come together to say thank you for the good things in life.", "Родини збираються, щоб подякувати за все добре в житті."]], [["This year my American friend Emily invited me.", "Цього року мене запросила моя американська подруга Емілі."], ["Her family lives in a big house in Ohio.", "Її родина живе у великому будинку в Огайо."], ["There were twenty people at the table!", "За столом було двадцять людей!"]], [["The main dish is a big roast turkey.", "Головна страва — велика запечена індичка."], ["There were also mashed potatoes, gravy, corn and cranberry sauce.", "Ще було картопляне пюре, підлива, кукурудза і журавлинний соус."], ["For dessert we had pumpkin pie with whipped cream.", "На десерт був гарбузовий пиріг зі збитими вершками."]], [["Before dinner everybody said what they are thankful for.", "Перед вечерею кожен розповів, за що вдячний."], ["I said: \"I'm thankful for my new friends in America.\"", "Я сказала: «Я вдячна за нових друзів в Америці»."], ["Emily's grandmother hugged me.", "Бабуся Емілі обійняла мене."]], [["After dinner the men watched football on TV.", "Після вечері чоловіки дивилися футбол по телевізору."], ["We ate too much and talked for hours.", "Ми переїли і годинами розмовляли."], ["It was a warm and cozy day.", "Це був теплий і затишний день."]]], "q": [{"q": "Коли День подяки?", "o": ["Четвертий четвер листопада", "4 липня", "25 грудня"], "a": 0}, {"q": "Яка головна страва?", "o": ["Курка", "Індичка", "Риба"], "a": 1}, {"q": "Який десерт?", "o": ["Яблучний пиріг", "Гарбузовий пиріг", "Торт"], "a": 1}]}, {"id": "t26", "lv": "A1", "e": "🚦", "t": "Driving in America", "uk": "Водіння в Америці", "p": [[["In the United States people drive on the right side of the road.", "У США їздять правою стороною дороги."], ["I had to learn some new rules when I came here.", "Коли я сюди приїхала, мені довелося вивчити нові правила."]], [["Speed is in miles per hour, not kilometers.", "Швидкість у милях на годину, а не в кілометрах."], ["On the highway the limit is often sixty-five miles per hour.", "На трасі обмеження часто шістдесят п'ять миль на годину."], ["That's about a hundred and five kilometers per hour.", "Це приблизно сто п'ять кілометрів на годину."]], [["At a red light you can usually turn right after you stop.", "На червоне світло зазвичай можна повернути праворуч, після того як зупинилися."], ["At a stop sign you must stop completely.", "Біля знаку «стоп» треба зупинитися повністю."], ["When a school bus stops, all cars must stop too.", "Коли шкільний автобус зупиняється, усі машини теж мусять стояти."]], [["You can't use your phone in your hand while you drive.", "Не можна користуватися телефоном у руці за кермом."], ["Everybody in the car must wear a seat belt.", "Усі в машині мусять бути пристебнуті."], ["If the police stop you, stay in the car and keep your hands on the wheel.", "Якщо зупинила поліція, залишайся в машині й тримай руки на кермі."]], [["Gas stations are often self-service.", "Заправки часто самообслуговування."], ["You pay at the pump with your card.", "Платиш карткою прямо біля колонки."], ["Driving here is easy, but the distances are long!", "Їздити тут легко, але відстані великі!"]]], "q": [{"q": "Чи можна повернути праворуч на червоне?", "o": ["Зазвичай так, після зупинки", "Ніколи", "Тільки вночі"], "a": 0}, {"q": "Що мусять робити машини, коли зупиняється шкільний автобус?", "o": ["Їхати повільно", "Зупинитися", "Сигналити"], "a": 1}, {"q": "Як платять на заправці?", "o": ["Карткою біля колонки", "Готівкою касиру", "Онлайн"], "a": 0}]}, {"id": "t27", "lv": "A1", "e": "🌉", "t": "A day in San Francisco", "uk": "День у Сан-Франциско", "p": [[["On Saturday my friend and I spent a day in San Francisco.", "У суботу ми з подругою провели день у Сан-Франциско."], ["We took the train at nine o'clock.", "Ми сіли на потяг о дев'ятій."]], [["First we walked to Fisherman's Wharf.", "Спершу ми пішли до Рибальської пристані."], ["There were many tourists and sea lions!", "Там було багато туристів і морських левів!"], ["The sea lions were loud and funny.", "Морські леви були гучні й кумедні."]], [["Then we took a famous cable car.", "Потім ми проїхалися знаменитим канатним трамваєм."], ["The streets in San Francisco are very steep.", "Вулиці в Сан-Франциско дуже круті."], ["The cable car goes up and down the hills.", "Трамвай їздить вгору і вниз пагорбами."]], [["At one o'clock we had lunch in Chinatown.", "О першій ми обідали в Чайнатауні."], ["I ordered noodles with vegetables.", "Я замовила локшину з овочами."], ["After lunch we rented bikes.", "Після обіду ми взяли напрокат велосипеди."], ["We rode across the Golden Gate Bridge.", "Ми проїхали по мосту Золоті Ворота."], ["It's red and very long.", "Він червоний і дуже довгий."], ["It was windy and a little foggy.", "Було вітряно і трохи туманно."]], [["In the evening we were tired, but happy.", "Увечері ми були втомлені, але щасливі."], ["On the train home we were already making plans for next time.", "У потязі додому ми вже планували наступний раз."]]], "q": [{"q": "Кого вони бачили на пристані?", "o": ["Морських левів", "Пінгвінів", "Дельфінів"], "a": 0}, {"q": "Які вулиці в Сан-Франциско?", "o": ["Пласкі", "Дуже круті", "Широкі"], "a": 1}, {"q": "Якого кольору міст Золоті Ворота?", "o": ["Золотий", "Червоний", "Білий"], "a": 1}]}, {"id": "t28", "lv": "A1", "e": "📚", "t": "The public library", "uk": "Публічна бібліотека", "p": [[["I go to the library every week.", "Я щотижня ходжу до бібліотеки."], ["A library card is free!", "Читацький квиток безкоштовний!"], ["You only need an ID and proof of address.", "Потрібні лише документ і підтвердження адреси."]], [["At the library I borrow books in easy English.", "У бібліотеці я беру книжки простою англійською."], ["There is a special shelf for English learners.", "Там є спеціальна полиця для тих, хто вчить англійську."], ["The stories are short and the sentences are simple.", "Оповідання короткі, а речення прості."]], [["On Tuesday evenings there is a conversation group.", "У вівторок увечері там розмовна група."], ["Volunteers talk with people who are learning English.", "Волонтери розмовляють з тими, хто вчить англійську."], ["We drink coffee and talk about all kinds of topics.", "Ми п'ємо каву і говоримо на різні теми."], ["Last week we talked about holidays.", "Минулого тижня ми говорили про свята."]], [["My children borrow picture books and comics.", "Мої діти беруть книжки з картинками і комікси."], ["My son loves books about dinosaurs.", "Мій син обожнює книжки про динозаврів."]], [["At the library you can also use computers for free.", "У бібліотеці також можна безкоштовно користуватися комп'ютерами."], ["A librarian helps people with job applications.", "Бібліотекар допомагає людям із заявами на роботу."], ["For me the library is a second home.", "Для мене бібліотека — другий дім."]]], "q": [{"q": "Скільки коштує читацький квиток?", "o": ["$40", "Безкоштовно", "$10"], "a": 1}, {"q": "Коли розмовна група?", "o": ["У понеділок", "У вівторок увечері", "У суботу"], "a": 1}, {"q": "Про що любить читати син?", "o": ["Про динозаврів", "Про машини", "Про космос"], "a": 0}]}, {"id": "t29", "lv": "A1", "e": "🏋️", "t": "Working out", "uk": "Спорт", "p": [[["I want to live a healthier life.", "Я хочу жити здоровіше."], ["So I joined a gym.", "Тому я записався в спортзал."], ["I go three times a week.", "Я ходжу тричі на тиждень."]], [["On Mondays and Thursdays I lift weights.", "По понеділках і четвергах я піднімаю ваги."], ["A trainer made a plan for me.", "Тренер склав для мене план."], ["At first everything hurt!", "Спочатку все боліло!"]], [["On Saturdays I go running in the park with a group.", "По суботах я бігаю в парку з групою."], ["We run three miles.", "Ми пробігаємо три милі."], ["The group is friendly and nobody is very fast.", "Група дружня, і ніхто не біжить дуже швидко."], ["After the run we have coffee together.", "Після пробіжки ми разом п'ємо каву."]], [["My daughter plays soccer.", "Моя донька грає у футбол."], ["In America \"football\" is a different game!", "В Америці «football» — зовсім інша гра!"], ["She practices on Wednesdays and plays a game on Saturdays.", "Вона тренується по середах, а по суботах грає матч."]], [["My husband prefers to watch sports on TV.", "Мій чоловік краще дивиться спорт по телевізору."], ["He is a big fan of the Chicago Bulls.", "Він великий фанат «Чикаго Буллз»."], ["I say: \"Come running with me!\"", "Я кажу: «Ходи бігати зі мною!»"], ["He says: \"Maybe next year.\"", "Він каже: «Можливо, наступного року»."]]], "q": [{"q": "Скільки разів на тиждень він ходить у спортзал?", "o": ["2", "3", "5"], "a": 1}, {"q": "Скільки миль бігає група?", "o": ["3", "5", "10"], "a": 0}, {"q": "Як в Америці називають наш футбол?", "o": ["Football", "Soccer", "Rugby"], "a": 1}]}, {"id": "t30", "lv": "A1", "e": "💇", "t": "At the hair salon", "uk": "У перукарні", "p": [[["My hair is too long.", "У мене задовге волосся."], ["I call the hair salon to make an appointment.", "Я дзвоню в перукарню, щоб записатися."], ["\"Can I come on Thursday at four?\"", "«Можна мені прийти в четвер о четвертій?»"], ["\"Yes, that's fine. What's your name?\"", "«Так, підходить. Як ваше ім'я?»"]], [["On Thursday I'm at the salon on time.", "У четвер я вчасно в перукарні."], ["First the stylist washes my hair.", "Спершу стилістка миє мені голову."]], [["\"What would you like today?\" she asks.", "«Що бажаєте сьогодні?» — питає вона."], ["I show her a photo on my phone.", "Я показую їй фото на телефоні."], ["\"This short, but with bangs,\" I say.", "«Отак коротко, але з чубчиком», — кажу я."]], [["She cuts very carefully.", "Вона стриже дуже обережно."], ["Meanwhile we talk about the weather and vacations.", "Тим часом ми говоримо про погоду і відпустки."], ["After half an hour I look in the mirror.", "Через пів години я дивлюся в дзеркало."], ["I'm very happy with it.", "Мені дуже подобається."], ["It costs forty dollars.", "Це коштує сорок доларів."], ["In America you usually leave a tip.", "В Америці зазвичай залишають чайові."], ["I give her eight dollars.", "Я даю їй вісім доларів."]]], "q": [{"q": "Коли вона записалася?", "o": ["У четвер о 4", "У вівторок о 2", "У п'ятницю о 4"], "a": 0}, {"q": "Що вона показує стилістці?", "o": ["Журнал", "Фото на телефоні", "Малюнок"], "a": 1}, {"q": "Скільки чайових вона дає?", "o": ["$4", "$8", "$20"], "a": 1}]}, {"id": "t31", "lv": "A1", "e": "🎆", "t": "The Fourth of July", "uk": "Четверте липня", "p": [[["July fourth is Independence Day in the United States.", "Четверте липня — День незалежності США."], ["It's America's birthday.", "Це день народження Америки."], ["On this day in 1776 the country declared independence.", "Цього дня в 1776 році країна проголосила незалежність."]], [["Everybody has the day off.", "Усі мають вихідний."], ["There are American flags everywhere.", "Скрізь американські прапори."], ["People wear red, white and blue.", "Люди вдягають червоне, біле і синє."]], [["In the morning there is a parade in our town.", "Вранці в нашому містечку парад."], ["There is music and kids wave little flags.", "Грає музика, а діти махають маленькими прапорцями."]], [["In the afternoon we have a barbecue in the backyard.", "Удень у нас барбекю на задньому дворі."], ["We grill hamburgers and hot dogs.", "Ми смажимо гамбургери і хот-доги."], ["We eat watermelon and corn on the cob.", "Ми їмо кавун і варену кукурудзу."], ["The neighbors come too.", "Сусіди теж приходять."]], [["When it gets dark, we go to the park.", "Коли темніє, ми йдемо в парк."], ["There are big fireworks over the lake.", "Над озером великий феєрверк."], ["The children shout: \"Wow!\"", "Діти кричать: «Вау!»"], ["It's my favorite American holiday.", "Це моє улюблене американське свято."]]], "q": [{"q": "Що святкують 4 липня?", "o": ["Різдво", "День незалежності", "День подяки"], "a": 1}, {"q": "Що смажать на барбекю?", "o": ["Рибу", "Гамбургери і хот-доги", "Овочі"], "a": 1}, {"q": "Де дивляться феєрверк?", "o": ["У парку над озером", "Удома", "У центрі"], "a": 0}]}, {"id": "t32", "lv": "A1", "e": "🎃", "t": "Halloween", "uk": "Гелловін", "p": [[["Halloween is on October thirty-first.", "Гелловін — тридцять першого жовтня."], ["It's a fun holiday, especially for children.", "Це веселе свято, особливо для дітей."]], [["In October people decorate their houses.", "У жовтні люди прикрашають будинки."], ["They put pumpkins, skeletons and spiders in front of the door.", "Перед дверима ставлять гарбузи, скелети і павуків."], ["We carve faces into pumpkins and put a candle inside.", "Ми вирізаємо на гарбузах обличчя і ставимо всередину свічку."], ["That's called a jack-o'-lantern.", "Це називається «джек-ліхтар»."]], [["On Halloween children wear costumes.", "На Гелловін діти вдягають костюми."], ["My son was a pirate and my daughter was a cat.", "Мій син був піратом, а донька — кішкою."], ["In the evening they go from house to house.", "Увечері вони ходять від будинку до будинку."], ["They ring the doorbell and say: \"Trick or treat!\"", "Вони дзвонять у двері і кажуть: «Солодощі або капость!»"], ["The neighbors give them candy.", "Сусіди дають їм цукерки."]], [["After two hours their bags were full!", "Через дві години їхні пакети були повні!"], ["At home we checked the candy.", "Удома ми перевірили цукерки."], ["They can eat a few pieces every day.", "Вони можуть з'їдати по кілька штук щодня."], ["The rest I hide in the closet.", "Решту я ховаю в шафу."]]], "q": [{"q": "Коли Гелловін?", "o": ["31 жовтня", "1 листопада", "31 грудня"], "a": 0}, {"q": "Ким був син?", "o": ["Котом", "Піратом", "Скелетом"], "a": 1}, {"q": "Що кажуть діти біля дверей?", "o": ["Happy Halloween!", "Trick or treat!", "Hello!"], "a": 1}]}, {"id": "t33", "lv": "A1", "e": "🏖️", "t": "A day at the beach", "uk": "День на пляжі", "p": [[["In July it was very hot.", "У липні було дуже спекотно."], ["So we went to the beach in Santa Monica.", "Тому ми поїхали на пляж у Санта-Моніці."]], [["We left early because of the traffic.", "Ми виїхали рано через затори."], ["The beach was full of people.", "Пляж був повний людей."], ["We found a spot near the water.", "Ми знайшли місце біля води."]], [["The kids built a big sandcastle.", "Діти збудували великий замок з піску."], ["I went for a swim.", "Я пішов поплавати."], ["The water was cold: only sixty-five degrees!", "Вода була холодна: лише шістдесят п'ять градусів!"], ["After five minutes I came out again.", "Через п'ять хвилин я вже вийшов."]], [["We had fish tacos at a beach café.", "Ми їли тако з рибою в пляжному кафе."], ["Then we walked along the water and looked for shells.", "Потім гуляли вздовж води і шукали мушлі."], ["My daughter found twenty.", "Донька знайшла двадцять."], ["We also walked on the famous pier.", "Ми також прогулялися знаменитим пірсом."]], [["In the afternoon it got windy.", "Вдень піднявся вітер."], ["Sand flew into our eyes.", "Пісок летів нам в очі."], ["So we went home.", "Тож ми поїхали додому."], ["We were tired and a little sunburned, but it was a great day.", "Ми були втомлені й трохи обгоріли, але день був чудовий."]]], "q": [{"q": "Чому вони виїхали рано?", "o": ["Через затори", "Через спеку", "Через дітей"], "a": 0}, {"q": "Яка була вода?", "o": ["65 градусів", "85 градусів", "45 градусів"], "a": 0}, {"q": "Скільки мушель знайшла донька?", "o": ["10", "20", "30"], "a": 1}]}, {"id": "t34", "lv": "A1", "e": "♻️", "t": "Recycling", "uk": "Сортування сміття", "p": [[["In my city we separate our trash.", "У моєму місті ми сортуємо сміття."], ["At first it was difficult for me.", "Спочатку мені було важко."], ["Now I do it without thinking.", "Тепер я роблю це не замислюючись."]], [["There are three bins.", "Є три баки."], ["The blue bin is for recycling: paper, cardboard, plastic bottles and cans.", "Синій бак — для вторсировини: папір, картон, пластикові пляшки і бляшанки."], ["The green bin is for food scraps and yard waste.", "Зелений бак — для залишків їжі і садового сміття."], ["Everything else goes in the black bin.", "Усе інше йде в чорний бак."]], [["Glass bottles also go in the blue bin.", "Скляні пляшки теж ідуть у синій бак."], ["Old clothes you can bring to a donation center.", "Старий одяг можна віднести в пункт пожертв."], ["Batteries and old electronics need a special drop-off.", "Батарейки і стара техніка потребують спеціального пункту прийому."]], [["The trash truck comes on Tuesday morning.", "Сміттєвоз приїжджає у вівторок уранці."], ["You have to put the bins at the curb the night before.", "Баки треба виставити до бордюру напередодні ввечері."], ["The city website has a calendar for pickup days.", "На сайті міста є календар днів вивезення."], ["If you put the wrong things in a bin, the truck may not take it.", "Якщо покласти в бак не те, сміттєвоз може його не забрати."], ["My neighbors help me when I'm not sure.", "Сусіди допомагають, коли я не впевнена."]]], "q": [{"q": "Що йде в синій бак?", "o": ["Залишки їжі", "Папір і пляшки", "Батарейки"], "a": 1}, {"q": "Коли приїжджає сміттєвоз?", "o": ["У вівторок уранці", "У п'ятницю", "Щодня"], "a": 0}, {"q": "Куди віднести старий одяг?", "o": ["У чорний бак", "У пункт пожертв", "У синій бак"], "a": 1}]}, {"id": "t35", "lv": "A1", "e": "🛍️", "t": "Shopping online", "uk": "Покупки онлайн", "p": [[["Since my son was born, I do my grocery shopping online.", "Відколи народився син, я купую продукти онлайн."], ["It saves a lot of time.", "Це економить багато часу."]], [["On Sunday evening I open the supermarket app.", "У неділю ввечері я відкриваю застосунок супермаркету."], ["I choose what I need: milk, bread, diapers, vegetables and meat.", "Обираю потрібне: молоко, хліб, підгузки, овочі і м'ясо."], ["The app remembers what I often buy.", "Застосунок пам'ятає, що я часто купую."], ["That's very convenient.", "Це дуже зручно."]], [["Then I choose a delivery time.", "Потім обираю час доставки."], ["Tuesday between six and seven p.m. is good.", "Вівторок з шостої до сьомої вечора — підходить."], ["Delivery costs five dollars.", "Доставка коштує п'ять доларів."], ["If you order more than a hundred dollars, it's free.", "Якщо замовляєш більше ніж на сто доларів, вона безкоштовна."]], [["On Tuesday the driver comes in a van.", "У вівторок водій приїжджає на фургоні."], ["He leaves the bags at my door.", "Він залишає пакети біля моїх дверей."], ["I check everything.", "Я все перевіряю."], ["The tomatoes are a little soft.", "Помідори трохи м'які."], ["I report it in the app and I get my money back.", "Я повідомляю про це в застосунку і отримую гроші назад."], ["But on Saturdays I still like to go to the farmers market.", "Але по суботах я все одно люблю ходити на фермерський ринок."]]], "q": [{"q": "Коли вона робить замовлення?", "o": ["У неділю ввечері", "У понеділок", "У п'ятницю"], "a": 0}, {"q": "Скільки коштує доставка?", "o": ["$2", "$5", "$10"], "a": 1}, {"q": "Що не так із помідорами?", "o": ["Їх немає", "Вони трохи м'які", "Вони дорогі"], "a": 1}]}, {"id": "t36", "lv": "A1", "e": "🤝", "t": "A new coworker", "uk": "Новий колега", "p": [[["A new coworker started at my job.", "На моїй роботі почав працювати новий колега."], ["His name is Ahmed and he is from Egypt.", "Його звати Ахмед, він з Єгипту."], ["He has lived in America for ten years and speaks English very well.", "Він живе в Америці десять років і дуже добре говорить англійською."]], [["My boss asks me to help Ahmed.", "Начальник просить мене допомогти Ахмедові."], ["I show him the office: the kitchen, the printer and the meeting room.", "Я показую йому офіс: кухню, принтер і переговорну."], ["I explain how the computer system works.", "Я пояснюю, як працює комп'ютерна система."]], [["At noon we have lunch together in the break room.", "Опівдні ми разом обідаємо в кімнаті відпочинку."], ["Ahmed tells me about his family.", "Ахмед розповідає про свою родину."], ["He has three kids and he loves soccer.", "У нього троє дітей, і він любить футбол."], ["I tell him about Ukraine.", "Я розповідаю про Україну."], ["He asks many questions and listens carefully.", "Він ставить багато питань і уважно слухає."]], [["After a week Ahmed knows everything.", "Через тиждень Ахмед уже все знає."], ["Now he even helps me with difficult English words!", "Тепер він навіть допомагає мені зі складними англійськими словами!"], ["On Fridays coworkers sometimes bring donuts.", "По п'ятницях колеги іноді приносять пончики."], ["Ahmed brings Egyptian cookies.", "Ахмед приносить єгипетське печиво."], ["Everybody loves them.", "Усім воно дуже смакує."]]], "q": [{"q": "Звідки Ахмед?", "o": ["З Туреччини", "З Єгипту", "З Сирії"], "a": 1}, {"q": "Скільки в нього дітей?", "o": ["Двоє", "Троє", "Четверо"], "a": 1}, {"q": "Що приносить Ахмед?", "o": ["Пончики", "Єгипетське печиво", "Фрукти"], "a": 1}]}, {"id": "t37", "lv": "A1", "e": "🌻", "t": "My community garden", "uk": "Мій громадський город", "p": [[["I live in an apartment without a yard.", "Я живу в квартирі без двору."], ["So I rent a small plot in a community garden.", "Тому я орендую маленьку ділянку в громадському городі."], ["It costs fifty dollars a year.", "Це коштує п'ятдесят доларів на рік."]], [["My plot is ten feet by ten feet.", "Моя ділянка десять на десять футів."], ["I grow tomatoes, lettuce, beans and strawberries.", "Я вирощую помідори, салат, квасолю і полуницю."], ["There are also sunflowers.", "Там ростуть і соняшники."], ["They are already six feet tall!", "Вони вже шість футів заввишки!"]], [["In the spring I plant the seeds.", "Навесні я сію насіння."], ["In the summer I have to water often.", "Улітку треба часто поливати."], ["When I'm on vacation, my garden neighbor helps.", "Коли я у відпустці, допомагає сусід по ділянці."]], [["People from many countries garden here.", "Тут городничають люди з багатьох країн."], ["We trade vegetables and give each other tips.", "Ми обмінюємося овочами і даємо одне одному поради."], ["A Mexican neighbor taught me how to grow hot peppers.", "Сусідка-мексиканка навчила мене вирощувати гострий перець."], ["I taught her how to make borscht.", "Я навчила її варити борщ."]], [["In the fall I pick the last vegetables.", "Восени я збираю останні овочі."], ["I make soup and jam for the winter.", "Я роблю суп і варення на зиму."], ["The garden is my place to relax.", "Город — моє місце для відпочинку."]]], "q": [{"q": "Скільки коштує ділянка?", "o": ["$50 на рік", "$50 на місяць", "Безкоштовно"], "a": 0}, {"q": "Що вже шість футів заввишки?", "o": ["Помідори", "Соняшники", "Квасоля"], "a": 1}, {"q": "Чого авторка навчила сусідку?", "o": ["Варити борщ", "Вирощувати перець", "Пекти хліб"], "a": 0}]}, {"id": "t38", "lv": "A1", "e": "🎄", "t": "Christmas in America", "uk": "Різдво в Америці", "p": [[["Christmas is on December twenty-fifth.", "Різдво — двадцять п'ятого грудня."], ["It's the biggest holiday of the year for many Americans.", "Для багатьох американців це найбільше свято року."]], [["After Thanksgiving the stores fill up with decorations.", "Після Дня подяки магазини наповнюються прикрасами."], ["People put lights on their houses.", "Люди прикрашають будинки вогниками."], ["Some streets look like a fairy tale!", "Деякі вулиці схожі на казку!"], ["We buy a real Christmas tree and decorate it together.", "Ми купуємо справжню ялинку і разом її прикрашаємо."]], [["Children write letters to Santa Claus.", "Діти пишуть листи Санта-Клаусу."], ["On Christmas Eve they leave cookies and milk for him.", "На Святвечір вони залишають йому печиво й молоко."], ["They also leave a carrot for his reindeer.", "А ще моркву для його оленів."], ["In the morning there are presents under the tree.", "Уранці під ялинкою подарунки."]], [["On Christmas Day families eat a big dinner together.", "На Різдво родини разом сідають за велику вечерю."], ["We often eat ham or turkey.", "Ми часто їмо шинку або індичку."], ["We also hang stockings by the fireplace.", "Ми також вішаємо панчохи біля каміна."], ["Santa fills them with small gifts and candy.", "Санта наповнює їх маленькими подарунками і цукерками."], ["For me Christmas is the coziest time of the year.", "Для мене Різдво — найзатишніший час року."]]], "q": [{"q": "Коли Різдво в Америці?", "o": ["25 грудня", "7 січня", "6 грудня"], "a": 0}, {"q": "Що діти залишають Санті?", "o": ["Печиво і молоко", "Цукерки", "Гроші"], "a": 0}, {"q": "Що вішають біля каміна?", "o": ["Панчохи", "Прапори", "Ліхтарики"], "a": 0}]}, {"id": "t39", "lv": "A1", "e": "📞", "t": "Calling customer service", "uk": "Дзвінок у службу підтримки", "p": [[["My internet stopped working on Monday.", "У понеділок у мене перестав працювати інтернет."], ["So I called customer service.", "Тож я подзвонила в службу підтримки."]], [["First a robot voice answered.", "Спершу відповів голос робота."], ["\"For billing, press one. For technical support, press two.\"", "«Щодо рахунків — натисніть один. Технічна підтримка — два»."], ["I pressed two.", "Я натиснула два."], ["Then I waited fifteen minutes and listened to music.", "Потім я чекала п'ятнадцять хвилин і слухала музику."]], [["Finally a person answered.", "Нарешті відповіла людина."], ["\"Hi, my name is Kevin. How can I help you today?\"", "«Добрий день, мене звати Кевін. Чим можу допомогти?»"], ["I explained the problem.", "Я пояснила проблему."], ["He asked for my account number and my address.", "Він спитав номер мого рахунку й адресу."]], [["\"Can you restart your router?\" he asked.", "«Можете перезапустити роутер?» — спитав він."], ["I unplugged it, waited thirty seconds and plugged it in again.", "Я відключила його, почекала тридцять секунд і знову ввімкнула."], ["It still didn't work.", "Все одно не працювало."], ["\"Okay, I'll send a technician tomorrow between nine and twelve.\"", "«Гаразд, я надішлю техніка завтра з дев'ятої до дванадцятої»."]], [["The next day the technician came at eleven.", "Наступного дня технік прийшов об одинадцятій."], ["He changed a cable, and the internet worked again.", "Він замінив кабель, і інтернет знову запрацював."], ["I was proud that I did it all in English!", "Я пишалася, що все зробила англійською!"]]], "q": [{"q": "Яку кнопку вона натиснула?", "o": ["Один", "Два", "Три"], "a": 1}, {"q": "Скільки вона чекала?", "o": ["5 хвилин", "15 хвилин", "Годину"], "a": 1}, {"q": "Що замінив технік?", "o": ["Роутер", "Кабель", "Телефон"], "a": 1}]}, {"id": "t40", "lv": "A2", "e": "👔", "t": "A job interview", "uk": "Співбесіда", "p": [[["Two weeks ago I saw a job ad for an office assistant.", "Два тижні тому я побачила оголошення про роботу офісної помічниці."], ["I wrote a cover letter and sent my résumé.", "Я написала супровідний лист і надіслала резюме."], ["A few days later they called me for an interview.", "Через кілька днів мене запросили на співбесіду."]], [["I was very nervous.", "Я дуже нервувала."], ["The night before, I practiced with my English teacher.", "Напередодні ввечері я тренувалася з учителькою англійської."], ["She said: \"Be honest about what you can do and what you still want to learn.\"", "Вона сказала: «Чесно розкажи, що вмієш і чого ще хочеш навчитися»."]], [["The interview was with two people: the manager and someone from HR.", "Співбесіда була з двома людьми: менеджеркою і працівником відділу кадрів."], ["They asked why I wanted this job.", "Вони спитали, чому я хочу цю роботу."], ["I told them that I had worked in an office in Ukraine for ten years.", "Я розповіла, що десять років працювала в офісі в Україні."], ["Then they asked about my strengths and weaknesses.", "Потім спитали про мої сильні і слабкі сторони."], ["I said that I'm very organized, but my English still needs to improve.", "Я сказала, що я дуже організована, але моя англійська ще має покращитися."]], [["The manager smiled and said that honesty is important.", "Менеджерка всміхнулася і сказала, що чесність важлива."], ["At the end I could ask questions.", "Наприкінці я могла поставити питання."], ["I asked about the hours and if there was any training.", "Я спитала про робочий час і чи є навчання."], ["They said the company pays for English classes.", "Вони сказали, що компанія оплачує курси англійської."]], [["A week later they called me.", "Через тиждень мені подзвонили."], ["I got the job!", "Мене взяли!"], ["I'm starting next month.", "Я починаю наступного місяця."]]], "q": [{"q": "На яку посаду була співбесіда?", "o": ["Продавчині", "Офісної помічниці", "Вчительки"], "a": 1}, {"q": "Що вона назвала слабкою стороною?", "o": ["Англійську", "Пунктуальність", "Комп'ютер"], "a": 0}, {"q": "Що оплачує компанія?", "o": ["Проїзд", "Курси англійської", "Обіди"], "a": 1}]}, {"id": "t41", "lv": "A2", "e": "🎒", "t": "American schools", "uk": "Американська школа", "p": [[["When my kids started school here, I had to learn how the American school system works.", "Коли мої діти пішли тут до школи, мені довелося розібратися в американській шкільній системі."], ["It's different from Ukraine.", "Вона відрізняється від української."]], [["Children start kindergarten at five years old.", "Діти йдуть у підготовчий клас у п'ять років."], ["Then there is elementary school, from first to fifth grade.", "Потім початкова школа, з першого по п'ятий клас."], ["After that comes middle school, and then high school.", "Після неї — середня школа, а потім старша."], ["High school is from ninth to twelfth grade.", "Старша школа — з дев'ятого по дванадцятий клас."]], [["The school year starts in late August or September and ends in June.", "Навчальний рік починається наприкінці серпня або у вересні і закінчується в червні."], ["Summer vacation is long: about ten weeks.", "Літні канікули довгі: близько десяти тижнів."]], [["What surprised me: students choose some of their classes themselves.", "Мене здивувало: учні самі обирають деякі предмети."], ["Sports are very important.", "Спорт дуже важливий."], ["Many kids play on school teams.", "Багато дітей грає в шкільних командах."], ["Parents often volunteer at school events.", "Батьки часто волонтерять на шкільних заходах."]], [["Twice a year there are parent-teacher conferences.", "Двічі на рік є зустрічі батьків з учителями."], ["There you hear how your child is doing.", "Там дізнаєшся, як справи в дитини."], ["At the end of high school there is a big graduation ceremony.", "Наприкінці старшої школи велика випускна церемонія."], ["Students wear caps and gowns.", "Учні вдягають шапочки і мантії."]]], "q": [{"q": "З якого віку йдуть у підготовчий клас?", "o": ["З 4", "З 5", "З 7"], "a": 1}, {"q": "Скільки тривають літні канікули?", "o": ["3 тижні", "10 тижнів", "6 місяців"], "a": 1}, {"q": "Що вдягають на випускний?", "o": ["Костюми", "Шапочки і мантії", "Форму"], "a": 1}]}, {"id": "t42", "lv": "A2", "e": "🏡", "t": "Life in a small town", "uk": "Життя в маленькому місті", "p": [[["Three years ago we moved from Los Angeles to a small town in Vermont.", "Три роки тому ми переїхали з Лос-Анджелеса в маленьке містечко у Вермонті."], ["Many friends thought it was a strange choice.", "Багато друзів вважали це дивним вибором."]], [["In Los Angeles we lived in a small apartment, and the rent was very high.", "У Лос-Анджелесі ми жили в маленькій квартирі, і оренда була дуже висока."], ["We spent two hours a day in traffic.", "Ми проводили по дві години на день у заторах."], ["Here we have a house with a big yard, and it costs less.", "Тут у нас будинок з великим двором, і він дешевший."]], [["Life is slower here.", "Життя тут повільніше."], ["I know my neighbors and the kids play outside.", "Я знаю сусідів, а діти граються надворі."], ["In the stores people say hello and have time for a chat.", "У магазинах люди вітаються і мають час поговорити."], ["That helps a lot with my English.", "Це дуже допомагає з англійською."]], [["Of course, there are also disadvantages.", "Звісно, є й недоліки."], ["There are fewer jobs and fewer things to do.", "Тут менше роботи і менше розваг."], ["The winters are long and very cold.", "Зими довгі й дуже холодні."], ["Sometimes we have snow from November to April!", "Іноді сніг лежить з листопада до квітня!"]], [["But we have no regrets.", "Але ми не шкодуємо."], ["In the fall the forests turn red, orange and yellow.", "Восени ліси стають червоними, помаранчевими і жовтими."], ["It's beautiful.", "Це прекрасно."], ["For our family this is the right place.", "Для нашої родини це правильне місце."]]], "q": [{"q": "Куди переїхала родина?", "o": ["До Нью-Йорка", "До Вермонту", "До Флориди"], "a": 1}, {"q": "Скільки часу вони проводили в заторах?", "o": ["Годину", "Дві години", "Пів години"], "a": 1}, {"q": "Який недолік назвала авторка?", "o": ["Довгі холодні зими", "Дорогі продукти", "Шум"], "a": 0}]}, {"id": "t43", "lv": "A2", "e": "🥗", "t": "A healthy lifestyle", "uk": "Здоровий спосіб життя", "p": [[["Last year I often felt tired and had little energy.", "Минулого року я часто почувалася втомленою і мала мало енергії."], ["My doctor told me I needed to live a healthier life.", "Лікар сказав, що мені треба жити здоровіше."], ["He gave me three pieces of advice: eat better, move more and sleep better.", "Він дав мені три поради: краще їсти, більше рухатися і краще спати."]], [["First I changed my diet.", "Спершу я змінила харчування."], ["I used to eat a lot of fast food and drink a lot of soda.", "Раніше я їла багато фастфуду і пила багато газованки."], ["Now I eat fruit and vegetables every day.", "Тепер я щодня їм фрукти й овочі."], ["Instead of soda I drink water or tea.", "Замість газованки я п'ю воду або чай."], ["I cook at home more often instead of ordering takeout.", "Я частіше готую вдома замість того, щоб замовляти їжу."]], [["Then I started to move more.", "Потім я почала більше рухатися."], ["I walk to work now instead of driving.", "Тепер я ходжу на роботу пішки замість машини."], ["Twice a week I go to a yoga class at the community center.", "Двічі на тиждень я ходжу на йогу в громадському центрі."], ["It only costs eight dollars a class.", "Це коштує лише вісім доларів за заняття."]], [["Sleep was the hardest part.", "Найважче було зі сном."], ["I always looked at my phone until late at night.", "Я завжди дивилася в телефон допізна."], ["Now I leave it in the kitchen at ten o'clock.", "Тепер о десятій я залишаю його на кухні."], ["I read a book and go to sleep at eleven.", "Я читаю книжку і лягаю спати об одинадцятій."]], [["After three months I felt the difference.", "Через три місяці я відчула різницю."], ["I have more energy and I'm in a better mood.", "У мене більше енергії і кращий настрій."]]], "q": [{"q": "Скільки порад дав лікар?", "o": ["Дві", "Три", "П'ять"], "a": 1}, {"q": "Що вона п'є замість газованки?", "o": ["Сік", "Воду або чай", "Каву"], "a": 1}, {"q": "Що було найважче?", "o": ["Їжа", "Спорт", "Сон"], "a": 2}]}, {"id": "t44", "lv": "A2", "e": "🫶", "t": "My first American friend", "uk": "Моя перша американська подруга", "p": [[["When I first came to America, I often felt lonely.", "Коли я тільки приїхала до Америки, я часто почувалася самотньою."], ["I only knew other Ukrainians.", "Я знала тільки інших українців."]], [["One day I was sitting in the park with my daughter.", "Одного дня я сиділа в парку з донькою."], ["A woman with a little boy of the same age sat down next to me.", "Жінка з хлопчиком того ж віку сіла поруч зі мною."], ["The kids started playing together.", "Діти почали гратися разом."], ["She asked me where I was from.", "Вона спитала, звідки я."], ["I answered in my bad English.", "Я відповіла своєю поганою англійською."]], [["Her name was Megan and she was very patient.", "Її звали Меган, і вона була дуже терплячою."], ["She spoke slowly and repeated things when I didn't understand.", "Вона говорила повільно і повторювала, коли я не розуміла."], ["We agreed to meet in the park again the next week.", "Ми домовилися зустрітися в парку наступного тижня."]], [["Since then we have seen each other almost every week.", "Відтоді ми бачимося майже щотижня."], ["Megan explains American customs to me.", "Меган пояснює мені американські звичаї."], ["I teach her Ukrainian recipes.", "Я вчу її українських рецептів."], ["She loves varenyky!", "Вона обожнює вареники!"]], [["Last month I celebrated my birthday.", "Минулого місяця я святкувала день народження."], ["Megan came with her husband and brought a homemade cake.", "Меган прийшла з чоловіком і принесла домашній торт."], ["She said: \"Your English has gotten so much better!\"", "Вона сказала: «Твоя англійська стала набагато кращою!»"], ["That was the best present.", "Це був найкращий подарунок."]]], "q": [{"q": "Де вони познайомилися?", "o": ["У школі", "У парку", "На роботі"], "a": 1}, {"q": "Чого авторка вчить Меган?", "o": ["Українських рецептів", "Української мови", "Танців"], "a": 0}, {"q": "Що було найкращим подарунком?", "o": ["Торт", "Слова про її англійську", "Квіти"], "a": 1}]}, {"id": "t45", "lv": "A2", "e": "🙌", "t": "A day as a volunteer", "uk": "День волонтером", "p": [[["Every Saturday I volunteer at a food bank.", "Щосуботи я волонтерю в продовольчому банку."], ["The food bank gives free food to families who don't have much money.", "Продовольчий банк безкоштовно дає їжу родинам з малим доходом."], ["Supermarkets and companies donate products they can't sell anymore.", "Супермаркети і компанії віддають продукти, які вже не можуть продати."]], [["At nine o'clock I start in the warehouse.", "О дев'ятій я починаю на складі."], ["I check the dates on the products.", "Я перевіряю дати на продуктах."], ["Then I sort everything: vegetables, bread, dairy and canned food.", "Потім усе сортую: овочі, хліб, молочне і консерви."], ["We pack boxes for about a hundred families.", "Ми пакуємо коробки приблизно для ста родин."]], [["At noon the families come.", "Опівдні приходять родини."], ["They show their card and get a box.", "Вони показують картку й отримують коробку."], ["Some people feel a little embarrassed.", "Декому трохи ніяково."], ["That's why it's important to be friendly and have a little chat.", "Тому важливо бути привітними і трохи поговорити."]], [["The other volunteers are very different.", "Інші волонтери дуже різні."], ["There is a retired teacher, a college student and a woman from Syria.", "Є вчитель на пенсії, студент коледжу і жінка із Сирії."], ["We work hard, but we also laugh a lot.", "Ми важко працюємо, але й багато сміємося."]], [["Volunteering is good for my English and for my network.", "Волонтерство корисне для моєї англійської і кола знайомств."], ["But the most important thing is that I can help other people.", "Але найголовніше — що я можу допомагати іншим."], ["I know what it's like to need help.", "Я знаю, як це — потребувати допомоги."]]], "q": [{"q": "Що дає продовольчий банк?", "o": ["Одяг", "Безкоштовну їжу", "Гроші"], "a": 1}, {"q": "Для скількох родин пакують коробки?", "o": ["50", "100", "200"], "a": 1}, {"q": "Що найголовніше для авторки?", "o": ["Англійська", "Допомагати іншим", "Знайомства"], "a": 1}]}, {"id": "t46", "lv": "A2", "e": "🏥", "t": "Health care in America", "uk": "Медицина в Америці", "p": [[["The American health care system was confusing for me at first.", "Американська система охорони здоров'я спершу мене збивала з пантелику."]], [["Most people get health insurance through their job.", "Більшість людей отримує медстрахування через роботу."], ["Every month you pay a premium.", "Щомісяця сплачуєш внесок."], ["There is also a deductible.", "Є також франшиза."], ["That means you pay the first costs of the year yourself.", "Це означає, що перші витрати за рік оплачуєш сам."], ["When you see a doctor, you often pay a small amount called a copay.", "Коли йдеш до лікаря, часто платиш невелику суму — доплату."]], [["Your first step is usually your primary care doctor.", "Першим кроком зазвичай є лікар первинної ланки."], ["For a specialist you often need a referral.", "До вузького спеціаліста часто потрібне направлення."], ["It's important to choose doctors who are \"in network\".", "Важливо обирати лікарів «у мережі» твого страховика."], ["Out-of-network doctors can be much more expensive.", "Лікарі поза мережею можуть бути набагато дорожчими."]], [["If you get sick in the evening or on the weekend, you can go to urgent care.", "Якщо захворів увечері чи на вихідних, можна піти в пункт невідкладної допомоги."], ["In a real emergency you call nine-one-one.", "У справжній надзвичайній ситуації дзвониш дев'ять-один-один."], ["The emergency room is for serious problems only.", "Відділення невідкладної допомоги — лише для серйозних проблем."]], [["Medical bills can be very high.", "Медичні рахунки можуть бути дуже високими."], ["My tip: always ask how much something costs before you agree.", "Моя порада: завжди питай, скільки щось коштує, перш ніж погоджуватися."], ["And check every bill carefully.", "І уважно перевіряй кожен рахунок."], ["Mistakes happen more often than you think!", "Помилки трапляються частіше, ніж здається!"]]], "q": [{"q": "Як більшість людей отримує страховку?", "o": ["Через роботу", "Від держави", "Не отримує"], "a": 0}, {"q": "Куди йти ввечері з легкою хворобою?", "o": ["В urgent care", "Одразу в лікарню", "Чекати ранку"], "a": 0}, {"q": "Який номер екстреної допомоги?", "o": ["112", "911", "101"], "a": 1}]}, {"id": "t47", "lv": "A2", "e": "🗽", "t": "A nation of immigrants", "uk": "Країна іммігрантів", "p": [[["The United States is often called a nation of immigrants.", "США часто називають країною іммігрантів."], ["Except for Native Americans, almost every family came from somewhere else.", "Окрім корінних американців, майже кожна родина прибула звідкись."]], [["In the past, many immigrants came by ship.", "У минулому багато іммігрантів припливали кораблями."], ["Between 1892 and 1954, more than twelve million people arrived at Ellis Island in New York.", "З 1892 по 1954 рік понад дванадцять мільйонів людей прибули на острів Елліс у Нью-Йорку."], ["The first thing they saw was the Statue of Liberty.", "Першим, що вони бачили, була Статуя Свободи."], ["For many of them it was a symbol of hope.", "Для багатьох вона була символом надії."]], [["Immigrants brought their languages, food and traditions.", "Іммігранти привезли свої мови, їжу і традиції."], ["Pizza came from Italy, bagels from Eastern Europe and tacos from Mexico.", "Піца прийшла з Італії, бейгли — зі Східної Європи, тако — з Мексики."], ["Today these are typical American foods.", "Сьогодні це типова американська їжа."]], [["There are also many Ukrainians in America.", "В Америці також багато українців."], ["The first big group came more than a hundred years ago.", "Перша велика група приїхала понад сто років тому."], ["They worked in mines and factories, and built churches.", "Вони працювали в шахтах і на фабриках і будували церкви."], ["In cities like Chicago and New York there are Ukrainian neighborhoods.", "У таких містах, як Чикаго і Нью-Йорк, є українські квартали."]], [["Today about one in seven Americans was born in another country.", "Сьогодні приблизно кожен сьомий американець народився в іншій країні."], ["That makes the country very diverse.", "Це робить країну дуже різноманітною."], ["You can hear dozens of languages on a New York subway.", "У нью-йоркському метро можна почути десятки мов."]]], "q": [{"q": "Скільки людей прибуло на острів Елліс?", "o": ["1 мільйон", "Понад 12 мільйонів", "50 мільйонів"], "a": 1}, {"q": "Звідки прийшли бейгли?", "o": ["З Італії", "Зі Східної Європи", "З Мексики"], "a": 1}, {"q": "Яка частка американців народилася в іншій країні?", "o": ["Кожен сьомий", "Половина", "Кожен сотий"], "a": 0}]}, {"id": "t48", "lv": "A2", "e": "🚇", "t": "Public transportation", "uk": "Громадський транспорт", "p": [[["In big American cities like New York, Chicago and Boston, many people use public transportation.", "У великих американських містах — Нью-Йорку, Чикаго, Бостоні — багато хто користується громадським транспортом."], ["In smaller cities most people drive.", "У менших містах більшість їздить машиною."]], [["In New York you can pay for the subway and bus with a contactless card or your phone.", "У Нью-Йорку за метро і автобус можна платити безконтактною карткою або телефоном."], ["You just tap at the turnstile.", "Просто прикладаєш до турнікета."], ["One ride costs about three dollars.", "Одна поїздка коштує близько трьох доларів."], ["After twelve rides in one week, the rest of the week is free.", "Після дванадцяти поїздок за тиждень решта тижня безкоштовна."]], [["Rush hour is between seven and nine in the morning and between five and seven in the evening.", "Години пік — з сьомої до дев'ятої ранку і з п'ятої до сьомої вечора."], ["Then the trains are very crowded.", "Тоді потяги переповнені."]], [["There are local trains and express trains.", "Є звичайні й експрес-потяги."], ["Express trains don't stop at every station.", "Експреси зупиняються не на кожній станції."], ["Be careful to get on the right one!", "Будь уважний, щоб сісти на правильний!"]], [["On the weekends there is often construction.", "На вихідних часто тривають ремонтні роботи."], ["Then some trains don't run, or they run on a different line.", "Тоді деякі потяги не курсують або їдуть іншою лінією."], ["Always check the app before you go.", "Завжди перевіряй застосунок перед виходом."], ["Public transportation isn't perfect, but it's cheaper than parking in the city!", "Громадський транспорт не ідеальний, але дешевший за паркування в місті!"]]], "q": [{"q": "Скільки коштує одна поїздка в Нью-Йорку?", "o": ["$1", "Близько $3", "$10"], "a": 1}, {"q": "Що буде після 12 поїздок за тиждень?", "o": ["Решта тижня безкоштовна", "Знижка 10%", "Нічого"], "a": 0}, {"q": "Чим відрізняються експреси?", "o": ["Дорожчі", "Не на кожній станції зупиняються", "Тільки вночі"], "a": 1}]}, {"id": "t49", "lv": "A2", "e": "🍁", "t": "Seasons and holidays", "uk": "Пори року і свята", "p": [[["The American year is full of holidays.", "Американський рік сповнений свят."]], [["In January people make New Year's resolutions.", "У січні люди дають новорічні обіцянки."], ["Many promise to exercise more or eat healthier.", "Багато хто обіцяє більше займатися спортом або здоровіше харчуватися."], ["In February there is Valentine's Day.", "У лютому — День святого Валентина."], ["Couples give each other cards, flowers and chocolate.", "Пари дарують одне одному листівки, квіти і шоколад."]], [["In May there is Memorial Day.", "У травні — День пам'яті."], ["Americans remember soldiers who died for their country.", "Американці згадують солдатів, які загинули за свою країну."], ["It's also the unofficial start of summer.", "Це також неофіційний початок літа."], ["On the first Monday of September there is Labor Day.", "У перший понеділок вересня — День праці."], ["It's the unofficial end of summer and the last long weekend before school.", "Це неофіційний кінець літа і останні довгі вихідні перед школою."]], [["In the fall the leaves change color.", "Восени листя змінює колір."], ["Many people go apple picking or visit pumpkin patches.", "Багато хто їде збирати яблука або на гарбузові поля."], ["Then come Halloween and Thanksgiving.", "Потім Гелловін і День подяки."], ["The day after Thanksgiving is Black Friday, the biggest shopping day of the year.", "Наступний день після Дня подяки — Чорна п'ятниця, найбільший день покупок у році."]], [["The year ends with Christmas and New Year's Eve.", "Рік закінчується Різдвом і переднім днем Нового року."], ["In New York, a million people watch the ball drop in Times Square at midnight.", "У Нью-Йорку мільйон людей дивиться, як опівночі на Таймс-сквер опускається куля."]]], "q": [{"q": "Що дарують на День святого Валентина?", "o": ["Листівки, квіти і шоколад", "Гроші", "Одяг"], "a": 0}, {"q": "Що таке Чорна п'ятниця?", "o": ["Найбільший день покупок", "День жалоби", "Вихідний"], "a": 0}, {"q": "Що опускається на Таймс-сквер?", "o": ["Куля", "Зірка", "Прапор"], "a": 0}]}, {"id": "t50", "lv": "A2", "e": "🌱", "t": "Living green", "uk": "Екологічне життя", "p": [[["More and more Americans are trying to live in a more sustainable way.", "Дедалі більше американців намагаються жити екологічніше."], ["Our family is trying too.", "Наша родина теж старається."]], [["Last year we put solar panels on our roof.", "Минулого року ми поставили на дах сонячні панелі."], ["They produce enough electricity for almost the whole year.", "Вони виробляють достатньо електрики майже на весь рік."], ["It was expensive at first, but our electric bill is much lower now.", "Спочатку це було дорого, але рахунок за електрику тепер набагато менший."], ["The government also gave us a tax credit.", "Держава також дала нам податкову пільгу."]], [["We eat meat only a few times a week.", "Ми їмо м'ясо лише кілька разів на тиждень."], ["I buy local vegetables at the farmers market.", "Я купую місцеві овочі на фермерському ринку."], ["I often buy clothes at thrift stores.", "Одяг я часто купую в секонд-хендах."], ["That's cheaper and better for the environment.", "Це дешевше і краще для довкілля."]], [["For short trips we ride our bikes.", "На короткі відстані ми їздимо велосипедами."], ["We sold our second car.", "Ми продали другу машину."], ["When we need a car, we use a car-sharing app.", "Коли потрібна машина, ми користуємося каршерингом."]], [["Of course, we're not perfect.", "Звісно, ми не ідеальні."], ["We still fly to visit family once a year.", "Ми все ще раз на рік летимо до родини."], ["But I think every small step matters.", "Але я вважаю, що кожен маленький крок має значення."], ["Our children are learning this from a young age.", "Наші діти вчаться цього змалку."]]], "q": [{"q": "Що вони поставили на дах?", "o": ["Антену", "Сонячні панелі", "Вітряк"], "a": 1}, {"q": "Де вона купує одяг?", "o": ["У торговому центрі", "У секонд-хендах", "Онлайн"], "a": 1}, {"q": "Що вони продали?", "o": ["Будинок", "Другу машину", "Велосипед"], "a": 1}]}, {"id": "t51", "lv": "A2", "e": "📝", "t": "Working in America", "uk": "Робота в Америці", "p": [[["If you start working in the United States, you need to know some important rules.", "Якщо починаєш працювати в США, треба знати деякі важливі правила."]], [["First you need a Social Security number.", "Спершу потрібен номер соціального страхування."], ["Your employer uses it to report your salary and taxes.", "Роботодавець використовує його, щоб звітувати про зарплату і податки."], ["On your first day you fill out a lot of forms.", "У перший день заповнюєш багато бланків."]], [["Many jobs pay by the hour.", "Багато робіт оплачуються погодинно."], ["If you work more than forty hours a week, you usually get overtime pay.", "Якщо працюєш понад сорок годин на тиждень, зазвичай отримуєш понаднормові."], ["Many people are paid every two weeks, not once a month.", "Багатьом платять кожні два тижні, а не раз на місяць."], ["On your pay stub you can see how much tax was taken out.", "На розрахунковому листку видно, скільки утримали податків."]], [["Paid vacation is often shorter than in Europe.", "Оплачувана відпустка часто коротша, ніж у Європі."], ["Many people get only ten to fifteen days a year.", "Багато хто отримує лише десять-п'ятнадцять днів на рік."], ["When you're sick, you call or email your manager early in the morning.", "Коли захворів, рано вранці телефонуєш або пишеш менеджерові."]], [["The work culture is friendly, but fast.", "Робоча культура дружня, але швидка."], ["People call their boss by their first name.", "Начальника називають на ім'я."], ["Small talk is very important: How was your weekend?", "Невимушена розмова дуже важлива: Як минули вихідні?"], ["And in April everybody has to file their taxes!", "А у квітні всі мусять подати податкову декларацію!"]]], "q": [{"q": "Що потрібно для роботи спершу?", "o": ["Номер соціального страхування", "Банківська картка", "Машина"], "a": 0}, {"q": "Як часто багатьом платять?", "o": ["Щотижня", "Кожні два тижні", "Раз на рік"], "a": 1}, {"q": "Коли подають податкову декларацію?", "o": ["У квітні", "У грудні", "У січні"], "a": 0}]}, {"id": "t52", "lv": "A2", "e": "🔧", "t": "A problem with my landlord", "uk": "Проблема з орендодавцем", "p": [[["Last winter the heating in my apartment broke.", "Минулої зими в моїй квартирі зламалося опалення."], ["It was ten degrees outside and the apartment got colder and colder.", "Надворі було десять градусів за Фаренгейтом, і в квартирі ставало дедалі холодніше."]], [["I called my landlord right away.", "Я одразу подзвонила орендодавцю."], ["He didn't answer, so I sent him a text and an email.", "Він не відповів, тож я надіслала повідомлення і лист."], ["I described the problem and asked for a quick repair.", "Я описала проблему і попросила швидко полагодити."], ["Two days later I still had no answer.", "Через два дні відповіді все ще не було."]], [["My neighbor told me about a free tenant hotline.", "Сусідка розповіла мені про безкоштовну гарячу лінію для орендарів."], ["The woman on the phone explained that landlords must provide heat in the winter.", "Жінка на телефоні пояснила, що орендодавці зобов'язані забезпечувати опалення взимку."], ["It's the law in my city.", "У моєму місті це закон."], ["She helped me write an official letter.", "Вона допомогла мені написати офіційний лист."]], [["In the letter I gave the landlord three days to fix the heat.", "У листі я дала орендодавцеві три дні на ремонт опалення."], ["I also wrote that otherwise I would report it to the city.", "Я також написала, що інакше повідомлю місту."]], [["The next day the landlord called.", "Наступного дня подзвонив орендодавець."], ["He apologized and sent a repairman.", "Він вибачився і надіслав майстра."], ["In a few hours the heating was fixed.", "За кілька годин опалення полагодили."], ["I learned that tenants have rights, and you need to know them.", "Я зрозуміла, що орендарі мають права, і їх треба знати."]]], "q": [{"q": "Що зламалося?", "o": ["Холодильник", "Опалення", "Двері"], "a": 1}, {"q": "Хто допоміг написати лист?", "o": ["Сусідка", "Гаряча лінія для орендарів", "Друг"], "a": 1}, {"q": "Скільки днів вона дала орендодавцеві?", "o": ["1", "3", "7"], "a": 1}]}, {"id": "t53", "lv": "A2", "e": "🍔", "t": "The history of the hamburger", "uk": "Історія гамбургера", "p": [[["The hamburger is a symbol of American food, but its name comes from Germany.", "Гамбургер — символ американської їжі, але його назва походить з Німеччини."], ["In the nineteenth century, German immigrants from the city of Hamburg brought a kind of beef patty to America.", "У дев'ятнадцятому столітті німецькі іммігранти з міста Гамбург привезли до Америки щось на зразок яловичої котлети."]], [["Nobody knows exactly who made the first hamburger in a bun.", "Ніхто точно не знає, хто зробив перший гамбургер у булочці."], ["Several towns say they invented it.", "Кілька міст стверджують, що винайшли його."], ["But by 1904, people were eating hamburgers at the World's Fair in St. Louis.", "Але вже в 1904 році люди їли гамбургери на Всесвітній виставці в Сент-Луїсі."]], [["In the 1950s fast food restaurants became popular.", "У 1950-х ресторани швидкого харчування стали популярними."], ["More people had cars and wanted quick, cheap food.", "Більше людей мали машини й хотіли швидкої, дешевої їжі."], ["Drive-thru restaurants let you order and eat without leaving your car.", "Ресторани з обслуговуванням в авто дозволяли замовити й поїсти, не виходячи з машини."]], [["Today Americans eat billions of hamburgers every year.", "Сьогодні американці щороку з'їдають мільярди гамбургерів."], ["There are many kinds: cheeseburgers, veggie burgers, and even burgers with peanut butter!", "Є багато видів: чизбургери, вегетаріанські бургери і навіть бургери з арахісовою пастою!"], ["Many people like to grill burgers in their backyard in the summer.", "Багато хто любить смажити бургери на задньому дворі влітку."], ["The hamburger has traveled from Germany to America and then to the whole world.", "Гамбургер подорожував з Німеччини до Америки, а потім по всьому світу."]]], "q": [{"q": "Звідки походить назва «гамбургер»?", "o": ["З Німеччини", "З Англії", "З Франції"], "a": 0}, {"q": "Де їли гамбургери в 1904 році?", "o": ["На Всесвітній виставці", "На стадіоні", "У Білому домі"], "a": 0}, {"q": "Що дозволяли ресторани drive-thru?", "o": ["Їсти, не виходячи з машини", "Готувати самому", "Їсти безкоштовно"], "a": 0}]}, {"id": "t54", "lv": "A2", "e": "🗣️", "t": "Learning English with my neighbors", "uk": "Вчу англійську із сусідами", "p": [[["When I finished my English course, I still didn't speak fluently.", "Коли я закінчила курс англійської, я ще не говорила вільно."], ["In class I learned grammar, but outside class I didn't speak much English.", "На уроках я вчила граматику, але поза класом мало говорила англійською."]], [["So I came up with a plan.", "Тож я придумала план."], ["I put a note on the board in the lobby of our building.", "Я повісила оголошення на дошку в холі нашого будинку."], ["It said: \"Who wants to talk with me in English? I'll cook Ukrainian food as a thank you!\"", "Там було написано: «Хто хоче говорити зі мною англійською? На подяку приготую українську їжу!»"]], [["Within a week, four neighbors replied.", "За тиждень відгукнулися четверо сусідів."], ["Now we have a conversation night at my place every Thursday.", "Тепер щочетверга ввечері в мене розмовний вечір."], ["We talk about the news, our kids and the neighborhood.", "Ми говоримо про новини, дітей і наш район."], ["When I make a mistake, they correct me in a friendly way.", "Коли я помиляюся, вони привітно мене виправляють."]], [["One of my neighbors, Mr. Davis, is a retired teacher.", "Один із сусідів, містер Девіс, — вчитель на пенсії."], ["Sometimes he brings a newspaper article that we read together.", "Іноді він приносить газетну статтю, яку ми читаємо разом."], ["Another neighbor teaches me idioms.", "Інша сусідка вчить мене ідіом."], ["My favorite is: \"Practice makes perfect.\"", "Моя улюблена: «Практика робить досконалим»."]], [["Thanks to our conversation nights, my English is much better.", "Завдяки розмовним вечорам моя англійська значно покращилася."], ["But I've also made real friends.", "А ще я знайшла справжніх друзів."], ["Our building now feels like a community.", "Наш будинок тепер відчувається як спільнота."]]], "q": [{"q": "Де вона повісила оголошення?", "o": ["У бібліотеці", "У холі будинку", "У школі"], "a": 1}, {"q": "Коли розмовний вечір?", "o": ["Щочетверга", "Щонеділі", "Щопонеділка"], "a": 0}, {"q": "Яка її улюблена ідіома?", "o": ["Practice makes perfect", "Time is money", "Better late than never"], "a": 0}]}, {"id": "t55", "lv": "A2", "e": "📨", "t": "Mail and paperwork", "uk": "Листи і документи", "p": [[["In America you get a lot of mail, and some of it is important.", "В Америці отримуєш багато пошти, і частина її важлива."], ["More and more of it comes by email or through online accounts.", "Дедалі більше її приходить на пошту або в онлайн-кабінети."]], [["Some letters look like ads, but they are really important.", "Деякі листи схожі на рекламу, але насправді важливі."], ["For example, letters from the IRS, the tax agency.", "Наприклад, листи від IRS, податкової служби."], ["Or letters from your insurance company or the DMV.", "Або листи від страхової компанії чи відділу транспорту."]], [["Many offices have online accounts.", "У багатьох установ є онлайн-кабінети."], ["You create an account with your email and a strong password.", "Створюєш кабінет за допомогою пошти і надійного пароля."], ["Often you also get a code by text message to log in safely.", "Часто ще отримуєш код у повідомленні, щоб безпечно увійти."]], [["Be careful with scams!", "Будь обережним із шахраями!"], ["Sometimes people call and say they are from the government.", "Іноді дзвонять і кажуть, що вони з держустанови."], ["They ask for money or your Social Security number.", "Вони просять гроші або номер соціального страхування."], ["The real government never asks for payment with gift cards.", "Справжня держава ніколи не просить оплатити подарунковими картками."]], [["Official letters are often long and complicated.", "Офіційні листи часто довгі й складні."], ["My tip: first read what they want from you and by what date.", "Моя порада: спершу прочитай, що від тебе хочуть і до якої дати."], ["If you don't understand something, ask at the library or a community center.", "Якщо щось незрозуміло, спитай у бібліотеці чи громадському центрі."], ["Volunteers there help with forms for free.", "Волонтери там безкоштовно допомагають з бланками."], ["Never throw away a letter without reading it!", "Ніколи не викидай лист, не прочитавши!"]]], "q": [{"q": "Що таке IRS?", "o": ["Податкова служба", "Пошта", "Банк"], "a": 0}, {"q": "Як справжня держава НІКОЛИ не просить платити?", "o": ["Подарунковими картками", "Онлайн", "Чеком"], "a": 0}, {"q": "Де допомагають з бланками безкоштовно?", "o": ["У бібліотеці", "У банку", "У податковій"], "a": 0}]}, {"id": "t56", "lv": "A2", "e": "🩺", "t": "My dream job", "uk": "Робота моєї мрії", "p": [[["Since I was a child, I have wanted to be a nurse.", "З дитинства я хотіла бути медсестрою."], ["In Ukraine I worked in a hospital for fifteen years.", "В Україні я п'ятнадцять років працювала в лікарні."], ["When I came to America, I couldn't do that job right away.", "Коли я приїхала до Америки, я не могла одразу працювати за фахом."]], [["To work as a nurse in the United States, you need a license.", "Щоб працювати медсестрою в США, потрібна ліцензія."], ["First I had to have my diploma evaluated.", "Спершу мені треба було оцінити диплом."], ["That was a long process with a lot of documents.", "Це був довгий процес з багатьма документами."]], [["I also had to pass an English test and the nursing exam.", "Мені також треба було скласти тест з англійської та іспит для медсестер."], ["Medical words in English were hard at first.", "Медичні слова англійською спершу були важкими."], ["I learned twenty new terms every day.", "Я щодня вчила двадцять нових термінів."], [
