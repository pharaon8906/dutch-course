<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>Skyline English</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Nunito:wght@500;600;700;800&display=swap">
<style>
/* Layout: one playful column under an animated city-skyline hero; candy palette of liberty blue, taxi yellow, pink and mint */
:root{
  --bg:#f3f6ff; --surface:#ffffff; --ink:#1a1f3d; --muted:#5d6488; --line:#e1e6f5;
  --blue:#2f5bff; --blue-soft:#e7edff; --orange:#ff7a1a; --orange-soft:#fff0e2; --pink:#f03a6c; --pink-soft:#ffe7ef;
  --green:#10a86f; --green-soft:#dcf6ea; --sun:#ffbf1a; --sun-soft:#fff5d6; --purple:#7d55ff; --purple-soft:#efe9ff;
  --sky1:#4f7dff; --sky2:#9cc0ff; --onhero:#ffffff;
  --de:#2f5bff; --het:#f03a6c;
  --shadow:0 10px 30px -14px rgba(47,91,255,.35);
  --f-display:"Unbounded","Nunito",system-ui,sans-serif; --f-body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:22px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1230; --surface:#191f47; --ink:#f1f3ff; --muted:#a8aed6; --line:#2c3468;
  --blue:#7f9bff; --blue-soft:#232f6e; --orange:#ff9a4d; --orange-soft:#3c2615; --pink:#ff6f99; --pink-soft:#41192c;
  --green:#3ddc9c; --green-soft:#11382a; --sun:#ffd257; --sun-soft:#3a3115; --purple:#a98bff; --purple-soft:#2c2160;
  --sky1:#1d2c7a; --sky2:#4b3f9e; --onhero:#ffffff; --de:#7f9bff; --het:#ff6f99;
  --shadow:0 10px 30px -14px rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1230; --surface:#191f47; --ink:#f1f3ff; --muted:#a8aed6; --line:#2c3468;
  --blue:#7f9bff; --blue-soft:#232f6e; --orange:#ff9a4d; --orange-soft:#3c2615; --pink:#ff6f99; --pink-soft:#41192c;
  --green:#3ddc9c; --green-soft:#11382a; --sun:#ffd257; --sun-soft:#3a3115; --purple:#a98bff; --purple-soft:#2c2160;
  --sky1:#1d2c7a; --sky2:#4b3f9e; --onhero:#ffffff; --de:#7f9bff; --het:#ff6f99;
  --shadow:0 10px 30px -14px rgba(0,0,0,.6); color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;
  background:radial-gradient(800px 420px at 0% -5%,var(--blue-soft),transparent 60%),radial-gradient(700px 420px at 100% 10%,var(--pink-soft),transparent 60%),radial-gradient(700px 500px at 50% 100%,var(--sun-soft),transparent 60%),var(--bg);background-attachment:fixed;background-color:var(--bg)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 56px}

/* hero */
.hero{position:relative;border-radius:26px;overflow:hidden;background:linear-gradient(160deg,var(--sky1),var(--sky2));color:var(--onhero);min-height:212px;box-shadow:var(--shadow)}
.hero svg.scene{position:absolute;inset:auto 0 0 0;width:100%;height:96px;display:block}
.btn svg{width:18px;height:18px;flex:none}
.hero .ht{position:relative;padding:18px 20px 0;display:grid;gap:4px}
.hero h1{font-family:var(--f-display);font-weight:800;font-size:1.55rem;margin:0;letter-spacing:-.01em;line-height:1.1;text-shadow:0 2px 10px rgba(0,0,0,.18)}
.hero h1 span{background:var(--sun);color:#1a1f3d;border-radius:8px;padding:0 6px;font-size:.8em;vertical-align:middle;margin-left:4px}
.hero p{margin:0;font-weight:700;opacity:.95;font-size:.9rem}
.hstats{position:relative;display:flex;gap:6px;padding:10px 20px 0;flex-wrap:wrap}
.hstats span{background:rgba(255,255,255,.22);backdrop-filter:blur(6px);border-radius:999px;padding:3px 10px;font-weight:800;font-size:.8rem}
.blades{transform-origin:330px 52px;animation:spin 7s linear infinite}
.sway{transform-box:fill-box;transform-origin:50% 100%;animation:sway 3s ease-in-out infinite}
.sway:nth-of-type(2n){animation-delay:-1.2s}.sway:nth-of-type(3n){animation-delay:-2s}
.cloud{animation:drift 26s linear infinite}
.cloud2{animation:drift 38s linear infinite;animation-delay:-14s}
.bike{animation:ride 14s linear infinite}
.wheel{transform-box:fill-box;transform-origin:center;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes sway{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
@keyframes drift{from{transform:translateX(-120px)}to{transform:translateX(520px)}}
@keyframes ride{from{transform:translateX(-60px)}to{transform:translateX(460px)}}

main{display:grid;gap:16px;padding-top:12px}
h2{font-family:var(--f-display);font-size:1.08rem;margin:0;text-wrap:balance;font-weight:700}
h3{font-size:1.05rem;margin:0;font-weight:800}
.card{background:var(--surface);border-radius:var(--r);padding:18px;display:grid;gap:12px;min-width:0;box-shadow:var(--shadow);animation:rise .4s cubic-bezier(.2,.8,.3,1.2) both}
main>*:nth-child(2){animation-delay:.05s}main>*:nth-child(3){animation-delay:.1s}main>*:nth-child(4){animation-delay:.15s}main>*:nth-child(5){animation-delay:.2s}
@keyframes rise{from{transform:translateY(14px) scale(.98);opacity:.35}to{transform:none;opacity:1}}
.muted{color:var(--muted)} .small{font-size:.87rem}
.label{font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:800}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
button.btn,a.btn{font:800 .95rem var(--f-body);border-radius:14px;border:0;background:var(--blue-soft);color:var(--blue);padding:10px 16px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;text-decoration:none;transition:transform .12s, box-shadow .12s}
button.btn:hover,a.btn:hover{transform:translateY(-2px)}
button.btn:active{transform:scale(.96)}
button.btn:disabled{opacity:.45;cursor:default;transform:none}
.primary{background:linear-gradient(135deg,var(--blue),var(--purple))!important;color:#fff!important;box-shadow:0 8px 18px -8px var(--blue)}
.good{background:linear-gradient(135deg,var(--green),#22c3a0)!important;color:#fff!important}
.bad{background:linear-gradient(135deg,var(--orange),var(--pink))!important;color:#fff!important}
.sunny{background:var(--sun-soft)!important;color:var(--ink)!important}
button.speak{border:0;background:linear-gradient(135deg,var(--orange),var(--pink));color:#fff;width:40px;height:40px;border-radius:50%;display:inline-grid;place-items:center;cursor:pointer;flex:none;box-shadow:0 6px 14px -6px var(--pink);transition:transform .12s}
button.speak:hover{transform:scale(1.08)}
button.speak.talking{animation:pulse .8s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.15);box-shadow:0 0 0 8px color-mix(in srgb,var(--pink) 25%,transparent)}}
button.speak svg{width:18px;height:18px}
select,input[type=text],input[type=search]{font:700 .95rem var(--f-body);color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:14px;padding:10px 12px;max-width:100%}
input[type=text],input[type=search]{width:100%}

/* flashcard */
.flipwrap{perspective:1200px}
.flipper{position:relative;min-height:340px;transition:transform .6s cubic-bezier(.3,1.4,.5,1);transform-style:preserve-3d;cursor:pointer}
.flipper.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:26px;display:grid;place-items:center;text-align:center;padding:26px 20px;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden}
.face.front{background:linear-gradient(150deg,var(--blue-soft),var(--purple-soft))}
.face.back{background:linear-gradient(150deg,var(--sun-soft),var(--pink-soft));transform:rotateY(180deg)}
.face .pic{font-size:72px;line-height:1;animation:bob 2.6s ease-in-out infinite;filter:drop-shadow(0 8px 10px rgba(0,0,0,.15))}
@keyframes bob{50%{transform:translateY(-8px) rotate(3deg)}}
.face .word{font-family:var(--f-display);font-size:clamp(1.5rem,6.5vw,2.3rem);font-weight:700;line-height:1.2;overflow-wrap:anywhere;margin-top:10px}
.face .tr{font-size:1.2rem;font-weight:800;margin-top:6px}
.face .hint{margin-top:8px;font-size:.92rem;color:var(--muted);max-width:42ch;margin-inline:auto}
.face .corner{position:absolute;top:14px;left:16px}
.face .spk{position:absolute;top:12px;right:12px}
.flipwrap.out-r{animation:outR .35s ease-in forwards}.flipwrap.out-l{animation:outL .35s ease-in forwards}.flipwrap.in{animation:cardIn .4s cubic-bezier(.2,.9,.3,1.3)}
@keyframes outR{to{transform:translateX(120%) rotate(14deg);opacity:0}}
@keyframes outL{to{transform:translateX(-120%) rotate(-14deg);opacity:0}}
@keyframes cardIn{from{transform:scale(.85) translateY(20px);opacity:0}}
.art-de{color:var(--de)} .art-het{color:var(--het)}
.pill{display:inline-block;font-size:.75rem;font-weight:800;padding:3px 10px;border-radius:999px;background:var(--surface);color:var(--blue)}
.pill.ok{background:var(--green-soft);color:var(--green)}
.pill.fire{background:var(--orange-soft);color:var(--orange)}
.bar{height:12px;border-radius:99px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--blue),var(--purple),var(--pink));background-size:200% 100%;animation:shine 3s linear infinite;transition:width .6s cubic-bezier(.2,.8,.3,1)}
@keyframes shine{to{background-position:-200% 0}}
.list{display:grid;max-height:440px;overflow:auto;border-radius:16px;background:var(--bg)}
.li{display:flex;gap:10px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .em{font-size:1.4rem;width:30px;text-align:center;flex:none}
.li .nl{font-weight:800;min-width:0;flex:1}
.li .uk{color:var(--muted);flex:1;min-width:0;font-size:.92rem}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.tilebtn{border:0;border-radius:18px;padding:12px;text-align:left;cursor:pointer;font:800 .9rem var(--f-body);color:var(--ink);display:grid;gap:6px;transition:transform .15s}
.tilebtn:hover{transform:translateY(-3px) rotate(-1deg)}
.tilebtn .e{font-size:1.8rem}
.tilebtn .bar{height:6px;background:color-mix(in srgb,var(--ink) 12%,transparent)}
.c0{background:var(--blue-soft)}.c1{background:var(--pink-soft)}.c2{background:var(--sun-soft)}.c3{background:var(--green-soft)}.c4{background:var(--purple-soft)}.c5{background:var(--orange-soft)}

/* quiz */
.opts{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.opt{font:800 1.02rem var(--f-body);text-align:left;padding:14px 16px;border-radius:16px;border:2px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;transition:transform .12s,border-color .12s}
.opt:hover{border-color:var(--blue);transform:translateY(-2px)}
.opt.right{background:var(--green-soft);border-color:var(--green);color:var(--green);animation:pop .4s}
.opt.wrong{background:var(--pink-soft);border-color:var(--pink);color:var(--pink);animation:shake .4s}
@keyframes pop{40%{transform:scale(1.07)}}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.q-pic{font-size:78px;text-align:center;line-height:1;animation:bob 2.6s ease-in-out infinite}
.q-big{font-family:var(--f-display);font-size:1.6rem;text-align:center;padding:6px 0;overflow-wrap:anywhere;font-weight:700}
.feedback{font-weight:800;font-size:1.05rem}
.feedback.ok{color:var(--green)} .feedback.no{color:var(--pink)}
.mode{display:flex;gap:14px;align-items:center}
.mode .mi{width:58px;height:58px;border-radius:18px;display:grid;place-items:center;font-size:30px;flex:none}

/* dialogs */
.chat{display:grid;gap:10px}
.line{display:flex;gap:8px;align-items:flex-end;max-width:92%}
.line.B{margin-left:auto;flex-direction:row-reverse}
.ava{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:22px;flex:none;background:var(--blue-soft)}
.line.B .ava{background:var(--pink-soft)}
.bubble{background:var(--blue-soft);border-radius:18px 18px 18px 6px;padding:10px 12px;min-width:0;display:flex;gap:8px;align-items:flex-start;transition:transform .2s}
.line.B .bubble{background:var(--pink-soft);border-radius:18px 18px 6px 18px}
.bubble .speak{width:32px;height:32px}
.bubble .speak svg{width:15px;height:15px}
.line .nl{font-weight:800}
.line .uk{color:var(--muted);font-size:.9rem}
.line.playing .bubble{transform:scale(1.04);box-shadow:0 0 0 3px var(--sun)}
.hidden-text{filter:blur(7px);cursor:pointer}
.dlg-card{border:0;text-align:left;cursor:pointer;font:inherit;color:inherit}
.dlg-card .e{font-size:2.2rem}

details.g{background:var(--surface);border-radius:var(--r);padding:0 18px;box-shadow:var(--shadow)}
details.g summary{cursor:pointer;padding:15px 0;font-weight:800;list-style:none;display:flex;align-items:center;gap:10px}
details.g summary .e{font-size:1.5rem}
details.g summary::after{content:"+";margin-left:auto;color:var(--blue);font-weight:800;font-size:1.3rem;transition:transform .2s}
details.g[open] summary::after{transform:rotate(45deg)}
details.g .gb{padding-bottom:16px;display:grid;gap:10px;animation:rise .3s both}
details.g ul{margin:0;padding-left:20px}
.tipbox{background:var(--sun-soft);border-radius:14px;padding:10px 12px;font-size:.93rem}
.tipbox b{color:var(--orange)}
.ex{display:flex;gap:10px;align-items:center}
.ex .nl{font-weight:800}
.stat{display:grid;gap:2px;padding:12px;border-radius:16px}
.stat .n{font-family:var(--f-display);font-size:1.7rem;font-variant-numeric:tabular-nums}
.ring{--p:0;width:96px;height:96px;border-radius:50%;flex:none;display:grid;place-items:center;background:conic-gradient(var(--green) calc(var(--p)*1%),var(--line) 0);transition:--p .6s}
.ring>div{width:74px;height:74px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:1.05rem}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:14px;font-weight:700;font-size:.92rem;z-index:20;max-width:calc(100% - 32px)}
.sound .s{font-family:var(--f-display);font-size:1.5rem;font-weight:800;background:linear-gradient(135deg,var(--blue),var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent;width:max-content}
.chip{border:0;background:var(--bg);color:var(--ink);border-radius:999px;padding:7px 13px;font:800 .92rem var(--f-body);cursor:pointer;transition:transform .12s}
.chip:hover{transform:translateY(-2px);background:var(--blue-soft);color:var(--blue)}
table.ff{width:100%;border-collapse:collapse;font-size:.94rem}
table.ff td{padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
table.ff td:first-child{font-weight:800;white-space:nowrap}
.scroll{overflow-x:auto}
.cf{position:fixed;width:9px;height:13px;border-radius:2px;pointer-events:none;z-index:30}
.xpf{position:fixed;pointer-events:none;z-index:31;font:800 1.1rem var(--f-display);color:var(--green)}
.sheet{position:fixed;inset:0;z-index:40;background:rgba(10,14,40,.5);display:grid;place-items:end center;padding:16px max(16px,env(safe-area-inset-left,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px))}
.sheet .card{max-width:560px;width:100%;max-height:85vh;overflow:auto}
.diag li{margin:4px 0}
@media (prefers-reduced-motion:reduce){*,*::before{animation:none!important;transition:none!important}}

/* bottom nav + sub bar */
.wrap{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))!important}
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--surface);box-shadow:0 -8px 24px -14px rgba(20,30,90,.45);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.bn{border:0;background:none;display:grid;justify-items:center;gap:1px;font:800 .7rem var(--f-body);color:var(--muted);padding:6px 0;border-radius:14px;cursor:pointer}
.bn .i{font-size:1.45rem;line-height:1.1;transition:transform .15s}
.bn[aria-current="page"]{color:var(--blue);background:var(--blue-soft)}
.bn[aria-current="page"] .i{transform:translateY(-2px) scale(1.1)}
#subbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;gap:10px;padding:10px 0;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px)}
#subbar h2{flex:1;min-width:0}
.hs{font-weight:800;color:var(--muted)}
.hub{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.hubtile{border:0;border-radius:22px;padding:18px 14px;text-align:left;cursor:pointer;font:inherit;color:var(--ink);display:grid;gap:4px;box-shadow:var(--shadow);transition:transform .15s;animation:rise .4s both}
.hubtile:hover{transform:translateY(-3px) rotate(-1deg)}
.hubtile .e{font-size:2.2rem}
.hubtile b{font-size:1.05rem}
.lvgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.lvcard b{font-size:.85rem}.lvcard .small{font-size:.75rem;line-height:1.3}
.lvcard{border:2px solid var(--line);background:var(--bg);border-radius:18px;padding:12px;text-align:left;cursor:pointer;font:inherit;color:var(--ink);display:grid;gap:2px;transition:transform .15s}
.lvcard .e{font-size:1.6rem}
.lvcard.on{border-color:var(--blue);background:var(--blue-soft);transform:scale(1.02)}
.path{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.pstep{border:0;background:var(--surface);border-radius:16px;padding:10px 6px;display:grid;justify-items:center;gap:2px;cursor:pointer;font:inherit;color:var(--ink)}
.pstep .e{font-size:1.4rem}.pstep b{font-size:.8rem}
.pstep.done{background:var(--green-soft)}
.chip.on{background:linear-gradient(135deg,var(--blue),var(--purple));color:#fff}
.lvchips{gap:6px}
.abc{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px}
.abcb{border:0;background:var(--bg);border-radius:14px;padding:8px 4px;display:grid;justify-items:center;cursor:pointer;font:inherit;color:var(--ink);transition:transform .12s}
.abcb:hover{transform:translateY(-2px);background:var(--blue-soft)}
.abcb b{font-family:var(--f-display);font-size:1.2rem}
.abcb span{font-size:.78rem;color:var(--muted)}
.ph{display:grid;gap:12px}
.phi{display:flex;gap:12px;align-items:flex-start;padding:10px;border-radius:16px;background:var(--bg)}
.phw{flex:none;min-width:64px;text-align:center;font-family:var(--f-display);font-weight:800;font-size:1.25rem;padding:10px 8px;border-radius:14px;background:linear-gradient(135deg,var(--blue),var(--pink));color:#fff;max-width:40%;overflow-wrap:anywhere}
.rtext{display:grid;gap:14px}
.par{display:grid;gap:6px;padding-bottom:10px;border-bottom:1px dashed var(--line)}
.par:last-child{border-bottom:0}
.sen{display:flex;gap:8px;align-items:flex-start;padding:4px 6px;border-radius:12px;transition:background .2s}
.sen.playing{background:var(--sun-soft)}
.sp{flex:none;border:0;width:28px;height:28px;border-radius:50%;background:var(--blue-soft);color:var(--blue);cursor:pointer;font-size:.75rem;margin-top:2px}
.snl{font-size:1.12rem;line-height:1.7}
.suk{color:var(--muted);font-size:.92rem}
.tw{cursor:pointer;border-bottom:2px dotted color-mix(in srgb,var(--blue) 40%,transparent);border-radius:4px;padding:0 1px;transition:background .12s}
.tw:hover,.tw:focus{background:var(--blue-soft)}
.pop{position:fixed;z-index:35;background:var(--ink);color:var(--bg);padding:8px 12px;border-radius:12px;font-size:.95rem;max-width:min(320px,calc(100vw - 16px));box-shadow:0 10px 24px -10px rgba(0,0,0,.5);animation:rise .2s both}
table.gt{border-collapse:collapse;width:100%;font-size:.94rem}
table.gt th,table.gt td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left}
table.gt th{color:var(--blue);font-size:.82rem;text-transform:uppercase;letter-spacing:.04em}
.simple{background:var(--blue-soft);border-radius:14px;padding:12px;font-size:.98rem}
.mist{background:var(--pink-soft);border-radius:14px;padding:10px 12px;display:grid;gap:4px}
.mist s{color:var(--pink)}

rules:`<table class="gt"><tr><th>Хто</th><th>to be</th><th>коротко</th></tr><tr><td>I — я</td><td>am</td><td>I'm</td></tr><tr><td>you — ти, ви</td><td>are</td><td>you're</td></tr><tr><td>he / she / it</td><td>is</td><td>he's, she's, it's</td></tr><tr><td>we — ми</td><td>are</td><td>we're</td></tr><tr><td>they — вони</td><td>are</td><td>they're</td></tr></table><ul><li>Заперечення: I'm <b>not</b>, he <b>isn't</b>, they <b>aren't</b>.</li><li>Питання: <b>Are</b> you tired? <b>Is</b> she at home?</li></ul>`,
ex:[["I am Olena.","Я Олена."],["He is tired.","Він утомлений."],["We are from Ukraine.","Ми з України."]],
mistake:["I student.","I am a student.","Без am речення неправильне, і перед професією потрібен a."],
tip:"Вік кажуть через to be: «I am thirty» (мені 30), а не «I have thirty».",
q:[{q:"She ___ a teacher.",o:["am","is","are"],a:1},{q:"They ___ at home.",o:["is","are","am"],a:1}]},
{lv:"A0",e:"🎨",t:"A, an і the: артиклі",
simple:"Перед іменником в однині майже завжди стоїть маленьке слово. <b>a / an</b> — «якийсь, один». <b>the</b> — «той самий, конкретний».",
rules:`<ul><li><b>a</b> — перед приголосним звуком: a cat, a house, a university (звук «ю»).</li><li><b>an</b> — перед голосним звуком: an apple, an egg, an hour (h німа).</li><li><b>the</b> — конкретний предмет, про який обоє знаємо: Close the door.</li><li>Без артикля: множина загалом (I like cats), незлічувані (I drink water), імена, міста, країни.</li></ul>`,
ex:[["I have a dog. The dog is black.","У мене є собака. Собака чорна."],["She eats an apple every day.","Вона щодня їсть яблуко."],["The sun is hot.","Сонце гаряче."]],
mistake:["I am teacher.","I am a teacher.","Перед професією в однині потрібен a."],
tip:"Обирай a/an за звуком, а не за буквою: an hour, але a university.",
q:[{q:"___ orange",o:["a","an"],a:1},{q:"___ university",o:["a","an"],a:0}]},
{lv:"A0",e:"2️⃣",t:"Порядок слів: хто — що робить — що",
simple:"В англійській порядок слів <b>майже завжди однаковий</b>: підмет → дієслово → додаток → місце → час. Переставляти слова, як в українській, не можна.",
rules:`<table class="gt"><tr><th>хто</th><th>дія</th><th>що</th><th>де</th><th>коли</th></tr><tr><td>I</td><td>drink</td><td>coffee</td><td>at work</td><td>every day.</td></tr><tr><td>She</td><td>plays</td><td>tennis</td><td>in the park</td><td>on Sundays.</td></tr></table>`,
ex:[["I drink coffee.","Я п'ю каву."],["Tom reads books at night.","Том читає книжки вночі."],["We watch TV in the evening.","Ми дивимося телевізор увечері."]],
mistake:["Coffee I drink every day.","I drink coffee every day.","Спершу хто, потім дія."],
tip:"Запам'ятай формулу «Хто? Що робить? Що? Де? Коли?» — вона працює в 90% речень.",
q:[{q:"Як правильно?",o:["Every day I coffee drink.","I drink coffee every day."],a:1}]},
{lv:"A0",e:"❓",t:"Як поставити питання з to be",
simple:"З дієсловом <b>to be</b> питання дуже просте: переставляємо am/is/are <b>на початок</b>.",
rules:`<ul><li>You are tired. → <b>Are</b> you tired?</li><li>She is at home. → <b>Is</b> she at home?</li><li>З питальним словом: <b>Where</b> are you? <b>What</b> is this? <b>How old</b> are you?</li><li>Питальні слова: who, what, where, when, why, how, how much, how many.</li></ul>`,
ex:[["Are you from Ukraine?","Ти з України?"],["Where is the station?","Де вокзал?"],["How old are you?","Скільки тобі років?"]],
mistake:["You are hungry?","Are you hungry?","У питанні are стоїть першим."],
tip:"Коротка відповідь: Yes, I am. / No, I'm not. Не просто «Yes».",
q:[{q:"___ he your brother?",o:["Is","Are","Does"],a:0},{q:"Where ___ you?",o:["is","are","do"],a:1}]},
{lv:"A0",e:"🚫",t:"Заперечення: not",
simple:"Щоб сказати «не», додаємо <b>not</b> після am/is/are або використовуємо <b>don't / doesn't</b> з іншими дієсловами.",
rules:`<ul><li>I am <b>not</b> hungry. / He is<b>n't</b> here. / They are<b>n't</b> ready.</li><li>I <b>don't</b> like coffee. (I, you, we, they)</li><li>She <b>doesn't</b> work on Sundays. (he, she, it)</li><li>Після doesn't дієслово без -s: she doesn't work<b>s</b> ✗</li></ul>`,
ex:[["I don't understand.","Я не розумію."],["She isn't at home.","Її немає вдома."],["He doesn't eat meat.","Він не їсть м'яса."]],
mistake:["I no like coffee.","I don't like coffee.","«no» тут не працює, потрібне don't."],
tip:"В англійській немає подвійного заперечення: I don't have <b>any</b> money, а не «no money».",
q:[{q:"I ___ speak French.",o:["don't","doesn't","not"],a:0},{q:"He ___ like fish.",o:["don't","doesn't"],a:1}]},
{lv:"A0",e:"👥",t:"Множина",
simple:"Щоб сказати «багато», найчастіше додаємо <b>-s</b>. Але є кілька хитрощів.",
rules:`<ul><li><b>+s</b>: a book → books, a car → cars</li><li><b>+es</b> після s, sh, ch, x: a bus → buses, a box → boxes</li><li>приголосний + y → <b>ies</b>: a city → cities, a baby → babies</li><li>-f / -fe → <b>ves</b>: a knife → knives, a wife → wives</li><li>Неправильні: man → <b>men</b>, woman → <b>women</b>, child → <b>children</b>, foot → <b>feet</b>, tooth → <b>teeth</b>, person → <b>people</b></li></ul>`,
ex:[["two cats","два коти"],["three children","троє дітей"],["many people","багато людей"]],
mistake:["two childs","two children","child має неправильну множину."],
tip:"people — це вже множина: People <b>are</b> nice, а не «is».",
q:[{q:"a city → ?",o:["citys","cities"],a:1},{q:"a man → ?",o:["mans","men"],a:1}]},
{lv:"A1",e:"⏱️",t:"Present Simple: звичайні дії",
simple:"Для того, що ти робиш <b>зазвичай, щодня, завжди</b>, — Present Simple. Головне правило: з <b>he / she / it</b> до дієслова додається <b>-s</b>.",
rules:`<table class="gt"><tr><th></th><th>+</th><th>–</th><th>?</th></tr><tr><td>I / you / we / they</td><td>work</td><td>don't work</td><td>Do you work?</td></tr><tr><td>he / she / it</td><td>work<b>s</b></td><td>doesn't work</td><td>Does she work?</td></tr></table><ul><li>Слова-підказки: always, usually, often, sometimes, never, every day.</li><li>he go → goes, he watch → watches, he study → studies, he have → <b>has</b></li></ul>`,
ex:[["I work in an office.","Я працюю в офісі."],["She lives in Boston.","Вона живе в Бостоні."],["Do you like pizza?","Ти любиш піцу?"]],
mistake:["He work every day.","He works every day.","З he/she/it додаємо -s."],
tip:"Згадай «-s для третьої особи»: he/she/it = s-s-s, як змійка.",
q:[{q:"She ___ (live) in London.",o:["live","lives","living"],a:1},{q:"___ he speak English?",o:["Do","Does","Is"],a:1}]},
{lv:"A1",e:"🏃",t:"Present Continuous: що відбувається зараз",
simple:"Для того, що відбувається <b>прямо зараз</b>, — <b>am / is / are + дієслово з -ing</b>.",
rules:`<ul><li>I <b>am working</b>. She <b>is reading</b>. They <b>are playing</b>.</li><li>Питання: <b>Are</b> you listening? Заперечення: He <b>isn't</b> sleeping.</li><li>Слова-підказки: now, right now, at the moment, look!</li><li>Правопис: make → making, swim → swimming, lie → lying.</li></ul>`,
ex:[["I'm cooking dinner now.","Я зараз готую вечерю."],["Look! It's raining.","Дивись! Іде дощ."],["What are you doing?","Що ти робиш?"]],
mistake:["I cooking now.","I'm cooking now.","Без am не можна."],
tip:"Порівняй: I work every day (завжди) — I'm working now (зараз).",
q:[{q:"She ___ TV now.",o:["watches","is watching"],a:1},{q:"They ___ every Sunday.",o:["play","are playing"],a:0}]},
{lv:"A1",e:"💪",t:"Can, must, should: модальні дієслова",
simple:"Ці слова кажуть, <b>можеш, мусиш чи варто</b>. Після них — дієслово в простій формі, без to і без -s.",
rules:`<ul><li><b>can</b> — можу, вмію: I can swim. Can you help me?</li><li><b>can't</b> — не можу: I can't come.</li><li><b>must</b> — мушу (сильно): You must stop at a red light.</li><li><b>have to</b> — мушу (обставини): I have to work tomorrow.</li><li><b>should</b> — варто, слід (порада): You should see a doctor.</li><li>Без -s: she can<b>s</b> ✗ → she can ✓</li></ul>`,
ex:[["I can speak a little English.","Я трохи говорю англійською."],["You should drink more water.","Тобі варто пити більше води."],["We have to leave now.","Нам треба йти зараз."]],
mistake:["She cans swim.","She can swim.","Після модального дієслова без -s і без to."],
tip:"Can I...? — найввічливіший спосіб попросити: Can I have the check, please?",
q:[{q:"He ___ play the guitar.",o:["can","cans","can to"],a:0},{q:"You ___ see a doctor. (порада)",o:["should","can"],a:0}]},
{lv:"A1",e:"⏪",t:"Past Simple: минулий час",
simple:"Для того, що сталося й закінчилося в минулому (yesterday, last week, in 2020), — Past Simple. Правильні дієслова: <b>+ed</b>.",
rules:`<ul><li>work → work<b>ed</b>, play → play<b>ed</b>, live → live<b>d</b>, study → stud<b>ied</b></li><li>Неправильні треба вчити: go → <b>went</b>, see → <b>saw</b>, have → <b>had</b> (таблиця в темі A2).</li><li>Питання: <b>Did</b> you work? Заперечення: I <b>didn't</b> work.</li><li>Після did / didn't — проста форма: Did you <b>go</b>? (не went)</li></ul>`,
ex:[["I worked yesterday.","Я вчора працював."],["We went to the beach.","Ми їздили на пляж."],["Did you see the movie?","Ти бачив фільм?"]],
mistake:["Did you went?","Did you go?","Після did — проста форма."],
tip:"was / were — минулий від to be: I was tired, they were at home.",
q:[{q:"Yesterday I ___ (watch) TV.",o:["watch","watched"],a:1},{q:"___ you call her?",o:["Did","Do","Were"],a:0}]},
{lv:"A1",e:"🏠",t:"Мій, твій, його: присвійні слова",
simple:"Ці слова кажуть, <b>чиє</b> щось. Вони не змінюються за родом і числом: my = мій, моя, моє, мої.",
rules:`<table class="gt"><tr><th>Хто</th><th>Чий</th></tr><tr><td>I</td><td>my</td></tr><tr><td>you</td><td>your</td></tr><tr><td>he</td><td>his</td></tr><tr><td>she</td><td>her</td></tr><tr><td>it</td><td>its</td></tr><tr><td>we</td><td>our</td></tr><tr><td>they</td><td>their</td></tr></table><ul><li><b>'s</b> для людей: Anna<b>'s</b> car — машина Анни.</li></ul>`,
ex:[["My mother lives in Kyiv.","Моя мама живе в Києві."],["Is this your jacket?","Це твоя куртка?"],["That's Tom's phone.","Це телефон Тома."]],
mistake:["Anna and his husband","Anna and her husband","Про жінку — her (її), про чоловіка — his."],
tip:"its (його, про річ) пишеться без апострофа. it's = it is.",
q:[{q:"Mark and ___ wife (його)",o:["his","her"],a:0},{q:"This is ___ house. (наш)",o:["our","us"],a:0}]},
{lv:"A1",e:"🌈",t:"Прикметник завжди перед іменником",
simple:"Прикметник в англійській <b>не змінюється</b> (ні за родом, ні за числом) і стоїть <b>перед</b> іменником.",
rules:`<ul><li>a <b>big</b> house, <b>big</b> houses — без змін</li><li>Порядок кількох: думка → розмір → вік → колір: a <b>nice big old red</b> car</li><li>Після to be — окремо: The house is big.</li></ul>`,
ex:[["a small apartment","маленька квартира"],["green apples","зелені яблука"],["The coffee is hot.","Кава гаряча."]],
mistake:["a car red","a red car","Прикметник перед іменником."],
tip:"Ніколи не додавай -s до прикметника: big<b>s</b> houses ✗.",
q:[{q:"Як правильно?",o:["a house beautiful","a beautiful house"],a:1}]},
{lv:"A1",e:"🕐",t:"Котра година",
simple:"Американці найчастіше кажуть час просто цифрами: <b>2:30 = two thirty</b>. Але треба розуміти й «past / to».",
rules:`<ul><li>3:00 — three o'clock</li><li>3:15 — three fifteen / a quarter past three</li><li>3:30 — three thirty / half past three</li><li>3:45 — three forty-five / a quarter to four</li><li>a.m. — до полудня, p.m. — після полудня: 8 a.m., 8 p.m.</li></ul>`,
ex:[["What time is it?","Котра година?"],["It's half past seven.","Пів на восьму (7:30)."],["The meeting is at nine a.m.","Нарада о дев'ятій ранку."]],
mistake:["half three = 2:30","half past three = 3:30","В англійській half past рахується ПІСЛЯ години."],
tip:"У США використовують 12-годинний формат: 15:00 = 3 p.m.",
q:[{q:"half past six = ?",o:["6:30","5:30"],a:0},{q:"a quarter to two = ?",o:["1:45","2:15"],a:0}]},
{lv:"A2",e:"✨",t:"Present Perfect: досвід і результат",
simple:"<b>have / has + третя форма дієслова</b>. Використовують, коли важливий <b>результат зараз</b> або <b>досвід у житті</b>, а не точний час.",
rules:`<ul><li>I <b>have been</b> to London. — Я бував у Лондоні (досвід).</li><li>She <b>has lost</b> her keys. — Вона загубила ключі (і їх досі немає).</li><li>Слова-підказки: ever, never, already, yet, just, since, for.</li><li>Питання: <b>Have</b> you ever been to Paris?</li><li>З точним часом (yesterday, in 2020) — Past Simple, не Present Perfect!</li></ul>`,
ex:[["I have never seen snow.","Я ніколи не бачив снігу."],["Have you finished your homework?","Ти закінчив домашнє завдання?"],["We have lived here for two years.","Ми живемо тут два роки."]],
mistake:["I have seen him yesterday.","I saw him yesterday.","З yesterday — Past Simple."],

q:[{q:"She ___ already eaten.",o:["has","have"],a:0},{q:"I ___ to Rome in 2019.",o:["have been","went"],a:1}]},
{lv:"A2",e:"🔮",t:"Майбутнє: will і going to",
simple:"<b>going to</b> — план, який ти вже вирішив. <b>will</b> — рішення зараз, обіцянка або прогноз.",
rules:`<ul><li>I'm <b>going to</b> visit my parents next week. (план)</li><li>The phone is ringing. — I'<b>ll</b> get it! (рішення зараз)</li><li>I <b>will</b> help you. (обіцянка)</li><li>It <b>will</b> rain tomorrow. (прогноз)</li><li>Present Continuous для домовленостей: I'm meeting Tom at six.</li></ul>`,
ex:[["We're going to move next year.","Ми наступного року переїжджаємо."],["I'll call you later.","Я подзвоню тобі пізніше."],["Will you help me?","Ти мені допоможеш?"]],
mistake:["I will to go.","I will go.","Після will — без to."],
tip:"У розмові going to часто звучить як «gonna»: I'm gonna eat.",
q:[{q:"Look at the clouds! It ___ rain.",o:["is going to","going"],a:0},{q:"I ___ help you, I promise.",o:["will","am going"],a:0}]},
{lv:"A2",e:"🔗",t:"Сполучники і складні речення",
simple:"Щоб говорити довшими реченнями, з'єднуй їх словами <b>and, but, because, so, when, if</b>. Порядок слів у кожній частині звичайний.",
rules:`<ul><li><b>and</b> — і; <b>but</b> — але; <b>or</b> — або</li><li><b>because</b> — тому що: I'm staying home because I'm sick.</li><li><b>so</b> — тож: It's raining, so I'll take the bus.</li><li><b>when</b> — коли; <b>if</b> — якщо: If it rains, I'll take a taxi.</li><li>Після if і when про майбутнє — теперішній час: If it <b>rains</b> (не will rain).</li></ul>`,
ex:[["I'm learning English because I want a better job.","Я вчу англійську, бо хочу кращу роботу."],["If you have time, call me.","Якщо будеш мати час, подзвони."],["I was tired, so I went to bed.","Я втомився, тож пішов спати."]],

tip:"because відповідає на «чому?», so — на «що тому сталося?».",
q:[{q:"If he ___, we'll start.",o:["comes","will come"],a:0},{q:"I'm hungry, ___ I'll eat.",o:["so","because"],a:0}]},
{lv:"A2",e:"📊",t:"Порівняння: bigger, the biggest",
simple:"Коротке слово: <b>+er</b> (більший), <b>the + est</b> (найбільший). Довге слово: <b>more</b> / <b>the most</b>. Порівнюємо словом <b>than</b> (ніж).",
rules:`<ul><li>small → small<b>er</b> → the small<b>est</b></li><li>big → bi<b>gg</b>er (подвоєння), happy → happ<b>ier</b></li><li>beautiful → <b>more</b> beautiful → <b>the most</b> beautiful</li><li>Неправильні: good → <b>better</b> → the <b>best</b>; bad → <b>worse</b> → the <b>worst</b>; far → farther</li></ul>`,
ex:[["New York is bigger than Boston.","Нью-Йорк більший за Бостон."],["This is the best restaurant in town.","Це найкращий ресторан у місті."],["English is easier than Chinese.","Англійська легша за китайську."]],
mistake:["more big","bigger","Коротке слово — через -er."],
tip:"as … as — однаково: She is as tall as her mother.",
q:[{q:"good → ?",o:["gooder","better"],a:1},{q:"This book is ___ than that one. (interesting)",o:["interestinger","more interesting"],a:1}]},
{lv:"A2",e:"📢",t:"Наказовий спосіб і ввічливі прохання",
simple:"Наказ — просто дієслово на початку: <b>Sit down!</b> Але в англійській це звучить різко. Ввічливо — через <b>please</b>, <b>Can you…?</b>, <b>Could you…?</b>",
rules:`<ul><li>Наказ: Open the door. Don't touch!</li><li>Ввічливіше: Open the door, <b>please</b>.</li><li>Ще ввічливіше: <b>Can you</b> open the door? / <b>Could you</b> open the door, please?</li><li>Пропозиція: <b>Let's</b> go! — Ходімо!</li></ul>`,
ex:[["Come in!","Заходь!"],["Could you help me, please?","Не могли б ви мені допомогти?"],["Let's take a break.","Давайте зробимо перерву."]],
mistake:["Give me water!","Could I have some water, please?","У кафе наказова форма звучить грубо."],
tip:"Американці кажуть please і thank you набагато частіше, ніж українці.",
q:[{q:"Найввічливіше:",o:["Help me!","Could you help me, please?"],a:1}]}
];
