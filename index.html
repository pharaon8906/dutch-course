<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>Taalfiets A1.2</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Nunito:wght@500;600;700;800&display=swap">
<style>
/* Layout: one playful column under an animated Dutch-landscape hero; candy palette of Delft blue, tulip pink, oranje and mint */
:root{
  --bg:#f3f6ff; --surface:#ffffff; --ink:#1a1f3d; --muted:#5d6488; --line:#e1e6f5;
  --blue:#2f5bff; --blue-soft:#e7edff; --orange:#ff7a1a; --orange-soft:#fff0e2; --pink:#f03a6c; --pink-soft:#ffe7ef;
  --green:#10a86f; --green-soft:#dcf6ea; --sun:#ffbf1a; --sun-soft:#fff5d6; --purple:#7d55ff; --purple-soft:#efe9ff;
  --sky1:#4f7dff; --sky2:#9cc0ff; --onhero:#ffffff;
  --de:#2f5bff; --het:#f03a6c;
  --shadow:0 10px 30px -14px rgba(47,91,255,.35);
  --f-display:"Unbounded","Nunito",system-ui,sans-serif; --f-body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:22px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1230; --surface:#191f47; --ink:#f1f3ff; --muted:#a8aed6; --line:#2c3468;
  --blue:#7f9bff; --blue-soft:#232f6e; --orange:#ff9a4d; --orange-soft:#3c2615; --pink:#ff6f99; --pink-soft:#41192c;
  --green:#3ddc9c; --green-soft:#11382a; --sun:#ffd257; --sun-soft:#3a3115; --purple:#a98bff; --purple-soft:#2c2160;
  --sky1:#1d2c7a; --sky2:#4b3f9e; --onhero:#ffffff; --de:#7f9bff; --het:#ff6f99;
  --shadow:0 10px 30px -14px rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1230; --surface:#191f47; --ink:#f1f3ff; --muted:#a8aed6; --line:#2c3468;
  --blue:#7f9bff; --blue-soft:#232f6e; --orange:#ff9a4d; --orange-soft:#3c2615; --pink:#ff6f99; --pink-soft:#41192c;
  --green:#3ddc9c; --green-soft:#11382a; --sun:#ffd257; --sun-soft:#3a3115; --purple:#a98bff; --purple-soft:#2c2160;
  --sky1:#1d2c7a; --sky2:#4b3f9e; --onhero:#ffffff; --de:#7f9bff; --het:#ff6f99;
  --shadow:0 10px 30px -14px rgba(0,0,0,.6); color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;
  background:radial-gradient(800px 420px at 0% -5%,var(--blue-soft),transparent 60%),radial-gradient(700px 420px at 100% 10%,var(--pink-soft),transparent 60%),radial-gradient(700px 500px at 50% 100%,var(--sun-soft),transparent 60%),var(--bg);background-attachment:fixed;background-color:var(--bg)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 56px}

/* hero */
.hero{position:relative;border-radius:26px;overflow:hidden;background:linear-gradient(160deg,var(--sky1),var(--sky2));color:var(--onhero);min-height:212px;box-shadow:var(--shadow)}
.hero svg.scene{position:absolute;inset:auto 0 0 0;width:100%;height:96px;display:block}
.btn svg{width:18px;height:18px;flex:none}
.hero .ht{position:relative;padding:18px 20px 0;display:grid;gap:4px}
.hero h1{font-family:var(--f-display);font-weight:800;font-size:1.55rem;margin:0;letter-spacing:-.01em;line-height:1.1;text-shadow:0 2px 10px rgba(0,0,0,.18)}
.hero h1 span{background:var(--sun);color:#1a1f3d;border-radius:8px;padding:0 6px;font-size:.8em;vertical-align:middle;margin-left:4px}
.hero p{margin:0;font-weight:700;opacity:.95;font-size:.9rem}
.hstats{position:relative;display:flex;gap:6px;padding:10px 20px 0;flex-wrap:wrap}
.hstats span{background:rgba(255,255,255,.22);backdrop-filter:blur(6px);border-radius:999px;padding:3px 10px;font-weight:800;font-size:.8rem}
.blades{transform-origin:330px 52px;animation:spin 7s linear infinite}
.sway{transform-box:fill-box;transform-origin:50% 100%;animation:sway 3s ease-in-out infinite}
.sway:nth-of-type(2n){animation-delay:-1.2s}.sway:nth-of-type(3n){animation-delay:-2s}
.cloud{animation:drift 26s linear infinite}
.cloud2{animation:drift 38s linear infinite;animation-delay:-14s}
.bike{animation:ride 14s linear infinite}
.wheel{transform-box:fill-box;transform-origin:center;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes sway{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
@keyframes drift{from{transform:translateX(-120px)}to{transform:translateX(520px)}}
@keyframes ride{from{transform:translateX(-60px)}to{transform:translateX(460px)}}

main{display:grid;gap:16px;padding-top:12px}
h2{font-family:var(--f-display);font-size:1.08rem;margin:0;text-wrap:balance;font-weight:700}
h3{font-size:1.05rem;margin:0;font-weight:800}
.card{background:var(--surface);border-radius:var(--r);padding:18px;display:grid;gap:12px;min-width:0;box-shadow:var(--shadow);animation:rise .4s cubic-bezier(.2,.8,.3,1.2) both}
main>*:nth-child(2){animation-delay:.05s}main>*:nth-child(3){animation-delay:.1s}main>*:nth-child(4){animation-delay:.15s}main>*:nth-child(5){animation-delay:.2s}
@keyframes rise{from{transform:translateY(14px) scale(.98);opacity:.35}to{transform:none;opacity:1}}
.muted{color:var(--muted)} .small{font-size:.87rem}
.label{font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:800}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
button.btn,a.btn{font:800 .95rem var(--f-body);border-radius:14px;border:0;background:var(--blue-soft);color:var(--blue);padding:10px 16px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;text-decoration:none;transition:transform .12s, box-shadow .12s}
button.btn:hover,a.btn:hover{transform:translateY(-2px)}
button.btn:active{transform:scale(.96)}
button.btn:disabled{opacity:.45;cursor:default;transform:none}
.primary{background:linear-gradient(135deg,var(--blue),var(--purple))!important;color:#fff!important;box-shadow:0 8px 18px -8px var(--blue)}
.good{background:linear-gradient(135deg,var(--green),#22c3a0)!important;color:#fff!important}
.bad{background:linear-gradient(135deg,var(--orange),var(--pink))!important;color:#fff!important}
.sunny{background:var(--sun-soft)!important;color:var(--ink)!important}
button.speak{border:0;background:linear-gradient(135deg,var(--orange),var(--pink));color:#fff;width:40px;height:40px;border-radius:50%;display:inline-grid;place-items:center;cursor:pointer;flex:none;box-shadow:0 6px 14px -6px var(--pink);transition:transform .12s}
button.speak:hover{transform:scale(1.08)}
button.speak.talking{animation:pulse .8s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.15);box-shadow:0 0 0 8px color-mix(in srgb,var(--pink) 25%,transparent)}}
button.speak svg{width:18px;height:18px}
select,input[type=text],input[type=search]{font:700 .95rem var(--f-body);color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:14px;padding:10px 12px;max-width:100%}
input[type=text],input[type=search]{width:100%}

/* flashcard */
.flipwrap{perspective:1200px}
.flipper{position:relative;min-height:340px;transition:transform .6s cubic-bezier(.3,1.4,.5,1);transform-style:preserve-3d;cursor:pointer}
.flipper.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:26px;display:grid;place-items:center;text-align:center;padding:26px 20px;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden}
.face.front{background:linear-gradient(150deg,var(--blue-soft),var(--purple-soft))}
.face.back{background:linear-gradient(150deg,var(--sun-soft),var(--pink-soft));transform:rotateY(180deg)}
.face .pic{font-size:72px;line-height:1;animation:bob 2.6s ease-in-out infinite;filter:drop-shadow(0 8px 10px rgba(0,0,0,.15))}
@keyframes bob{50%{transform:translateY(-8px) rotate(3deg)}}
.face .word{font-family:var(--f-display);font-size:clamp(1.5rem,6.5vw,2.3rem);font-weight:700;line-height:1.2;overflow-wrap:anywhere;margin-top:10px}
.face .tr{font-size:1.2rem;font-weight:800;margin-top:6px}
.face .hint{margin-top:8px;font-size:.92rem;color:var(--muted);max-width:42ch;margin-inline:auto}
.face .corner{position:absolute;top:14px;left:16px}
.face .spk{position:absolute;top:12px;right:12px}
.flipwrap.out-r{animation:outR .35s ease-in forwards}.flipwrap.out-l{animation:outL .35s ease-in forwards}.flipwrap.in{animation:cardIn .4s cubic-bezier(.2,.9,.3,1.3)}
@keyframes outR{to{transform:translateX(120%) rotate(14deg);opacity:0}}
@keyframes outL{to{transform:translateX(-120%) rotate(-14deg);opacity:0}}
@keyframes cardIn{from{transform:scale(.85) translateY(20px);opacity:0}}
.art-de{color:var(--de)} .art-het{color:var(--het)}
.pill{display:inline-block;font-size:.75rem;font-weight:800;padding:3px 10px;border-radius:999px;background:var(--surface);color:var(--blue)}
.pill.ok{background:var(--green-soft);color:var(--green)}
.pill.fire{background:var(--orange-soft);color:var(--orange)}
.bar{height:12px;border-radius:99px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--blue),var(--purple),var(--pink));background-size:200% 100%;animation:shine 3s linear infinite;transition:width .6s cubic-bezier(.2,.8,.3,1)}
@keyframes shine{to{background-position:-200% 0}}
.list{display:grid;max-height:440px;overflow:auto;border-radius:16px;background:var(--bg)}
.li{display:flex;gap:10px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .em{font-size:1.4rem;width:30px;text-align:center;flex:none}
.li .nl{font-weight:800;min-width:0;flex:1}
.li .uk{color:var(--muted);flex:1;min-width:0;font-size:.92rem}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.tilebtn{border:0;border-radius:18px;padding:12px;text-align:left;cursor:pointer;font:800 .9rem var(--f-body);color:var(--ink);display:grid;gap:6px;transition:transform .15s}
.tilebtn:hover{transform:translateY(-3px) rotate(-1deg)}
.tilebtn .e{font-size:1.8rem}
.tilebtn .bar{height:6px;background:color-mix(in srgb,var(--ink) 12%,transparent)}
.c0{background:var(--blue-soft)}.c1{background:var(--pink-soft)}.c2{background:var(--sun-soft)}.c3{background:var(--green-soft)}.c4{background:var(--purple-soft)}.c5{background:var(--orange-soft)}

/* quiz */
.opts{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.opt{font:800 1.02rem var(--f-body);text-align:left;padding:14px 16px;border-radius:16px;border:2px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;transition:transform .12s,border-color .12s}
.opt:hover{border-color:var(--blue);transform:translateY(-2px)}
.opt.right{background:var(--green-soft);border-color:var(--green);color:var(--green);animation:pop .4s}
.opt.wrong{background:var(--pink-soft);border-color:var(--pink);color:var(--pink);animation:shake .4s}
@keyframes pop{40%{transform:scale(1.07)}}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.q-pic{font-size:78px;text-align:center;line-height:1;animation:bob 2.6s ease-in-out infinite}
.q-big{font-family:var(--f-display);font-size:1.6rem;text-align:center;padding:6px 0;overflow-wrap:anywhere;font-weight:700}
.feedback{font-weight:800;font-size:1.05rem}
.feedback.ok{color:var(--green)} .feedback.no{color:var(--pink)}
.mode{display:flex;gap:14px;align-items:center}
.mode .mi{width:58px;height:58px;border-radius:18px;display:grid;place-items:center;font-size:30px;flex:none}

/* dialogs */
.chat{display:grid;gap:10px}
.line{display:flex;gap:8px;align-items:flex-end;max-width:92%}
.line.B{margin-left:auto;flex-direction:row-reverse}
.ava{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:22px;flex:none;background:var(--blue-soft)}
.line.B .ava{background:var(--pink-soft)}
.bubble{background:var(--blue-soft);border-radius:18px 18px 18px 6px;padding:10px 12px;min-width:0;display:flex;gap:8px;align-items:flex-start;transition:transform .2s}
.line.B .bubble{background:var(--pink-soft);border-radius:18px 18px 6px 18px}
.bubble .speak{width:32px;height:32px}
.bubble .speak svg{width:15px;height:15px}
.line .nl{font-weight:800}
.line .uk{color:var(--muted);font-size:.9rem}
.line.playing .bubble{transform:scale(1.04);box-shadow:0 0 0 3px var(--sun)}
.hidden-text{filter:blur(7px);cursor:pointer}
.dlg-card{border:0;text-align:left;cursor:pointer;font:inherit;color:inherit}
.dlg-card .e{font-size:2.2rem}

details.g{background:var(--surface);border-radius:var(--r);padding:0 18px;box-shadow:var(--shadow)}
details.g summary{cursor:pointer;padding:15px 0;font-weight:800;list-style:none;display:flex;align-items:center;gap:10px}
details.g summary .e{font-size:1.5rem}
details.g summary::after{content:"+";margin-left:auto;color:var(--blue);font-weight:800;font-size:1.3rem;transition:transform .2s}
details.g[open] summary::after{transform:rotate(45deg)}
details.g .gb{padding-bottom:16px;display:grid;gap:10px;animation:rise .3s both}
details.g ul{margin:0;padding-left:20px}
.tipbox{background:var(--sun-soft);border-radius:14px;padding:10px 12px;font-size:.93rem}
.tipbox b{color:var(--orange)}
.ex{display:flex;gap:10px;align-items:center}
.ex .nl{font-weight:800}
.stat{display:grid;gap:2px;padding:12px;border-radius:16px}
.stat .n{font-family:var(--f-display);font-size:1.7rem;font-variant-numeric:tabular-nums}
.ring{--p:0;width:96px;height:96px;border-radius:50%;flex:none;display:grid;place-items:center;background:conic-gradient(var(--green) calc(var(--p)*1%),var(--line) 0);transition:--p .6s}
.ring>div{width:74px;height:74px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:1.05rem}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:14px;font-weight:700;font-size:.92rem;z-index:20;max-width:calc(100% - 32px)}
.sound .s{font-family:var(--f-display);font-size:1.5rem;font-weight:800;background:linear-gradient(135deg,var(--blue),var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent;width:max-content}
.chip{border:0;background:var(--bg);color:var(--ink);border-radius:999px;padding:7px 13px;font:800 .92rem var(--f-body);cursor:pointer;transition:transform .12s}
.chip:hover{transform:translateY(-2px);background:var(--blue-soft);color:var(--blue)}
table.ff{width:100%;border-collapse:collapse;font-size:.94rem}
table.ff td{padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
table.ff td:first-child{font-weight:800;white-space:nowrap}
.scroll{overflow-x:auto}
.cf{position:fixed;width:9px;height:13px;border-radius:2px;pointer-events:none;z-index:30}
.xpf{position:fixed;pointer-events:none;z-index:31;font:800 1.1rem var(--f-display);color:var(--green)}
.sheet{position:fixed;inset:0;z-index:40;background:rgba(10,14,40,.5);display:grid;place-items:end center;padding:16px max(16px,env(safe-area-inset-left,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px))}
.sheet .card{max-width:560px;width:100%;max-height:85vh;overflow:auto}
.diag li{margin:4px 0}
@media (prefers-reduced-motion:reduce){*,*::before{animation:none!important;transition:none!important}}

/* bottom nav + sub bar */
.wrap{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))!important}
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--surface);box-shadow:0 -8px 24px -14px rgba(20,30,90,.45);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.bn{border:0;background:none;display:grid;justify-items:center;gap:1px;font:800 .7rem var(--f-body);color:var(--muted);padding:6px 0;border-radius:14px;cursor:pointer}
.bn .i{font-size:1.45rem;line-height:1.1;transition:transform .15s}
.bn[aria-current="page"]{color:var(--blue);background:var(--blue-soft)}
.bn[aria-current="page"] .i{transform:translateY(-2px) scale(1.1)}
#subbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;gap:10px;padding:10px 0;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px)}
#subbar h2{flex:1;min-width:0}
.hs{font-weight:800;color:var(--muted)}
.hub{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.hubtile{border:0;border-radius:22px;padding:18px 14px;text-align:left;cursor:pointer;font:inherit;color:var(--ink);display:grid;gap:4px;box-shadow:var(--shadow);transition:transform .15s;animation:rise .4s both}
.hubtile:hover{transform:translateY(-3px) rotate(-1deg)}
.hubtile .e{font-size:2.2rem}
.hubtile b{font-size:1.05rem}
.lvgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.lvcard b{font-size:.85rem}.lvcard .small{font-size:.75rem;line-height:1.3}
.lvcard{border:2px solid var(--line);background:var(--bg);border-radius:18px;padding:12px;text-align:left;cursor:pointer;font:inherit;color:var(--ink);display:grid;gap:2px;transition:transform .15s}
.lvcard .e{font-size:1.6rem}
.lvcard.on{border-color:var(--blue);background:var(--blue-soft);transform:scale(1.02)}
.path{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.pstep{border:0;background:var(--surface);border-radius:16px;padding:10px 6px;display:grid;justify-items:center;gap:2px;cursor:pointer;font:inherit;color:var(--ink)}
.pstep .e{font-size:1.4rem}.pstep b{font-size:.8rem}
.pstep.done{background:var(--green-soft)}
.chip.on{background:linear-gradient(135deg,var(--blue),var(--purple));color:#fff}
.lvchips{gap:6px}
.abc{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px}
.abcb{border:0;background:var(--bg);border-radius:14px;padding:8px 4px;display:grid;justify-items:center;cursor:pointer;font:inherit;color:var(--ink);transition:transform .12s}
.abcb:hover{transform:translateY(-2px);background:var(--blue-soft)}
.abcb b{font-family:var(--f-display);font-size:1.2rem}
.abcb span{font-size:.78rem;color:var(--muted)}
.ph{display:grid;gap:12px}
.phi{display:flex;gap:12px;align-items:flex-start;padding:10px;border-radius:16px;background:var(--bg)}
.phw{flex:none;min-width:64px;text-align:center;font-family:var(--f-display);font-weight:800;font-size:1.25rem;padding:10px 8px;border-radius:14px;background:linear-gradient(135deg,var(--blue),var(--pink));color:#fff;max-width:40%;overflow-wrap:anywhere}
.rtext{display:grid;gap:14px}
.par{display:grid;gap:6px;padding-bottom:10px;border-bottom:1px dashed var(--line)}
.par:last-child{border-bottom:0}
.sen{display:flex;gap:8px;align-items:flex-start;padding:4px 6px;border-radius:12px;transition:background .2s}
.sen.playing{background:var(--sun-soft)}
.sp{flex:none;border:0;width:28px;height:28px;border-radius:50%;background:var(--blue-soft);color:var(--blue);cursor:pointer;font-size:.75rem;margin-top:2px}
.snl{font-size:1.12rem;line-height:1.7}
.suk{color:var(--muted);font-size:.92rem}
.tw{cursor:pointer;border-bottom:2px dotted color-mix(in srgb,var(--blue) 40%,transparent);border-radius:4px;padding:0 1px;transition:background .12s}
.tw:hover,.tw:focus{background:var(--blue-soft)}
.pop{position:fixed;z-index:35;background:var(--ink);color:var(--bg);padding:8px 12px;border-radius:12px;font-size:.95rem;max-width:min(320px,calc(100vw - 16px));box-shadow:0 10px 24px -10px rgba(0,0,0,.5);animation:rise .2s both}
table.gt{border-collapse:collapse;width:100%;font-size:.94rem}
table.gt th,table.gt td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left}
table.gt th{color:var(--blue);font-size:.82rem;text-transform:uppercase;letter-spacing:.04em}
.simple{background:var(--blue-soft);border-radius:14px;padding:12px;font-size:.98rem}
.mist{background:var(--pink-soft);border-radius:14px;padding:10px 12px;display:grid;gap:4px}
.mist s{color:var(--pink)}

.w-ok{color:var(--green);font-weight:800}

.natpill{background:var(--green-soft);color:var(--green)}

const GRAMMAR = [
{t:"De чи het?", body:`<p>У нідерландській два артиклі: <b>de</b> (чоловічий і жіночий рід) і <b>het</b> (середній). Приблизно 2/3 іменників мають <b>de</b>.</p>
<ul><li>Усі слова в множині — <b>de</b>: het kind → de kinderen</li>
<li>Зменшувальні на <b>-je</b> — завжди <b>het</b>: het meisje, het broodje</li>
<li>Слова на <b>-ing</b>, <b>-heid</b> — <b>de</b>: de vergadering</li>
<li>Мови, метали та інфінітив як іменник — <b>het</b>: het Nederlands, het eten</li>
<li>Неозначений артикль один для всіх: <b>een</b></li></ul>`,
ex:[["het huis — de huizen","дім — доми"],["het meisje","дівчинка"],["de vergadering","нарада"]],
tip:"Вчи слово тільки разом з артиклем. Фарбуй: de — синім, het — червоним. Мозок запам'ятає колір.",
q:{q:"Який артикль: ___ broodje?",o:["de","het"],a:1}},
{t:"Порядок слів: дієслово на 2-му місці", body:`<p>Головне правило: <b>дієслово завжди стоїть другим</b>. Якщо речення починається не з підмета, підмет іде <b>після</b> дієслова (інверсія).</p>`,

tip:"Уяви дієслово як «стовпчик» на 2-й позиції: усе інше обертається навколо нього.",

{t:"Заперечення: niet і geen", body:`<p><b>geen</b> — заперечує іменник з een або без артикля. <b>niet</b> — усе інше (дієслово, прикметник, означений іменник).</p>`,

{t:"Теперішній час", body:`<p>Основа = інфінітив без <b>-en</b>. ik + основа, jij/hij + основа + <b>t</b>, wij/jullie/zij + інфінітив.</p>

ex:[["Ik woon in Delft.","Я живу в Делфті."],["Zij werkt in een winkel.","Вона працює в магазині."],["Wij leren Nederlands.","Ми вчимо нідерландську."]],
mistake:["Hij werken.","Hij werkt.","Після hij/zij — основа + t."],
tip:"Якщо основа вже закінчується на -t (zitten → zit), друге t не додаємо: hij zit.",
q:[{q:"Hij ___ (wonen) in Gent.",o:["woon","woont","wonen"],a:1},{q:"Ik ___ (lezen) een boek.",o:["lees","leez","lezen"],a:0}]},
{lv:"A1",e:"💪",t:"Модальні дієслова: kunnen, willen, moeten, mogen",
simple:"Ці дієслова кажуть, <b>чи можеш, хочеш, мусиш</b>. Модальне дієслово стоїть на 2-му місці, а головне дієслово йде <b>в кінець</b> у повній формі.",
rules:`<table class="gt"><tr><th></th><th>kunnen<br>могти</th><th>willen<br>хотіти</th><th>moeten<br>мусити</th><th>mogen<br>можна</th></tr><tr><td>ik</td><td>kan</td><td>wil</td><td>moet</td><td>mag</td></tr><tr><td>jij</td><td>kunt / kan</td><td>wilt</td><td>moet</td><td>mag</td></tr><tr><td>hij</td><td>kan</td><td>wil</td><td>moet</td><td>mag</td></tr><tr><td>wij</td><td>kunnen</td><td>willen</td><td>moeten</td><td>mogen</td></tr></table>`,
ex:[["Ik kan goed koken.","Я добре вмію готувати."],["Wij moeten morgen werken.","Ми мусимо завтра працювати."],["Mag ik hier zitten?","Можна мені тут сісти?"]],

{lv:"A1",e:"✂️",t:"Дієслова, що розпадаються (opstaan, meenemen)",
simple:"Деякі дієслова мають «хвостик»-префікс: <b>op</b>staan, <b>mee</b>nemen, <b>af</b>spreken. У реченні цей хвостик відривається і їде <b>в самий кінець</b>.",

ex:[["Ik sta vroeg op.","Я рано встаю."],["De trein komt om drie uur aan.","Потяг прибуває о третій."],["Bel je me morgen op?","Ти подзвониш мені завтра?"]],

{lv:"A1",e:"🏠",t:"Мій, твій, його: присвійні слова",
simple:"Ці слова кажуть, <b>чиє</b> щось. Вони не змінюються за родом, як в українській (мій/моя/моє — завжди mijn).",
rules:`<table class="gt"><tr><th>Хто</th><th>Чий</th></tr><tr><td>ik</td><td>mijn — мій, моя</td></tr><tr><td>jij</td><td>jouw / je — твій</td></tr><tr><td>u</td><td>uw — ваш</td></tr><tr><td>hij</td><td>zijn — його</td></tr><tr><td>zij</td><td>haar — її</td></tr><tr><td>wij</td><td>ons (het-слова) / onze (de-слова і множина)</td></tr><tr><td>jullie</td><td>jullie — ваш</td></tr><tr><td>zij (мн.)</td><td>hun — їхній</td></tr></table>`,
ex:[["Mijn moeder woont in Kyiv.","Моя мама живе в Києві."],["Is dit jouw jas?","Це твоя куртка?"],["Ons huis is klein, onze tuin is groot.","Наш дім маленький, наш сад великий."]],
mistake:["Anna en zijn man","Anna en haar man","Про жінку — haar (її), про чоловіка — zijn (його)."],

q:[{q:"Dat is ___ huis. (наш, het huis)",o:["ons","onze"],a:0},{q:"Anna en ___ man (її)",o:["zijn","haar"],a:1}]},
{lv:"A1",e:"🌈",t:"Прикметник: коли додавати -e",
simple:"Коли прикметник стоїть <b>перед</b> іменником, він майже завжди отримує <b>-e</b>. Є лише один виняток.",
rules:`<ul><li>de mooi<b>e</b> stad, het mooi<b>e</b> huis, mooi<b>e</b> huizen — з -e</li><li><b>Виняток:</b> het-слово в однині з een або без артикля: <b>een mooi huis</b> — без -e</li><li>Після іменника — ніколи: Het huis is mooi.</li></ul>`,

{lv:"A1",e:"🐣",t:"Зменшувальні слова на -je",
simple:"Нідерландці дуже люблять зменшувальні. Вони означають не лише «маленьке», а й «миле, дружнє». Такі слова <b>завжди мають het</b>.",
rules:`<ul><li>+je: het huis → het huis<b>je</b></li><li>+tje після голосного або l, n, r: de stoel → het stoel<b>tje</b></li><li>+pje після m: de boom → het boom<b>pje</b></li><li>+etje після короткого голосного + l, m, n, r, ng: de bal → het ball<b>etje</b></li></ul>`,

tip:"Зменшувальне робить прохання м'якшим: «Heb je even een minuutje?»",
q:[{q:"___ kopje",o:["de","het"],a:1}]},
{lv:"A1",e:"🕐",t:"Котра година",

{lv:"A2",e:"⏪",t:"Минулий час perfectum (я зробив)",
simple:"У розмові минуле майже завжди кажуть так: <b>hebben або zijn</b> (на 2-му місці) + <b>форма на ge-…-t/d</b> (у кінці).",
rules:`<ul><li>Утворення: <b>ge + основа + t/d</b>: werken → <b>ge</b>werk<b>t</b>, wonen → <b>ge</b>woon<b>d</b>.</li><li>Правило <b>'t kofschip</b>: якщо основа закінчується на t, k, f, s, ch, p — пишемо <b>-t</b>, інакше <b>-d</b>.</li><li>Більшість дієслів — з <b>hebben</b>: Ik heb gekookt.</li><li>Рух і зміна стану — з <b>zijn</b>: gaan, komen, blijven, worden: Ik ben gegaan.</li><li>Неправильні треба вчити: zien → gezien, eten → gegeten, drinken → gedronken, gaan → gegaan.</li></ul>`,
ex:[["Ik heb gisteren gewerkt.","Я вчора працював."],["Wij zijn naar Amsterdam gegaan.","Ми поїхали до Амстердама."],["Heb je de film gezien?","Ти бачив фільм?"]],
mistake:["Ik heb naar huis gegaan.","Ik ben naar huis gegaan.","gaan — рух, тому zijn."],
tip:"«'t kofschip» = «кавовий корабель». Уяви корабель із кавою: усі приголосні з нього дають -t.",
q:[{q:"Wij hebben ___ (fietsen).",o:["gefietsd","gefietst"],a:1},{q:"Zij ___ thuis gebleven.",o:["heeft","is"],a:1}]},
{lv:"A2",e:"📜",t:"Простий минулий час (imperfectum): was, had",
simple:"У розповідях і текстах використовують простий минулий: <b>ik was</b> (я був), <b>ik had</b> (я мав), <b>ik woonde</b> (я жив).",
rules:`<ul><li>zijn → was / waren (мн.); hebben → had / hadden</li><li>Правильні: основа + <b>-te</b> ('t kofschip) або <b>-de</b>: werken → werk<b>te</b>, wonen → woon<b>de</b>. Множина: werkten, woonden.</li><li>Часті неправильні: gaan → ging, komen → kwam, zien → zag, doen → deed, krijgen → kreeg, vinden → vond.</li></ul>`,
ex:[["Vroeger woonde ik in Lviv.","Раніше я жила у Львові."],["Het was koud.","Було холодно."],["We hadden geen tijd.","У нас не було часу."]],
mistake:["Ik werkde.","Ik werkte.","k — з 't kofschip, тому -te."],
tip:"Для розмови вистачає perfectum, а was і had вчи одразу — вони найчастіші.",
q:[{q:"Gisteren ___ ik ziek. (zijn)",o:["ben","was"],a:1},{q:"wonen → ik ___",o:["woonte","woonde"],a:1}]},
{lv:"A2",e:"🔮",t:"Майбутнє: gaan + дієслово",
simple:"Найпростіше майбутнє — як «я збираюся»: <b>gaan</b> на 2-му місці + дієслово в кінці. Часто просто теперішній час + слово «morgen».",
rules:`<ul><li>Ik <b>ga</b> morgen <b>koken</b>. — Завтра я готуватиму.</li><li>Morgen <b>werk</b> ik thuis. — Завтра я працюю вдома (теперішній час).</li><li><b>zullen</b> — обіцянка або пропозиція: Ik zal je helpen. Zullen we gaan?</li></ul>`,
ex:[["We gaan volgend jaar verhuizen.","Ми наступного року переїжджаємо."],["Ik zal het morgen doen.","Я зроблю це завтра (обіцяю)."],["Zullen we koffie drinken?","Може, вип'ємо кави?"]],

{lv:"A2",e:"🔗",t:"Складні речення: omdat, dat, als (дієслово в кінець)",
simple:"Після слів <b>omdat</b> (тому що), <b>dat</b> (що), <b>als</b> (якщо), <b>wanneer</b>, <b>terwijl</b> дієслово переїжджає <b>в самий кінець</b> частини речення.",
rules:`<ul><li>Ik blijf thuis, <b>omdat</b> ik ziek <b>ben</b>.</li><li>Ik denk <b>dat</b> hij morgen <b>komt</b>.</li><li><b>Als</b> het <b>regent</b>, neem ik de bus.</li><li>Але <b>want</b> (бо) — звичайний порядок: Ik blijf thuis, want ik ben ziek.</li></ul>`,
ex:[["Ik leer Nederlands, omdat ik hier woon.","Я вчу нідерландську, бо я тут живу."],["Ik weet dat het moeilijk is.","Я знаю, що це важко."],["Als je tijd hebt, bel me.","Якщо будеш мати час, подзвони."]],

q:[{q:"Ik kom niet, omdat ik ___ .",o:["ben moe","moe ben"],a:1},{q:"Ik kom niet, want ik ___ .",o:["ben moe","moe ben"],a:0}]},
{lv:"A2",e:"📊",t:"Порівняння: groter, het grootst",
simple:"Більше: <b>+er</b>. Найбільше: <b>het + -st</b>. Порівнюємо словом <b>dan</b> (ніж).",

{lv:"A0",e:"📦",t:"Де? Прийменники місця",
simple:"Ці маленькі слова кажуть, <b>де</b> щось знаходиться. Найчастіші — <b>in</b> (в) і <b>op</b> (на), але вони не завжди збігаються з українськими.",
rules:`<table class="gt"><tr><th>NL</th><th>UA</th><th>приклад</th></tr><tr><td>in</td><td>в, у</td><td>in de kast — у шафі</td></tr><tr><td>op</td><td>на</td><td>op de tafel — на столі</td></tr><tr><td>onder</td><td>під</td><td>onder het bed — під ліжком</td></tr><tr><td>naast</td><td>поруч</td><td>naast de deur — біля дверей</td></tr><tr><td>achter</td><td>за, позаду</td><td>achter het huis — за будинком</td></tr><tr><td>voor</td><td>перед</td><td>voor de winkel — перед магазином</td></tr><tr><td>tussen</td><td>між</td><td>tussen de stoelen — між стільцями</td></tr><tr><td>bij</td><td>у (когось), біля</td><td>bij de dokter — у лікаря</td></tr></table><ul><li>Увага: <b>op</b> het werk (на роботі), <b>op</b> school (у школі), <b>op</b> straat (на вулиці), <b>in</b> de stad (у місті), <b>in</b> de trein (у потязі).</li></ul>`,
ex:[["De sleutel ligt op de tafel.","Ключ лежить на столі."],["Ik ben op het werk.","Я на роботі."],["Hij woont naast de school.","Він живе поруч зі школою."]],
mistake:["Ik ben in school.","Ik ben op school.","School і werk — з op."],
tip:"Вчи готовими блоками: op school, op het werk, in de stad, bij de dokter.",
q:[{q:"De kat zit ___ de tafel. (під)",o:["onder","op"],a:0},{q:"Ik ben ___ de dokter.",o:["bij","op"],a:0}]},
{lv:"A1",e:"👉",t:"Мене, тебе, його: займенники-додатки",
simple:"Коли людина не діє, а <b>на неї</b> діють (бачать, дзвонять, допомагають), займенник змінюється: ik → <b>mij</b>, hij → <b>hem</b>, zij → <b>haar</b>.",
rules:`<table class="gt"><tr><th>Хто діє</th><th>На кого діють</th></tr><tr><td>ik</td><td>mij / me — мене, мені</td></tr><tr><td>jij</td><td>jou / je — тебе, тобі</td></tr><tr><td>u</td><td>u — вас</td></tr><tr><td>hij</td><td>hem — його, йому</td></tr><tr><td>zij</td><td>haar — її, їй</td></tr><tr><td>het</td><td>het — його (річ)</td></tr><tr><td>wij</td><td>ons — нас</td></tr><tr><td>jullie</td><td>jullie — вас</td></tr><tr><td>zij (мн.)</td><td>hen / hun / ze — їх, їм</td></tr></table><ul><li>Коротка форма (me, je, ze) — у звичайній мові; повна (mij, jou) — коли наголошуєш.</li></ul>`,
ex:[["Kun je mij helpen?","Можеш мені допомогти?"],["Ik bel hem morgen.","Я подзвоню йому завтра."],["Ik zie haar elke dag.","Я бачу її щодня."]],
mistake:["Kun je ik helpen?","Kun je mij helpen?","Після дієслова — mij, а не ik."],
tip:"Для людей у множині просто кажи <b>ze</b>: Ik zie ze. Це завжди правильно в розмові.",
q:[{q:"Ik geef ___ een cadeau. (йому)",o:["hij","hem"],a:1},{q:"Bel ___ morgen! (мені)",o:["me","ik"],a:0}]},
{lv:"A1",e:"🗓️",t:"Коли? Прийменники часу",
simple:"Для часу є три головні слова: <b>om</b> — о годині, <b>op</b> — у день, <b>in</b> — у місяць, рік, сезон.",
rules:`<ul><li><b>om</b> acht uur — о восьмій</li><li><b>op</b> maandag, <b>op</b> 5 mei — у понеділок, 5 травня</li><li><b>in</b> januari, <b>in</b> de zomer, <b>in</b> 2025 — у січні, влітку, у 2025</li><li><b>'s ochtends</b>, 's middags, 's avonds, 's nachts — вранці, вдень, ввечері, вночі</li><li><b>over</b> een week — через тиждень (у майбутньому)</li><li>een week <b>geleden</b> — тиждень тому</li><li><b>van</b> negen <b>tot</b> vijf — з дев'ятої до п'ятої</li><li><b>sinds</b> maart — з березня (і досі)</li></ul>`,
ex:[["Ik heb op dinsdag een afspraak.","У мене зустріч у вівторок."],["We gaan in augustus op vakantie.","Ми їдемо у відпустку в серпні."],["De bus komt over vijf minuten.","Автобус приїде через п'ять хвилин."]],
mistake:["in maandag","op maandag","Дні тижня — з op."],
tip:"Згадай «від маленького до великого»: om (година) → op (день) → in (місяць, рік).",
q:[{q:"___ zes uur",o:["om","op","in"],a:0},{q:"___ de winter",o:["om","op","in"],a:2},{q:"Через тиждень = ___ een week",o:["over","geleden"],a:0}]},
{lv:"A1",e:"🚌",t:"Порядок у реченні: коли – як – куди",
simple:"Коли в реченні є і час, і спосіб, і місце, їх ставлять у порядку <b>Час → Як → Де/Куди</b>. Запам'ятай слово <b>«ТеМПеЛ»</b>: Tijd, Manier, Plaats.",
rules:`<table class="gt"><tr><th>хто</th><th>дієсл.</th><th>коли</th><th>як</th><th>куди</th></tr><tr><td>Ik</td><td>ga</td><td>morgen</td><td>met de bus</td><td>naar Amsterdam.</td></tr><tr><td>Wij</td><td>fietsen</td><td>elke dag</td><td>samen</td><td>naar school.</td></tr></table><ul><li>Якщо почати з часу, не забудь про інверсію: <b>Morgen ga ik</b> met de bus naar Amsterdam.</li></ul>`,
ex:[["Ik ga morgen met de trein naar Utrecht.","Завтра я їду потягом до Утрехта."],["Zij werkt vandaag thuis.","Сьогодні вона працює вдома."],["Morgen ga ik met de fiets naar het werk.","Завтра я поїду на роботу велосипедом."]],
mistake:["Ik ga naar Utrecht morgen met de trein.","Ik ga morgen met de trein naar Utrecht.","Спершу коли, потім як, наприкінці куди."],
tip:"Місце (куди) майже завжди стоїть ближче до кінця речення.",
q:[{q:"Як правильно?",o:["Ik werk thuis vandaag.","Ik werk vandaag thuis."],a:1}]},
{lv:"A1",e:"🪞",t:"Зворотні дієслова (zich): я почуваюся",
simple:"Як українське «-ся» (митися, почуватися), у нідерландській є слово <b>zich</b>. Воно змінюється за особою: ik voel <b>me</b>, jij voelt <b>je</b>, hij voelt <b>zich</b>.",
rules:`<table class="gt"><tr><th></th><th>zich voelen — почуватися</th></tr><tr><td>ik</td><td>voel me</td></tr><tr><td>jij / je</td><td>voelt je</td></tr><tr><td>u</td><td>voelt zich / u</td></tr><tr><td>hij / zij</td><td>voelt zich</td></tr><tr><td>wij</td><td>voelen ons</td></tr><tr><td>jullie</td><td>voelen je</td></tr><tr><td>zij (мн.)</td><td>voelen zich</td></tr></table><ul><li>Часті: zich voelen (почуватися), zich wassen (митися), zich haasten (поспішати), zich vergissen (помилятися), zich herinneren (пам'ятати), zich aanmelden (реєструватися).</li></ul>`,
ex:[["Ik voel me niet lekker.","Я погано почуваюся."],["Hij vergist zich.","Він помиляється."],["We moeten ons haasten.","Нам треба поспішати."]],
mistake:["Ik voel zich goed.","Ik voel me goed.","Після ik — me, а не zich."],
tip:"«Ik voel me niet lekker» — найважливіша фраза для лікаря і роботи.",
q:[{q:"Hoe voel je ___?",o:["je","zich"],a:0},{q:"Wij haasten ___.",o:["ons","zich"],a:0}]},
{lv:"A1",e:"🧩",t:"Сполучники en, maar, of, want, dus",
simple:"Ці слова з'єднують два звичайні речення, і порядок слів <b>не змінюється</b>. Це найпростіший спосіб говорити довшими фразами.",
rules:`<ul><li><b>en</b> — і: Ik kook en hij wast af.</li><li><b>maar</b> — але: Het is duur, maar mooi.</li><li><b>of</b> — або: Wil je thee of koffie?</li><li><b>want</b> — бо: Ik blijf thuis, want ik ben ziek.</li><li><b>dus</b> — тому, отже: Het regent, dus ik neem de bus.</li></ul><p>Порівняй з <b>omdat</b> (тому що): після нього дієслово йде в кінець — див. тему про складні речення.</p>`,
ex:[["Ik wil komen, maar ik heb geen tijd.","Я хочу прийти, але не маю часу."],["Neem een jas mee, want het is koud.","Візьми куртку, бо холодно."],["Ik ben moe, dus ik ga slapen.","Я втомлений, тож іду спати."]],
mistake:["..., want ik ziek ben.","..., want ik ben ziek.","Після want — звичайний порядок."],
tip:"Почни з want замість omdat — так менше шансів помилитися з порядком слів.",
q:[{q:"Ik kom niet, want ik ___.",o:["ben moe","moe ben"],a:0},{q:"Wil je water ___ sap?",o:["of","want"],a:0}]},
{lv:"A1",e:"🔗",t:"Дієслова з прийменником: wachten op, houden van",
simple:"Деякі дієслова завжди йдуть зі своїм прийменником, і він часто <b>не такий, як в українській</b>. Вчи їх парою.",
rules:`<table class="gt"><tr><th>NL</th><th>UA</th></tr><tr><td>wachten op</td><td>чекати на</td></tr><tr><td>denken aan</td><td>думати про</td></tr><tr><td>houden van</td><td>любити</td></tr><tr><td>kijken naar</td><td>дивитися на</td></tr><tr><td>luisteren naar</td><td>слухати</td></tr><tr><td>praten over</td><td>говорити про</td></tr><tr><td>zoeken naar</td><td>шукати</td></tr><tr><td>helpen met</td><td>допомагати з</td></tr><tr><td>beginnen met</td><td>починати</td></tr><tr><td>bang zijn voor</td><td>боятися</td></tr></table>`,
ex:[["Ik wacht op de bus.","Я чекаю на автобус."],["Ik denk aan jou.","Я думаю про тебе."],["Ik luister naar muziek.","Я слухаю музику."]],
mistake:["Ik luister muziek.","Ik luister naar muziek.","luisteren завжди з naar."],
tip:"Зроби картки «дієслово + прийменник» і вчи їх як одне слово: wachten-op.",
q:[{q:"Ik houd ___ chocolade.",o:["van","op"],a:0},{q:"We wachten ___ de trein.",o:["naar","op"],a:1}]},
{lv:"A2",e:"📋",t:"Неправильні дієслова: головна таблиця",
simple:"Найчастіші дієслова змінюються не за правилом, і їх треба <b>вивчити напам'ять</b>. Добра новина: 30 дієслів з цієї таблиці покривають більшість розмов. Натисни ▶, щоб почути всі три форми.",
rules:`<p>Колонки: <b>інфінітив</b> → <b>минулий простий</b> (ik/hij — wij) → <b>perfectum</b> (з hebben або <b>zijn</b>).</p>`,
verbs:[["zijn","was / waren","is geweest","бути"],["hebben","had / hadden","heeft gehad","мати"],["gaan","ging / gingen","is gegaan","іти"],["komen","kwam / kwamen","is gekomen","приходити"],["doen","deed / deden","heeft gedaan","робити"],["zien","zag / zagen","heeft gezien","бачити"],["eten","at / aten","heeft gegeten","їсти"],["drinken","dronk / dronken","heeft gedronken","пити"],["slapen","sliep / sliepen","heeft geslapen","спати"],["lopen","liep / liepen","heeft gelopen","іти пішки"],["rijden","reed / reden","heeft gereden","їхати"],["vinden","vond / vonden","heeft gevonden","знаходити"],["krijgen","kreeg / kregen","heeft gekregen","отримувати"],["geven","gaf / gaven","heeft gegeven","давати"],["nemen","nam / namen","heeft genomen","брати"],["spreken","sprak / spraken","heeft gesproken","говорити"],["schrijven","schreef / schreven","heeft geschreven","писати"],["lezen","las / lazen","heeft gelezen","читати"],["kijken","keek / keken","heeft gekeken","дивитися"],["zitten","zat / zaten","heeft gezeten","сидіти"],["staan","stond / stonden","heeft gestaan","стояти"],["liggen","lag / lagen","heeft gelegen","лежати"],["blijven","bleef / bleven","is gebleven","залишатися"],["worden","werd / werden","is geworden","ставати"],["beginnen","begon / begonnen","is begonnen","починати"],["begrijpen","begreep / begrepen","heeft begrepen","розуміти"],["weten","wist / wisten","heeft geweten","знати"],["denken","dacht / dachten","heeft gedacht","думати"],["kopen","kocht / kochten","heeft gekocht","купувати"],["brengen","bracht / brachten","heeft gebracht","приносити"]],
ex:[["Ik heb een brief geschreven.","Я написав листа."],["Gisteren gingen we naar het strand.","Учора ми ходили на пляж."],["Hij is thuis gebleven.","Він залишився вдома."]],
mistake:["Ik heb gegaan.","Ik ben gegaan.","gaan, komen, blijven, worden — з zijn."],
tip:"Вчи по 5 дієслів на день, кажучи вголос усі три форми: «gaan — ging — gegaan». Ритм запам'ятовується як пісня.",
q:[{q:"zien → perfectum",o:["heeft gezien","heeft gezaagd"],a:0},{q:"Gisteren ___ ik een boek. (lezen)",o:["las","leesde"],a:0},{q:"Wij ___ naar huis gegaan.",o:["hebben","zijn"],a:1}]},
{lv:"A2",e:"👤",t:"Який, що, котрий: die і dat",
simple:"Щоб описати людину чи річ цілим реченням («чоловік, <b>який</b> живе поруч»), кажуть <b>die</b> (для de-слів і множини) або <b>dat</b> (для het-слів). Дієслово йде <b>в кінець</b>.",
rules:`<ul><li>de man → de man <b>die</b> naast ons <b>woont</b></li><li>het huis → het huis <b>dat</b> ik wil <b>kopen</b></li><li>de mensen → de mensen <b>die</b> hier <b>werken</b></li><li>З прийменником про людей: de vrouw <b>met wie</b> ik werk</li></ul>`,
ex:[["Dat is de vrouw die mij heeft geholpen.","Це жінка, яка мені допомогла."],["Het boek dat ik lees is spannend.","Книжка, яку я читаю, захоплива."],["De kinderen die buiten spelen zijn blij.","Діти, які граються надворі, щасливі."]],
mistake:["het huis die ik koop","het huis dat ik koop","huis — het-слово, тому dat."],
tip:"Подивися на артикль слова: de → die, het → dat. Як рима: de-die, het-dat.",
q:[{q:"de fiets ___ ik heb gekocht",o:["die","dat"],a:0},{q:"het kind ___ daar speelt",o:["die","dat"],a:1}]},
{lv:"A2",e:"🎯",t:"Om … te: щоб, для того щоб",
simple:"Щоб сказати мету («я йду в магазин, <b>щоб купити</b> хліб»), використовують <b>om … te + дієслово</b>. Дієслово стоїть у кінці.",
rules:`<ul><li>Ik ga naar de winkel <b>om</b> brood <b>te kopen</b>.</li><li>Het is moeilijk <b>om</b> Nederlands <b>te leren</b>.</li><li>Після деяких дієслів просто <b>te</b>: Ik probeer <b>te slapen</b>. Ik vergeet <b>te bellen</b>.</li><li>Відокремлювані: <b>op te staan</b>, <b>mee te nemen</b> (te — посередині).</li></ul>`,
ex:[["Ik leer Nederlands om hier te werken.","Я вчу нідерландську, щоб тут працювати."],["Het is leuk om te fietsen.","Їздити на велосипеді класно."],["Vergeet niet je paraplu mee te nemen.","Не забудь узяти парасольку."]],
mistake:["om te brood kopen","om brood te kopen","te стоїть прямо перед дієсловом."],
tip:"Порівняй: om … te = «щоб»; omdat = «тому що». Перше — мета, друге — причина.",
q:[{q:"Ik spaar geld ___ een auto ___ kopen.",o:["om … te","omdat … —"],a:0}]},
{lv:"A2",e:"🤔",t:"Непрямі питання: Weet u waar…?",
simple:"Ввічливе питання часто починають з «Ви знаєте…?» або «Я не знаю…». Тоді питальне слово (<b>waar, wanneer, hoe</b>) або <b>of</b> (чи) стоїть на початку другої частини, а дієслово йде <b>в кінець</b>.",
rules:`<ul><li>Waar is het station? → Weet u <b>waar</b> het station <b>is</b>?</li><li>Komt hij? → Ik weet niet <b>of</b> hij <b>komt</b>.</li><li>Hoe laat begint het? → Kunt u zeggen <b>hoe laat</b> het <b>begint</b>?</li></ul>`,
ex:[["Weet u waar de apotheek is?","Ви не знаєте, де аптека?"],["Ik weet niet of ik morgen kan.","Я не знаю, чи зможу завтра."],["Kun je me vertellen hoe dit werkt?","Можеш розповісти, як це працює?"]],
mistake:["Weet u waar is het station?","Weet u waar het station is?","Дієслово — в кінці."],
tip:"«Weet u waar … is?» — найввічливіший спосіб спитати дорогу.",
q:[{q:"Ik weet niet ___ hij thuis is. (чи)",o:["of","als"],a:0},{q:"Weet je wanneer de film ___?",o:["begint","begint het"],a:0}]},
{lv:"A2",e:"🌀",t:"Маленьке слово er: чотири значення",
simple:"<b>er</b> — дуже часте слово з кількома ролями. Не лякайся: досить розпізнавати чотири основні.",
rules:`<ol><li><b>Er is / er zijn</b> — «є»: Er is een probleem.</li><li><b>Там</b> (замість місця): Woon je in Gent? Ja, ik woon <b>er</b> al tien jaar.</li><li><b>З числом</b> (з них): Hoeveel kinderen heb je? Ik heb <b>er</b> twee.</li><li><b>Er + прийменник</b> замість «це»: Ik denk <b>eraan</b> (я думаю про це), Ik ben <b>ermee</b> klaar (я з цим закінчив).</li></ol>`,
ex:[["Ik heb er drie.","У мене їх три."],["Ik ben er nooit geweest.","Я там ніколи не був."],["Wat vind je ervan?","Що ти про це думаєш?"]],
mistake:["Ik heb twee.","Ik heb er twee.","З числом без іменника потрібне er."],
tip:"«Wat vind je ervan?» (що думаєш про це?) — фраза, яку почуєш щодня.",
q:[{q:"Hoeveel broers heb je? Ik heb ___ één.",o:["er","het"],a:0}]},
{lv:"A2",e:"🏗️",t:"Пасив: wordt gemaakt (робиться)",
simple:"Коли неважливо, <b>хто</b> робить, а важливо <b>що</b> відбувається, кажуть <b>worden + дієприкметник</b>. Ти часто бачитимеш це в листах і оголошеннях.",
rules:`<ul><li>Зараз: Het huis <b>wordt gebouwd</b>. — Будинок будується.</li><li>Минуле: Het huis <b>is gebouwd</b>. — Будинок збудовано.</li><li>Хто зробив — через <b>door</b>: De brief is geschreven <b>door</b> de gemeente.</li><li>Безособово: Er <b>wordt</b> hier niet <b>gerookt</b>. — Тут не палять.</li></ul>`,

mistake:["Het huis wordt bouwen.","Het huis wordt gebouwd.","Після worden — форма на ge-."],
tip:"У листах від gemeente і банку пасив скрізь: «Uw betaling is ontvangen» — ваш платіж отримано.",
q:[{q:"De brief ___ morgen verstuurd.",o:["wordt","heeft"],a:0}]}
];

[["Ik ben dertig jaar.","Мені тридцять років."],["Ik ben getrouwd.","Я заміжня."],["Mijn man heet Andrij.","Мого чоловіка звати Андрій."],["Wij hebben een zoon en een dochter.","У нас є син і донька."],["Mijn zoon heet Maks.","Мого сина звати Макс."],["Hij is acht jaar.","Йому вісім років."],["Mijn dochter heet Sofia.","Мою доньку звати Софія."],["Zij is vijf jaar.","Їй п'ять років."]],

{id:"t1",lv:"A0",e:"⏰",t:"Mijn dag",uk:"Мій день",p:[
[["Ik sta om zeven uur op.","Я встаю о сьомій."],["Ik ga naar de badkamer.","Я йду у ванну."],["Ik douche en ik poets mijn tanden.","Я приймаю душ і чищу зуби."],["Dan ontbijt ik.","Потім я снідаю."],["Ik eet brood met kaas en ik drink thee.","Я їм хліб із сиром і п'ю чай."]],
[["Om acht uur ga ik naar mijn werk.","О восьмій я йду на роботу."],["Ik ga met de bus.","Я їду автобусом."],["De bus is vaak vol.","Автобус часто повний."],["Ik werk van negen tot vijf.","Я працюю з дев'ятої до п'ятої."],["Om twaalf uur heb ik pauze.","О дванадцятій у мене перерва."],["Ik eet een broodje en ik drink koffie.","Я їм бутерброд і п'ю каву."]],
[["Na het werk ga ik naar de supermarkt.","Після роботи я йду в супермаркет."],["Ik koop melk, eieren en groente.","Я купую молоко, яйця й овочі."],["Om zes uur kook ik.","О шостій я готую."],["Ik kook soep of pasta.","Я варю суп або пасту."],["We eten om half zeven.","Ми їмо о пів на сьому."]],
[["Na het eten kijk ik tv.","Після їжі я дивлюся телевізор."],["Soms lees ik een boek.","Іноді я читаю книжку."],["Soms bel ik mijn moeder in Oekraïne.","Іноді я дзвоню мамі в Україну."],["Om elf uur ga ik naar bed.","Об одинадцятій я лягаю спати."],["Ik ben moe, maar blij.","Я втомлений, але щасливий."],["Morgen is een nieuwe dag.","Завтра новий день."]]],

{id:"t2",lv:"A1",e:"🧀",t:"Op de markt",uk:"На ринку",p:[
[["Elke zaterdag ga ik naar de markt.","Щосуботи я ходжу на ринок."],["De markt is op het plein in het centrum.","Ринок на площі в центрі."],["Er zijn veel kramen.","Там багато яток."],["Je kunt er groente, fruit, kaas, vis en bloemen kopen.","Там можна купити овочі, фрукти, сир, рибу і квіти."],["Ik ga altijd met mijn buurvrouw Ineke.","Я завжди ходжу з сусідкою Інеке."],["Ineke is zeventig jaar en ze kent iedereen op de markt.","Інеке сімдесят років, і вона знає всіх на ринку."]],
[["Eerst gaan we naar de groenteman.","Спершу ми йдемо до продавця овочів."],["„Goedemorgen! Wat mag het zijn?” vraagt hij.","«Доброго ранку! Що бажаєте?» — питає він."],["„Een kilo aardappelen en een bos wortels, alstublieft,” zeg ik.","«Кілограм картоплі й пучок моркви, будь ласка», — кажу я."],["„Anders nog iets?”","«Ще щось?»"],["„Ja, doe ook maar drie paprika's.”","«Так, дайте ще три перці»."],["„Dat is vier euro twintig.”","«Це чотири євро двадцять»."]],
[["Dan gaan we naar de kaasboer.","Потім ми йдемо до продавця сиру."],["Nederlandse kaas is heel lekker.","Нідерландський сир дуже смачний."],["Ik mag een stukje proeven.","Мені можна скуштувати шматочок."],["„Deze is jong en deze is oud,” legt de kaasboer uit.","«Цей молодий, а цей витриманий», — пояснює продавець."],["Oude kaas is sterker.","Витриманий сир гостріший."],["Ik neem een stuk jonge kaas voor de kinderen en een stuk oude kaas voor mij.","Я беру шматок молодого сиру для дітей і шматок витриманого для себе."]],
[["Bij de viskraam koopt Ineke haring.","У рибній ятці Інеке купує оселедця."],["Ze eet de haring met uitjes, zoals echte Nederlanders.","Вона їсть оселедця з цибулькою, як справжні нідерландці."],["Ik probeer het ook.","Я теж пробую."],["Het is een beetje raar, maar wel lekker!","Трохи дивно, але смачно!"]],
[["Op het einde kopen we bloemen.","Наприкінці ми купуємо квіти."],["Tulpen zijn niet duur: tien tulpen voor vijf euro.","Тюльпани недорогі: десять тюльпанів за п'ять євро."],["Ik kies gele tulpen.","Я вибираю жовті тюльпани."],["Thuis zet ik ze in een vaas op de tafel.","Удома я ставлю їх у вазу на стіл."]],
[["De markt is gezellig.","На ринку затишно й весело."],["Er is muziek, de mensen praten en lachen.","Грає музика, люди розмовляють і сміються."],["Ik leer daar veel nieuwe woorden.","Я вчу там багато нових слів."],["En ik oefen mijn Nederlands, want op de markt praat niemand Engels met mij!","І я практикую нідерландську, бо на ринку ніхто не говорить зі мною англійською!"]]],
q:[{q:"Коли вона ходить на ринок?",o:["Щонеділі","Щосуботи","Щодня"],a:1},{q:"Який сир гостріший?",o:["Молодий","Витриманий","Однаковий"],a:1},{q:"Скільки коштують 10 тюльпанів?",o:["€4,20","€5","€10"],a:1}]},

{id:"t3",lv:"A1",e:"🌦️",t:"Het weer in Nederland",uk:"Погода в Нідерландах",p:[
[["In Nederland praten de mensen graag over het weer.","У Нідерландах люди люблять говорити про погоду."],["Het weer verandert snel.","Погода швидко змінюється."],["'s Ochtends schijnt de zon, 's middags regent het en 's avonds waait het hard.","Вранці світить сонце, вдень іде дощ, а ввечері дме сильний вітер."],["Daarom heeft iedereen altijd een jas en een paraplu bij zich.","Тому всі завжди мають із собою куртку й парасольку."]],
[["In de winter is het koud, maar het sneeuwt niet vaak.","Узимку холодно, але сніг іде нечасто."],["De temperatuur is meestal rond de vijf graden.","Температура зазвичай близько п'яти градусів."],["Het is vaak grijs en nat.","Часто сіро й мокро."],["Soms vriest het.","Іноді підмерзає."],["Dan kunnen de mensen schaatsen op het ijs.","Тоді люди можуть кататися на ковзанах по льоду."],["Dat is een groot feest!","Це велике свято!"]],
[["De lente is mooi.","Весна гарна."],["De dagen worden langer en de bomen worden groen.","Дні стають довшими, а дерева зеленіють."],["In april bloeien de tulpen.","У квітні цвітуть тюльпани."],["Veel toeristen komen dan naar Nederland om de bloemenvelden te zien.","Тоді багато туристів приїжджає до Нідерландів, щоб побачити квіткові поля."]],
[["In de zomer is het warm, soms vijfentwintig graden of meer.","Улітку тепло, іноді двадцять п'ять градусів і більше."],["Dan gaan de mensen naar het strand.","Тоді люди їдуть на пляж."],["Ze zwemmen in de zee of ze zitten op een terras.","Вони плавають у морі або сидять на терасі кафе."],["Het is lang licht: om tien uur 's avonds is het nog niet donker.","Довго світло: о десятій вечора ще не темно."]],
[["In de herfst vallen de bladeren van de bomen.","Восени з дерев падає листя."],["Het regent veel en het waait hard.","Часто йде дощ і дме сильний вітер."],["Fietsen tegen de wind is zwaar!","Їхати на велосипеді проти вітру важко!"],["Maar Nederlanders blijven fietsen, ook in de regen.","Але нідерландці все одно їздять, навіть під дощем."]],
[["Er is een bekend Nederlands gezegde: „Er is geen slecht weer, alleen slechte kleren.”","Є відома нідерландська приказка: «Немає поганої погоди, є лише поганий одяг»."],["Dus koop een goede regenjas, en geniet van het Nederlandse weer!","Тож купи добрий дощовик і насолоджуйся нідерландською погодою!"]]],
q:[{q:"Яка зазвичай температура взимку?",o:["Близько 5°","Близько -10°","Близько 15°"],a:0},{q:"Коли цвітуть тюльпани?",o:["У березні","У квітні","У червні"],a:1},{q:"Що роблять нідерландці під дощем?",o:["Сидять удома","Їздять на велосипеді","Їдуть на пляж"],a:1}]},

{id:"t4",lv:"A2",e:"🏡",t:"Mijn eerste jaar in Nederland",uk:"Мій перший рік у Нідерландах",p:[
[["Een jaar geleden ben ik met mijn kinderen naar Nederland gekomen.","Рік тому я приїхала з дітьми до Нідерландів."],["Het begin was niet makkelijk.","Початок був нелегким."],["We spraken geen Nederlands en we kenden niemand.","Ми не говорили нідерландською і нікого не знали."],["Daarna kregen we een klein huis in een dorp bij Zwolle.","Потім ми отримали маленький будинок у селі біля Зволле."]],
[["De eerste weken waren moeilijk.","Перші тижні були важкими."],["Ik moest veel formulieren invullen bij de gemeente.","Мені довелося заповнити багато бланків у муніципалітеті."],["Ik begreep de brieven niet, dus ik gebruikte een vertaalapp.","Я не розуміла листів, тому користувалася перекладачем."],["Gelukkig hielp een vrijwilliger mij.","На щастя, мені допомагав волонтер."],["Hij heette Kees en hij was gepensioneerd.","Його звали Кес, він був на пенсії."],["Elke dinsdag kwam hij bij ons op bezoek.","Щовівторка він приходив до нас у гості."],["Hij legde alles rustig uit: hoe je een huisarts zoekt, hoe je de huur betaalt en hoe je afval scheidt.","Він спокійно все пояснював: як знайти сімейного лікаря, як платити оренду і як сортувати сміття."]],
[["Mijn kinderen gingen meteen naar school.","Мої діти одразу пішли до школи."],["Ze leerden de taal veel sneller dan ik.","Вони вивчили мову набагато швидше за мене."],["Na drie maanden spraken ze al met hun vriendjes in het Nederlands.","Через три місяці вони вже говорили з друзями нідерландською."],["Soms vertaalden ze voor mij bij de dokter.","Іноді вони перекладали для мене в лікаря."],["Dat vond ik een beetje gênant, maar ook grappig.","Мені було трохи ніяково, але й смішно."]],
[["Zelf volgde ik een taalcursus, drie ochtenden per week.","Сама я ходила на мовні курси три ранки на тиждень."],["In de klas zaten mensen uit Syrië, Polen en Oekraïne.","У класі були люди із Сирії, Польщі та України."],["We hadden allemaal een ander verhaal, maar hetzelfde doel: een nieuw leven opbouwen.","У всіх була своя історія, але одна мета: збудувати нове життя."],["Onze lerares was streng, maar heel geduldig.","Наша вчителька була суворою, але дуже терплячою."]],
[["In de zomer vond ik vrijwilligerswerk in een kringloopwinkel.","Улітку я знайшла волонтерську роботу в секонд-хенді."],["Daar oefende ik elke dag met klanten.","Там я щодня практикувалася з покупцями."],["Ik maakte veel fouten, maar niemand lachte mij uit.","Я робила багато помилок, але ніхто з мене не сміявся."],["Nederlanders zijn direct, maar ook behulpzaam.","Нідерландці прямі, але й готові допомогти."]],
[["Nu, na een jaar, kan ik boodschappen doen, de dokter bellen en een gesprek voeren met de buren.","Тепер, через рік, я можу ходити по продукти, дзвонити лікарю і розмовляти з сусідами."],["Ik droom zelfs soms in het Nederlands!","Я навіть іноді бачу сни нідерландською!"],["Mijn volgende doel is het inburgeringsexamen.","Моя наступна мета — іспит з інтеграції."],["Daarna wil ik weer werken als verpleegkundige, want dat was mijn beroep in Oekraïne.","Потім я хочу знову працювати медсестрою, бо це була моя професія в Україні."],["Het was een zwaar jaar, maar ik ben trots op wat we hebben bereikt.","Це був важкий рік, але я пишаюся тим, чого ми досягли."]]],
q:[{q:"Хто допомагав авторці?",o:["Вчителька","Волонтер Кес","Сусідка"],a:1},{q:"Хто швидше вивчив мову?",o:["Діти","Авторка","Кес"],a:0},{q:"Ким авторка хоче працювати?",o:["Вчителькою","Продавчинею","Медсестрою"],a:2}]},

{id:"t5",lv:"A2",e:"🎂",t:"Nederlandse gewoontes",uk:"Нідерландські звичаї",p:[
[["Elk land heeft zijn eigen gewoontes.","Кожна країна має свої звичаї."],["Toen ik in Nederland kwam wonen, verbaasde ik mij over een paar dingen.","Коли я переїхала до Нідерландів, мене здивували кілька речей."]],
[["Ten eerste: de agenda.","По-перше: щоденник-розклад."],["Nederlanders plannen alles.","Нідерландці все планують."],["Als je een vriend wilt zien, maak je een afspraak, soms twee weken van tevoren.","Якщо хочеш побачити друга, домовляєшся про зустріч, іноді за два тижні."],["Spontaan langskomen is niet gebruikelijk.","Заходити без попередження не прийнято."]],
[["Ten tweede: de verjaardag.","По-друге: день народження."],["Iedereen zit in een kring in de woonkamer.","Усі сидять колом у вітальні."],["Je feliciteert niet alleen de jarige, maar ook zijn familie.","Вітаєш не лише іменинника, а й його рідних."],["Er is koffie met taart, en later bier, wijn en hapjes.","Є кава з тортом, а пізніше пиво, вино і закуски."]],
[["Ten derde: eten.","По-третє: їжа."],["De lunch is vaak simpel: een boterham met kaas en een glas melk.","Обід часто простий: бутерброд із сиром і склянка молока."],["Warm eten de meeste mensen 's avonds, rond zes uur.","Гаряче більшість людей їсть увечері, близько шостої."],["Dat vond ik eerst erg vroeg.","Спочатку мені це здавалося дуже рано."]],
[["Ten vierde: direct zijn.","По-четверте: прямота."],["Nederlanders zeggen wat ze denken.","Нідерландці кажуть те, що думають."],["Als ze je idee niet goed vinden, zeggen ze dat gewoon.","Якщо їм не подобається твоя ідея, вони так і кажуть."],["Dat is niet onbeleefd bedoeld.","Це не має на меті образити."],["Het is eerlijk.","Це чесно."]],
[["Ten vijfde: samen betalen.","По-п'яте: платити разом."],["Als je met vrienden uit eten gaat, betaalt vaak iedereen voor zichzelf.","Коли йдеш із друзями в ресторан, часто кожен платить за себе."],["Met een app stuur je je vrienden een betaalverzoek.","Через застосунок ти надсилаєш друзям запит на оплату."]],
[["En ten slotte: de fiets.","І нарешті: велосипед."],["Kinderen, studenten, ministers, oma's: iedereen fietst.","Діти, студенти, міністри, бабусі — усі їздять на велосипеді."],["Er zijn meer fietsen dan mensen in Nederland.","У Нідерландах велосипедів більше, ніж людей."],["Daarom kocht ik ook een fiets.","Тому я теж купила велосипед."],["Nu snap ik waarom Nederlanders zo van fietsen houden: het is snel, gezond en gratis.","Тепер я розумію, чому нідерландці так люблять велосипед: це швидко, корисно і безкоштовно."]],
[["Sommige gewoontes vind ik nog steeds vreemd.","Деякі звичаї досі здаються мені дивними."],["Maar langzaam word ik ook een beetje Nederlands.","Але потроху я теж стаю трохи нідерландкою."],["Vorige week plande ik een koffieafspraak met mijn buurvrouw, drie weken van tevoren!","Минулого тижня я запланувала каву із сусідкою — за три тижні!"]]],

."], ["Er is geen lift, dus ik loop elke dag de trap op.", "Ліфта немає, тож я щодня підіймаюся сходами."]], [["Het appartement heeft twee kamers, een keuken en een badkamer.", "У квартирі дві кімнати, кухня і ванна."], ["De woonkamer is licht, want er zijn grote ramen.", "Вітальня світла, бо там великі вікна."], ["Ik heb uitzicht op een park.", "У мене вид на парк."]], [["De huur is achthonderd euro per maand.", "Оренда — вісімсот євро на місяць."], ["Dat is veel, maar normaal in deze stad.", "Це багато, але нормально для цього міста."], ["Gas, water en licht betaal ik apart.", "Газ, воду і світло я оплачую окремо."]], [["Ik moet nog veel kopen.", "Мені ще багато чого треба купити."], ["Ik heb een bed en een tafel, maar nog geen bank.", "У мене є ліжко і стіл, але ще немає дивана."], ["Op internet vind ik een tweedehands bank voor vijftig euro.", "В інтернеті я знаходжу вживаний диван за п'ятдесят євро."], ["Mijn buurman helpt mij om hem naar boven te dragen.", "Сусід допомагає мені занести його нагору."]], [["Ik moet me ook inschrijven bij de gemeente.", "Мені також треба зареєструватися в муніципалітеті."], ["Ik maak een afspraak via de website.", "Я записуюся через сайт."], ["Nu voelt het appartement echt als mijn huis.", "Тепер квартира справді відчувається як мій дім."]]], "q": [{"q": "На якому поверсі квартира?", "o": ["На першому", "На третьому", "На п'ятому"], "a": 1}, {"q": "Скільки коштує оренда?", "o": ["€500", "€800", "€1000"], "a": 1}, {"q": "Скільки коштує вживаний диван?", "o": ["€50", "€150", "€500"], "a": 0}]}, {"id": "t27", "lv": "A1", "e": "💼", "t": "Mijn werkdag", "uk": "Мій робочий день", "p": [[["Ik werk als kok in een restaurant in Den Haag.", "Я працюю кухарем у ресторані в Гаазі."], ["Mijn werkdag begint om twee uur 's middags.", "Мій робочий день починається о другій."]], [["Eerst kijk ik welke producten er zijn.", "Спершу я дивлюся, які є продукти."], ["Dan maak ik met mijn collega's alles klaar: groente snijden, saus maken, vlees marineren.", "Потім з колегами я все готую: ріжу овочі, роблю соус, маріную м'ясо."], ["Om vijf uur eten wij samen.", "О п'ятій ми разом їмо."], ["Dat noemen we het personeelseten.", "Це називається «їжа для персоналу»."]], [["Om zes uur komen de eerste gasten.", "О шостій приходять перші гості."], ["Dan wordt het druk in de keuken.", "Тоді на кухні стає гаряче."], ["De ober roept de bestellingen.", "Офіціант вигукує замовлення."], ["Ik moet snel en goed werken.", "Я мушу працювати швидко і добре."], ["Soms is het stressvol, maar ik vind het leuk.", "Іноді це напружено, але мені подобається."]], [["Mijn chef is streng, maar eerlijk.", "Мій шеф суворий, але справедливий."], ["Hij leert mij veel.", "Він багато мене вчить."], ["Om elf uur maken we de keuken schoon.", "Об одинадцятій ми прибираємо кухню."], ["Ik ben om half twaalf klaar.", "О пів на дванадцяту я закінчую."], ["Dan fiets ik moe, maar tevreden naar huis.", "Тоді я їду додому втомлений, але задоволений."]]], "q": [{"q": "Ким він працює?", "o": ["Офіціантом", "Кухарем", "Шефом"], "a": 1}, {"q": "Що вони роблять о п'ятій?", "o": ["Їдять разом", "Прибирають", "Йдуть додому"], "a": 0}, {"q": "О котрій він закінчує?", "o": ["23:00", "23:30", "00:30"], "a": 1}]}, {"id": "t28", "lv": "A1", "e": "✉️", "t": "Een brief van school", "uk": "Лист зі школи", "p": [[["Mijn dochter neemt een brief mee van school.", "Моя донька приносить лист зі школи."], ["Ik lees hem langzaam, want hij is in het Nederlands.", "Я читаю його повільно, бо він нідерландською."]], [["„Beste ouders,” staat er.", "«Шановні батьки», — написано там."], ["„Volgende week vrijdag gaan we op schoolreis naar de dierentuin.”", "«Наступної п'ятниці ми їдемо на шкільну екскурсію до зоопарку.»"], ["„We vertrekken om half negen met de bus en we zijn om drie uur terug.”", "«Ми вирушаємо о пів на дев'яту автобусом і повертаємося о третій.»"]], [["„Geef uw kind een lunchpakket en iets te drinken mee.”", "«Дайте дитині з собою обід і щось попити.»"], ["„Snoep is niet toegestaan.”", "«Цукерки не дозволені.»"], ["„De reis kost vijftien euro.”", "«Поїздка коштує п'ятнадцять євро.»"], ["„U kunt betalen via de app van de school.”", "«Сплатити можна через застосунок школи.»"]], [["„We zoeken nog drie ouders die mee willen gaan.”", "«Ми ще шукаємо трьох батьків, які хочуть поїхати з нами.»"], ["„Wilt u helpen? Stuur dan een bericht aan juf Sanne.”", "«Хочете допомогти? Напишіть вчительці Санне.»"]], [["Ik wil graag mee.", "Я хочу поїхати."], ["Dan kan ik ook Nederlands oefenen met de andere ouders.", "Тоді я зможу практикувати нідерландську з іншими батьками."], ["Ik stuur juf Sanne een bericht.", "Я пишу вчительці Санне."], ["Zij antwoordt snel: „Fijn, dank u wel!”", "Вона швидко відповідає: «Чудово, дякую!»"]]], "q": [{"q": "Куди їдуть діти?", "o": ["До музею", "До зоопарку", "На пляж"], "a": 1}, {"q": "Що не можна брати?", "o": ["Воду", "Цукерки", "Бутерброди"], "a": 1}, {"q": "Скільки коштує поїздка?", "o": ["€5", "€15", "€50"], "a": 1}]}, {"id": "t29", "lv": "A1", "e": "👵", "t": "Koken met oma", "uk": "Готуємо з бабусею", "p": [[["Mijn Nederlandse schoonmoeder heet Riet.", "Мою нідерландську свекруху звати Ріт."], ["Ze kookt heel goed.", "Вона дуже добре готує."], ["Vandaag leert ze mij een typisch Nederlands gerecht: stamppot.", "Сьогодні вона вчить мене типовій нідерландській страві — стампот."]], [["„Stamppot eten we vooral in de winter,” zegt Riet.", "«Стампот ми їмо переважно взимку», — каже Ріт."], ["„Het is makkelijk en goedkoop.”", "«Це просто і дешево.»"], ["Eerst schillen we een kilo aardappelen.", "Спершу ми чистимо кілограм картоплі."], ["We koken ze twintig minuten in water met zout.", "Варимо її двадцять хвилин у солоній воді."]], [["Daarna snijden we boerenkool heel fijn.", "Потім дуже дрібно ріжемо кучеряву капусту (кейл)."], ["Riet bakt ook een rookworst.", "Ріт також підсмажує копчену ковбасу."], ["Als de aardappelen gaar zijn, stampen we ze fijn.", "Коли картопля готова, ми товчемо її."], ["We doen er de boerenkool, wat melk en boter bij.", "Додаємо капусту, трохи молока і масла."]], [["„Nu nog peper en zout,” zegt Riet.", "«Тепер ще перець і сіль», — каже Ріт."], ["We maken een kuiltje in de stamppot en daar komt jus in.", "Робимо ямку в стампоті і наливаємо туди підливу."], ["Het ruikt heerlijk.", "Пахне чудово."], ["Ik proef en ik zeg: „Dit lijkt op Oekraïens eten!”", "Я куштую і кажу: «Це схоже на українську їжу!»"], ["Riet lacht.", "Ріт сміється."]]], "q": [{"q": "Коли зазвичай їдять стампот?", "o": ["Влітку", "Узимку", "На Різдво"], "a": 1}, {"q": "Скільки хвилин варять картоплю?", "o": ["10", "20", "40"], "a": 1}, {"q": "На що схожа ця страва?", "o": ["На українську їжу", "На італійську", "На китайську"], "a": 0}]}, {"id": "t30", "lv": "A1", "e": "🚦", "t": "Fietsen in Nederland", "uk": "Велосипедом по Нідерландах", "p": [[["In Nederland zijn er speciale regels voor fietsers.", "У Нідерландах є спеціальні правила для велосипедистів."], ["Ik moest ze leren toen ik hier kwam wonen.", "Мені довелося їх вивчити, коли я сюди переїхала."]], [["Je fietst altijd rechts op het fietspad.", "Їдеш завжди праворуч по велодоріжці."], ["Als er geen fietspad is, fiets je rechts op de weg.", "Якщо велодоріжки немає, їдеш праворуч по дорозі."], ["Bij een rood stoplicht moet je stoppen.", "На червоне світло треба зупинитися."], ["Veel mensen doen dat niet, maar het is wel de regel.", "Багато людей так не роблять, але таке правило."]], [["Als je afslaat, steek je je hand uit.", "Коли повертаєш, витягуєш руку."], ["'s Avonds moet je licht hebben: wit voor en rood achter.", "Увечері в тебе має бути світло: біле спереду і червоне ззаду."], ["Zonder licht kun je een boete krijgen.", "Без світла можна отримати штраф."]], [["Je mag niet bellen met je telefoon in je hand.", "Не можна розмовляти по телефону, тримаючи його в руці."], ["Die boete is meer dan honderd euro!", "Цей штраф понад сто євро!"], ["Een helm is niet verplicht.", "Шолом не обов'язковий."], ["De meeste Nederlanders dragen ge ечиво."], ["Iedereen vindt ze heerlijk.", "Усім воно дуже смакує."]]], "q": [{"q": "Звідки Ахмед?", "o": ["З Туреччини", "З Марокко", "З Сирії"], "a": 1}, {"q": "Скільки в нього дітей?", "o": ["Двоє", "Троє", "Четверо"], "a": 1}, {"q": "Що приносить Ахмед у п'ятницю?", "o": ["Торт", "Марокканське печиво", "Фрукти"], "a": 1}]}, {"id": "t41", "lv": "A1", "e": "🌻", "t": "Mijn volkstuin", "uk": "Мій городик", "p": [[["Ik woon in een appartement zonder tuin.", "Я живу в квартирі без саду."], ["Daarom huur ik een volkstuin aan de rand van de stad.", "Тому я орендую ділянку на околиці міста."], ["Het kost honderd euro per jaar.", "Це коштує сто євро на рік."]], [["Mijn tuintje is tien bij tien meter.", "Мій садок десять на десять метрів."], ["Ik kweek tomaten, sla, bonen en aardbeien.", "Я вирощую помідори, салат, квасолю і полуницю."], ["Er staan ook zonnebloemen.", "Там також ростуть соняшники."], ["Ze zijn al twee meter hoog!", "Вони вже два метри заввишки!"]], [["In het voorjaar zaai ik de zaadjes.", "Навесні я сію насіння."], ["In de zomer moet ik vaak water geven.", "Улітку мені треба часто поливати."], ["Als ik op vakantie ben, helpt mijn tuinbuurman.", "Коли я у відпустці, допомагає сусід по ділянці."]], [["Op de volkstuin zijn mensen uit veel landen.", "На ділянках люди з багатьох країн."], ["We ruilen groente en geven elkaar tips.", "Ми обмінюємося овочами і даємо одне одному поради."], ["Een Turkse buurvrouw leerde me hoe je paprika's kweekt.", "Сусідка-турчанка навчила мене вирощувати перець."], ["Ik leerde haar borsjt koken.", "Я навчила її варити борщ."]], [["In de herfst oogst ik de laatste groente.", "Восени я збираю останні овочі."], ["Ik maak soep en jam voor de winter.", "Я роблю суп і варення на зиму."], ["De volkstuin is mijn plek om te ontspannen.", "Ділянка — моє місце для відпочинку."]]], "q": [{"q": "Скільки коштує ділянка?", "o": ["€100 на рік", "€100 на місяць", "Безкоштовно"], "a": 0}, {"q": "Що вже два метри заввишки?", "o": ["Помідори", "Соняшники", "Квасоля"], "a": 1}, {"q": "Чого авторка навчила сусідку?", "o": ["Варити борщ", "Вирощувати перець", "Пекти хліб"], "a": 0}]}, {"id": "t42", "lv": "A2", "e": "👔", "t": "Een sollicitatiegesprek", "uk": "Співбесіда", "p": [[["Twee weken geleden zag ik een vacature voor een baan als administratief medewerker.", "Два тижні тому я побачила вакансію адміністративного працівника."], ["Ik schreef een motivatiebrief en stuurde mijn cv.", "Я написала мотиваційний лист і надіслала резюме."], ["Na een paar dagen werd ik gebeld voor een gesprek.", "Через кілька днів мені подзвонили і запросили на співбесіду."]], [["Ik was heel zenuwachtig.", "Я дуже нервувала."], ["Ik oefende de avond ervoor met mijn taalcoach.", "Напередодні ввечері я тренувалася з мовним коучем."], ["Ze zei: „Vertel eerlijk wat je kunt, en ook wat je nog wilt leren.”", "Вона сказала: «Чесно розкажи, що ти вмієш і чого ще хочеш навчитися»."]], [["Het gesprek was met twee mensen: de manager en iemand van personeelszaken.", "Співбесіда була з двома людьми: менеджеркою і працівником відділу кадрів."], ["Ze vroegen waarom ik deze baan wilde.", "Вони спитали, чому я хочу цю роботу."], ["Ik vertelde dat ik in Oekraïne tien jaar op een kantoor had gewerkt.", "Я розповіла, що в Україні десять років працювала в офісі."], ["Daarna vroegen ze naar mijn sterke en zwakke punten.", "Потім вони спитали про мої сильні і слабкі сторони."], ["Ik zei dat ik nauwkeurig ben, maar dat mijn Nederlands nog beter moet.", "Я сказала, що я уважна до деталей, але моя нідерландська має стати ще кращою."]], [["De manager glimlachte en zei dat eerlijkheid belangrijk is.", "Менеджерка всміхнулася і сказала, що чесність важлива."], ["Aan het einde mocht ik zelf vragen stellen.", "Наприкінці я могла поставити свої питання."], ["Ik vroeg naar de werktijden en of ik een cursus kon volgen.", "Я спитала про робочий час і чи можна пройти курс."], ["Ze zeiden dat het bedrijf een taalcursus betaalt.", "Вони сказали, що компанія оплачує мовний курс."]], [["Een week later belden ze me.", "Через тиждень мені подзвонили."], ["Ik had de baan!", "Мене взяли!"], ["Ik begin volgende maand met een contract voor een jaar.", "Я починаю наступного місяця з контрактом на рік."]]], "q": [{"q": "Для якої посади була співбесіда?", "o": ["Продавця", "Адміністративного працівника", "Вчителя"], "a": 1}, {"q": "Що вона назвала своєю слабкою стороною?", "o": ["Мову", "Пунктуальність", "Комп'ютер"], "a": 0}, {"q": "Що оплачує компанія?", "o": ["Квиток на поїзд", "Мовний курс", "Обіди"], "a": 1}]}, {"id": "t43", "lv": "A2", "e": "🎒", "t": "Het Nederlandse onderwijs", "uk": "Нідерландська освіта", "p": [[["Toen mijn kinderen hier naar school gingen, moest ik het Nederlandse onderwijs leren begrijpen.", "Коли мої діти пішли тут до школи, мені довелося розібратися в нідерландській освіті."], ["Het is anders dan in Oekraïne.", "Вона відрізняється від української."]], [["Kinderen gaan vanaf vier jaar naar de basisschool.", "Діти йдуть до початкової школи з чотирьох років."], ["De basisschool heeft acht groepen.", "У початковій школі вісім груп."], ["Groep één en twee zijn een soort kleuterklas, met veel spelen.", "Перша і друга групи — щось на зразок дитсадка, з великою кількістю ігор."], ["Vanaf groep drie leren kinderen lezen en schrijven.", "З третьої групи діти вчаться читати й писати."]], [["In groep acht maken de kinderen een eindtoets.", "У восьмій групі діти складають випускний тест."], ["Samen met het advies van de leraar bepaalt die naar welke middelbare school een kind gaat.", "Разом з порадою вчителя він визначає, в яку середню школу піде дитина."], ["Er zijn drie hoofdniveaus: vmbo, havo en vwo.", "Є три основні рівні: vmbo, havo і vwo."], ["Vmbo is praktisch en duurt vier jaar.", "Vmbo — практичний рівень і триває чотири роки."], ["Havo duurt vijf jaar en bereidt voor op een hogeschool.", "Havo триває п'ять років і готує до вищої професійної школи."], ["Vwo duurt zes jaar en is voor de universiteit.", "Vwo триває шіст они приходять в електронному вигляді, через поштову скриньку MijnOverheid."], ["Om in te loggen heb je een DigiD nodig.", "Щоб увійти, потрібен DigiD."]], [["Een DigiD is je digitale identiteit.", "DigiD — це твоя цифрова особа."], ["Je vraagt hem aan op internet en je krijgt een activeringscode per post.", "Його замовляють в інтернеті, а код активації приходить поштою."], ["Met de DigiD-app kun je veilig inloggen bij de gemeente, de Belastingdienst en je zorgverzekeraar.", "З застосунком DigiD можна безпечно входити на сайти муніципалітету, податкової і страховика."]], [["De Belastingdienst stuurt bijvoorbeeld brieven over toeslagen.", "Податкова, наприклад, надсилає листи про допомоги."], ["Toeslagen zijn bijdragen voor huur, zorg of kinderopvang.", "Допомоги — це внески на оренду, медицину чи догляд за дітьми."], ["Het is belangrijk om wijzigingen op tijd door te geven.", "Важливо вчасно повідомляти про зміни."], ["Als je meer gaat verdienen en dat niet meldt, moet je later geld terugbetalen.", "Якщо почнеш заробляти більше і не повідомиш, потім доведеться повертати гроші."]], [["Brieven van de overheid zijn vaak lang en ingewikkeld.", "Листи від держави часто довгі й складні."], ["Mijn tip: lees eerst wat er van je gevraagd wordt en voor welke datum.", "Моя порада: спершу прочитай, що від тебе хочуть і до якої дати."], ["Begrijp je iets niet, ga dan naar het spreekuur in de bibliotheek.", "Якщо щось незрозуміло, сходи на консультацію в бібліотеку."], ["Daar helpen vrijwilligers gratis met formulieren en brieven.", "Там волонтери безкоштовно допомагають з бланками і листами."], ["Gooi nooit een brief weg zonder hem te lezen!", "Ніколи не викидай лист, не прочитавши!"]]], "q": [{"q": "Що потрібно, щоб увійти в MijnOverheid?", "o": ["Паспорт", "DigiD", "Банківська картка"], "a": 1}, {"q": "Що буде, якщо не повідомити про більший заробіток?", "o": ["Нічого", "Доведеться повертати гроші", "Отримаєш більше допомоги"], "a": 1}, {"q": "Де допомагають з листами безкоштовно?", "o": ["У бібліотеці", "У банку", "У податковій"], "a": 0}]}, {"id": "t58", "lv": "A2", "e": "🩺", "t": "Mijn droomberoep", "uk": "Моя омріяна професія", "p": [[["Al sinds mijn jeugd wilde ik verpleegkundige worden.", "Ще з дитинства я хотіла стати медсестрою."], ["In Oekraïne heb ik vijftien jaar in een ziekenhuis gewerkt.", "В Україні я п'ятнадцять років працювала в лікарні."], ["Toen ik in Nederland kwam, mocht ik dat werk niet meteen doen.", "Коли я приїхала до Нідерландів, я не могла одразу виконувати цю роботу."]], [["Om in Nederland als verpleegkundige te werken, moet je in het BIG-register staan.", "Щоб працювати медсестрою в Нідерландах, треба бути в реєстрі BIG."], ["Daarvoor moest ik mijn diploma laten erkennen.", "Для цього мені довелося визнати свій диплом."], ["Dat was een lange procedure met veel documenten.", "Це була довга процедура з багатьма документами."]], [["Ik moest ook een taalexamen op niveau B2 halen.", "Мені також треба було скласти мовний іспит рівня B2."], ["Medische woorden in het Nederlands waren in het begin moeilijk.", "Медичні слова нідерландською спершу були важкими."], ["Ik leerde elke dag twintig nieuwe termen.", "Я щодня вчила двадцять нових термінів."], ["Ondertussen werkte ik als zorgassistent in een verpleeghuis.", "Тим часом я працювала помічницею по догляду в будинку престарілих."], ["Daar leerde ik hoe de zorg hier werkt en hoe je met patiënten praat.", "Там я дізналася, як тут працює догляд і як говорити з пацієнтами."]], [["In Nederland is de verhouding tussen arts en verpleegkundige gelijkwaardiger.", "У Нідерландах стосунки між лікарем і медсестрою більш рівноправні."], ["Verpleegkundigen nemen zelf veel beslissingen.", "Медсестри самі ухвалюють багато рішень."], ["Dat vind ik prettig.", "Мені це подобається."]], [["Na twee jaar was het eindelijk zover.", "Через два роки нарешті все вдалося."], ["Ik kreeg mijn BIG-registratie en een baan in het ziekenhuis van mijn stad.", "Я отримала реєстрацію BIG і роботу в лікар e collega's.", "У неділю ми купили шоколад для колег."], ["Het was een kort, maar heerlijk weekend.", "Це були короткі, але чудові вихідні."], ["We willen snel terug, misschien naar Brugge.", "Ми хочемо швидко повернутися, можливо, до Брюгге."]]], "q": [{"q": "Скільки їхати потягом з Роттердама?", "o": ["1 година", "2 години", "4 години"], "a": 1}, {"q": "Чому бельгійська картопля фрі особлива?", "o": ["Її смажать двічі", "Вона солодка", "Вона з сиром"], "a": 0}, {"q": "Що вони купили колегам?", "o": ["Пиво", "Шоколад", "Сувеніри"], "a": 1}]}]);

/* ---------- storage ---------- */
const KEY='taalfiets-v1',DAY=86400000,INTERVALS=[0,1,2,4,7,14,30];
function dstr(d){return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()}
function today(){return dstr(new Date())}
let S={drate:0.85,box:{},due:{},xp:0,streak:0,last:'',done:{date:'',n:0},goal:20,rate:1,voice:'',level:'A0',read:{},ddone:{},gdone:{}};
try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s)S=Object.assign(S,s)}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function touchDay(){const t=today();if(S.done.date!==t){const ys=dstr(new Date(Date.now()-DAY));if(S.last!==t&&S.last!==ys)S.streak=0;S.done={date:t,n:0}}}
function credit(xp){touchDay();const t=today();if(S.last!==t){S.streak=(S.streak||0)+1;S.last=t}S.done.n++;S.xp+=xp;save();drawHero();if(S.done.n===S.goal){toast('Денну ціль виконано! Goed zo!');confetti(90)}}
function setBox(w,b){S.box[w.id]=b;S.due[w.id]=Date.now()+INTERVALS[b]*DAY-3600000}
function grade(w,ok){const b=S.box[w.id]||0;setBox(w,ok?Math.min(b+1,6):Math.max(0,b-2));credit(ok?10:2)}
function isDue(w){return S.box[w.id]!==undefined&&(S.due[w.id]||0)<=Date.now()}
function learned(w){return (S.box[w.id]||0)>=3}

9", 3644, 1], "m|In het noorden van België, in Vlaanderen, spreken ze ook Nederlands.": ["t59", 3645], "m|noorden": ["t59", 3646, 1], "m|vlaanderen": ["t59", 3647, 1], "m|Maar het klinkt anders.": ["t59", 3648], "m|klinkt": ["t59", 3649, 1], "m|vlamingen": ["t59", 3650, 1], "m|zachter": ["t59", 3651, 1], "m|Een Nederlander zegt lekker, een Vlaming zegt vaak smakelijk.": ["t59", 3652], "m|nederlander": ["t59", 3653, 1], "m|vlaming": ["t59", 3654, 1], "m|En Alstublieft betekent in België ook graag gedaan.": ["t59", 3655], "m|Gent is een prachtige middeleeuwse stad.": ["t59", 3656], "m|prachtige": ["t59", 3657, 1], "m|middeleeuwse": ["t59", 3658, 1], "m|We bezochten het Gravensteen, een kasteel midden in de stad.": ["t59", 3659], "m|bezochten": ["t59", 3660, 1], "m|gravensteen": ["t59", 3661, 1], "m|kasteel": ["t59", 3662, 1], "m|Daarna maakten we een boottocht over de Leie.": ["t59", 3663], "m|maakten": ["t59", 3664, 1], "m|boottocht": ["t59", 3665, 1], "m|leie": ["t59", 3666, 1], "m|Natuurlijk aten we Belgische frieten in een frituur.": ["t59", 3667], "m|belgische": ["t59", 3668, 1], "m|frieten": ["t59", 3669, 1], "m|frituur": ["t59", 3670, 1], "m|De Belgen zijn er trots op, want ze bakken ze twee keer.": ["t59", 3671], "m|belgen": ["t59", 3672, 1], "m|dronken": ["t59", 3673, 1], "m|belgisch": ["t59", 3674, 1], "m|Er zijn honderden soorten!": ["t59", 3675], "m|honderden": ["t59", 3676, 1], "m|soorten": ["t59", 3677, 1], "m|Op zondag kochten we chocolade voor onze collega's.": ["t59", 3678], "m|Het was een kort, maar heerlijk weekend.": ["t59", 3679], "m|brugge": ["t59", 3680, 1]};
