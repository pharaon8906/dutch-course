<title>Taalfiets A1.2</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Nunito:wght@500;600;700;800&display=swap">
<style>
/* Layout: one playful column under an animated Dutch-landscape hero; candy palette of Delft blue, tulip pink, oranje and mint */
:root{
  --bg:#f3f6ff; --surface:#ffffff; --ink:#1a1f3d; --muted:#5d6488; --line:#e1e6f5;
  --blue:#2f5bff; --blue-soft:#e7edff; --orange:#ff7a1a; --orange-soft:#fff0e2; --pink:#f03a6c; --pink-soft:#ffe7ef;
  --green:#10a86f; --green-soft:#dcf6ea; --sun:#ffbf1a; --sun-soft:#fff5d6; --purple:#7d55ff; --purple-soft:#efe9ff;
  --sky1:#4f7dff; --sky2:#9cc0ff; --onhero:#ffffff;
  --de:#2f5bff; --het:#f03a6c;
  --shadow:0 10px 30px -14px rgba(47,91,255,.35);
  --f-display:"Unbounded","Nunito",system-ui,sans-serif; --f-body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:22px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1230; --surface:#191f47; --ink:#f1f3ff; --muted:#a8aed6; --line:#2c3468;
  --blue:#7f9bff; --blue-soft:#232f6e; --orange:#ff9a4d; --orange-soft:#3c2615; --pink:#ff6f99; --pink-soft:#41192c;
  --green:#3ddc9c; --green-soft:#11382a; --sun:#ffd257; --sun-soft:#3a3115; --purple:#a98bff; --purple-soft:#2c2160;
  --sky1:#1d2c7a; --sky2:#4b3f9e; --onhero:#ffffff; --de:#7f9bff; --het:#ff6f99;
  --shadow:0 10px 30px -14px rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1230; --surface:#191f47; --ink:#f1f3ff; --muted:#a8aed6; --line:#2c3468;
  --blue:#7f9bff; --blue-soft:#232f6e; --orange:#ff9a4d; --orange-soft:#3c2615; --pink:#ff6f99; --pink-soft:#41192c;
  --green:#3ddc9c; --green-soft:#11382a; --sun:#ffd257; --sun-soft:#3a3115; --purple:#a98bff; --purple-soft:#2c2160;
  --sky1:#1d2c7a; --sky2:#4b3f9e; --onhero:#ffffff; --de:#7f9bff; --het:#ff6f99;
  --shadow:0 10px 30px -14px rgba(0,0,0,.6); color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;
  background:radial-gradient(800px 420px at 0% -5%,var(--blue-soft),transparent 60%),radial-gradient(700px 420px at 100% 10%,var(--pink-soft),transparent 60%),radial-gradient(700px 500px at 50% 100%,var(--sun-soft),transparent 60%),var(--bg);background-attachment:fixed;background-color:var(--bg)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 56px}

/* hero */
.hero{position:relative;border-radius:26px;overflow:hidden;background:linear-gradient(160deg,var(--sky1),var(--sky2));color:var(--onhero);min-height:212px;box-shadow:var(--shadow)}
.hero svg.scene{position:absolute;inset:auto 0 0 0;width:100%;height:96px;display:block}
.btn svg{width:18px;height:18px;flex:none}
.hero .ht{position:relative;padding:18px 20px 0;display:grid;gap:4px}
.hero h1{font-family:var(--f-display);font-weight:800;font-size:1.55rem;margin:0;letter-spacing:-.01em;line-height:1.1;text-shadow:0 2px 10px rgba(0,0,0,.18)}
.hero h1 span{background:var(--sun);color:#1a1f3d;border-radius:8px;padding:0 6px;font-size:.8em;vertical-align:middle;margin-left:4px}
.hero p{margin:0;font-weight:700;opacity:.95;font-size:.9rem}
.hstats{position:relative;display:flex;gap:6px;padding:10px 20px 0;flex-wrap:wrap}
.hstats span{background:rgba(255,255,255,.22);backdrop-filter:blur(6px);border-radius:999px;padding:3px 10px;font-weight:800;font-size:.8rem}
.blades{transform-origin:330px 52px;animation:spin 7s linear infinite}
.sway{transform-box:fill-box;transform-origin:50% 100%;animation:sway 3s ease-in-out infinite}
.sway:nth-of-type(2n){animation-delay:-1.2s}.sway:nth-of-type(3n){animation-delay:-2s}
.cloud{animation:drift 26s linear infinite}
.cloud2{animation:drift 38s linear infinite;animation-delay:-14s}
.bike{animation:ride 14s linear infinite}
.wheel{transform-box:fill-box;transform-origin:center;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes sway{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
@keyframes drift{from{transform:translateX(-120px)}to{transform:translateX(520px)}}
@keyframes ride{from{transform:translateX(-60px)}to{transform:translateX(460px)}}

/* tabs */
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;margin-top:12px;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(10px);border-radius:18px}
.tabs-in{display:flex;gap:6px;overflow-x:auto;padding:8px 2px;scrollbar-width:none}
.tabs-in::-webkit-scrollbar{display:none}
.tab{flex:none;border:0;background:var(--surface);color:var(--ink);font:800 .88rem var(--f-body);padding:8px 13px;border-radius:999px;cursor:pointer;box-shadow:0 2px 8px -4px rgba(30,40,100,.25);transition:transform .15s}
.tab:hover{transform:translateY(-2px)}
.tab[aria-selected="true"]{background:linear-gradient(135deg,var(--blue),var(--purple));color:#fff}
.tab:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--sun);outline-offset:2px}

main{display:grid;gap:16px;padding-top:12px}
h2{font-family:var(--f-display);font-size:1.08rem;margin:0;text-wrap:balance;font-weight:700}
h3{font-size:1.05rem;margin:0;font-weight:800}
.card{background:var(--surface);border-radius:var(--r);padding:18px;display:grid;gap:12px;min-width:0;box-shadow:var(--shadow);animation:rise .4s cubic-bezier(.2,.8,.3,1.2) both}
main>*:nth-child(2){animation-delay:.05s}main>*:nth-child(3){animation-delay:.1s}main>*:nth-child(4){animation-delay:.15s}main>*:nth-child(5){animation-delay:.2s}
@keyframes rise{from{transform:translateY(14px) scale(.98);opacity:.35}to{transform:none;opacity:1}}
.muted{color:var(--muted)} .small{font-size:.87rem}
.label{font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:800}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
button.btn,a.btn{font:800 .95rem var(--f-body);border-radius:14px;border:0;background:var(--blue-soft);color:var(--blue);padding:10px 16px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;text-decoration:none;transition:transform .12s, box-shadow .12s}
button.btn:hover,a.btn:hover{transform:translateY(-2px)}
button.btn:active{transform:scale(.96)}
button.btn:disabled{opacity:.45;cursor:default;transform:none}
.primary{background:linear-gradient(135deg,var(--blue),var(--purple))!important;color:#fff!important;box-shadow:0 8px 18px -8px var(--blue)}
.good{background:linear-gradient(135deg,var(--green),#22c3a0)!important;color:#fff!important}
.bad{background:linear-gradient(135deg,var(--orange),var(--pink))!important;color:#fff!important}
.sunny{background:var(--sun-soft)!important;color:var(--ink)!important}
button.speak{border:0;background:linear-gradient(135deg,var(--orange),var(--pink));color:#fff;width:40px;height:40px;border-radius:50%;display:inline-grid;place-items:center;cursor:pointer;flex:none;box-shadow:0 6px 14px -6px var(--pink);transition:transform .12s}
button.speak:hover{transform:scale(1.08)}
button.speak.talking{animation:pulse .8s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.15);box-shadow:0 0 0 8px color-mix(in srgb,var(--pink) 25%,transparent)}}
button.speak svg{width:18px;height:18px}
select,input[type=text],input[type=search]{font:700 .95rem var(--f-body);color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:14px;padding:10px 12px;max-width:100%}
input[type=text],input[type=search]{width:100%}

/* flashcard */
.flipwrap{perspective:1200px}
.flipper{position:relative;min-height:290px;transition:transform .6s cubic-bezier(.3,1.4,.5,1);transform-style:preserve-3d;cursor:pointer}
.flipper.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:26px;display:grid;place-items:center;text-align:center;padding:26px 20px;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden}
.face.front{background:linear-gradient(150deg,var(--blue-soft),var(--purple-soft))}
.face.back{background:linear-gradient(150deg,var(--sun-soft),var(--pink-soft));transform:rotateY(180deg)}
.face .pic{font-size:72px;line-height:1;animation:bob 2.6s ease-in-out infinite;filter:drop-shadow(0 8px 10px rgba(0,0,0,.15))}
@keyframes bob{50%{transform:translateY(-8px) rotate(3deg)}}
.face .word{font-family:var(--f-display);font-size:clamp(1.5rem,6.5vw,2.3rem);font-weight:700;line-height:1.2;overflow-wrap:anywhere;margin-top:10px}
.face .tr{font-size:1.2rem;font-weight:800;margin-top:6px}
.face .hint{margin-top:8px;font-size:.92rem;color:var(--muted);max-width:42ch;margin-inline:auto}
.face .corner{position:absolute;top:14px;left:16px}
.face .spk{position:absolute;top:12px;right:12px}
.flipwrap.out-r{animation:outR .35s ease-in forwards}.flipwrap.out-l{animation:outL .35s ease-in forwards}.flipwrap.in{animation:cardIn .4s cubic-bezier(.2,.9,.3,1.3)}
@keyframes outR{to{transform:translateX(120%) rotate(14deg);opacity:0}}
@keyframes outL{to{transform:translateX(-120%) rotate(-14deg);opacity:0}}
@keyframes cardIn{from{transform:scale(.85) translateY(20px);opacity:0}}
.art-de{color:var(--de)} .art-het{color:var(--het)}
.pill{display:inline-block;font-size:.75rem;font-weight:800;padding:3px 10px;border-radius:999px;background:var(--surface);color:var(--blue)}
.pill.ok{background:var(--green-soft);color:var(--green)}
.pill.fire{background:var(--orange-soft);color:var(--orange)}
.bar{height:12px;border-radius:99px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--blue),var(--purple),var(--pink));background-size:200% 100%;animation:shine 3s linear infinite;transition:width .6s cubic-bezier(.2,.8,.3,1)}
@keyframes shine{to{background-position:-200% 0}}
.list{display:grid;max-height:440px;overflow:auto;border-radius:16px;background:var(--bg)}
.li{display:flex;gap:10px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .em{font-size:1.4rem;width:30px;text-align:center;flex:none}
.li .nl{font-weight:800;min-width:0;flex:1}
.li .uk{color:var(--muted);flex:1;min-width:0;font-size:.92rem}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.tilebtn{border:0;border-radius:18px;padding:12px;text-align:left;cursor:pointer;font:800 .9rem var(--f-body);color:var(--ink);display:grid;gap:6px;transition:transform .15s}
.tilebtn:hover{transform:translateY(-3px) rotate(-1deg)}
.tilebtn .e{font-size:1.8rem}
.tilebtn .bar{height:6px;background:color-mix(in srgb,var(--ink) 12%,transparent)}
.c0{background:var(--blue-soft)}.c1{background:var(--pink-soft)}.c2{background:var(--sun-soft)}.c3{background:var(--green-soft)}.c4{background:var(--purple-soft)}.c5{background:var(--orange-soft)}

/* quiz */
.opts{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.opt{font:800 1.02rem var(--f-body);text-align:left;padding:14px 16px;border-radius:16px;border:2px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;transition:transform .12s,border-color .12s}
.opt:hover{border-color:var(--blue);transform:translateY(-2px)}
.opt.right{background:var(--green-soft);border-color:var(--green);color:var(--green);animation:pop .4s}
.opt.wrong{background:var(--pink-soft);border-color:var(--pink);color:var(--pink);animation:shake .4s}
@keyframes pop{40%{transform:scale(1.07)}}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.q-pic{font-size:78px;text-align:center;line-height:1;animation:bob 2.6s ease-in-out infinite}
.q-big{font-family:var(--f-display);font-size:1.6rem;text-align:center;padding:6px 0;overflow-wrap:anywhere;font-weight:700}
.feedback{font-weight:800;font-size:1.05rem}
.feedback.ok{color:var(--green)} .feedback.no{color:var(--pink)}
.mode{display:flex;gap:14px;align-items:center}
.mode .mi{width:58px;height:58px;border-radius:18px;display:grid;place-items:center;font-size:30px;flex:none}

/* dialogs */
.chat{display:grid;gap:10px}
.line{display:flex;gap:8px;align-items:flex-end;max-width:92%}
.line.B{margin-left:auto;flex-direction:row-reverse}
.ava{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:22px;flex:none;background:var(--blue-soft)}
.line.B .ava{background:var(--pink-soft)}
.bubble{background:var(--blue-soft);border-radius:18px 18px 18px 6px;padding:10px 12px;min-width:0;display:flex;gap:8px;align-items:flex-start;transition:transform .2s}
.line.B .bubble{background:var(--pink-soft);border-radius:18px 18px 6px 18px}
.bubble .speak{width:32px;height:32px}
.bubble .speak svg{width:15px;height:15px}
.line .nl{font-weight:800}
.line .uk{color:var(--muted);font-size:.9rem}
.line.playing .bubble{transform:scale(1.04);box-shadow:0 0 0 3px var(--sun)}
.hidden-text{filter:blur(7px);cursor:pointer}
.dlg-card{border:0;text-align:left;cursor:pointer;font:inherit;color:inherit}
.dlg-card .e{font-size:2.2rem}

details.g{background:var(--surface);border-radius:var(--r);padding:0 18px;box-shadow:var(--shadow)}
details.g summary{cursor:pointer;padding:15px 0;font-weight:800;list-style:none;display:flex;align-items:center;gap:10px}
details.g summary .e{font-size:1.5rem}
details.g summary::after{content:"+";margin-left:auto;color:var(--blue);font-weight:800;font-size:1.3rem;transition:transform .2s}
details.g[open] summary::after{transform:rotate(45deg)}
details.g .gb{padding-bottom:16px;display:grid;gap:10px;animation:rise .3s both}
details.g ul{margin:0;padding-left:20px}
.tipbox{background:var(--sun-soft);border-radius:14px;padding:10px 12px;font-size:.93rem}
.tipbox b{color:var(--orange)}
.ex{display:flex;gap:10px;align-items:center}
.ex .nl{font-weight:800}
.stat{display:grid;gap:2px;padding:12px;border-radius:16px}
.stat .n{font-family:var(--f-display);font-size:1.7rem;font-variant-numeric:tabular-nums}
.ring{--p:0;width:96px;height:96px;border-radius:50%;flex:none;display:grid;place-items:center;background:conic-gradient(var(--green) calc(var(--p)*1%),var(--line) 0);transition:--p .6s}
.ring>div{width:74px;height:74px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:1.05rem}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:14px;font-weight:700;font-size:.92rem;z-index:20;max-width:calc(100% - 32px)}
.sound .s{font-family:var(--f-display);font-size:1.5rem;font-weight:800;background:linear-gradient(135deg,var(--blue),var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent;width:max-content}
.chip{border:0;background:var(--bg);color:var(--ink);border-radius:999px;padding:7px 13px;font:800 .92rem var(--f-body);cursor:pointer;transition:transform .12s}
.chip:hover{transform:translateY(-2px);background:var(--blue-soft);color:var(--blue)}
table.ff{width:100%;border-collapse:collapse;font-size:.94rem}
table.ff td{padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
table.ff td:first-child{font-weight:800;white-space:nowrap}
.scroll{overflow-x:auto}
.cf{position:fixed;width:9px;height:13px;border-radius:2px;pointer-events:none;z-index:30}
.xpf{position:fixed;pointer-events:none;z-index:31;font:800 1.1rem var(--f-display);color:var(--green)}
.sheet{position:fixed;inset:0;z-index:40;background:rgba(10,14,40,.5);display:grid;place-items:end center;padding:16px max(16px,env(safe-area-inset-left,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px))}
.sheet .card{max-width:560px;width:100%;max-height:85vh;overflow:auto}
.diag li{margin:4px 0}
@media (prefers-reduced-motion:reduce){*,*::before{animation:none!important;transition:none!important}}
</style>

        <g class="wheel"><circle cx="30" cy="10" r="7"/><path d="M30 3v14M23 10h14"/></g>
        <path d="M8 10l8-10h12l2 10M16 0l-2-4M26 0l2-5h3"/><circle cx="17" cy="-12" r="3" fill="#ff7a1a" stroke="none"/><path d="M17 -9l2 9" stroke="#ff7a1a" stroke-width="3"/>
      </g></g>
    </svg>
  </header>
  <nav class="tabs" aria-label="Розділи"><div class="tabs-in" id="tabs" role="tablist"></div></nav>
  <main id="view"></main>
</div>
<div class="toast" id="toast" hidden></div>
<div id="sheetHost"></div>

<script>
/*DATA*/

/* ---------- data prep ---------- */
const WORDS=[];
for(const [cat,txt] of Object.entries(RAW)){
  txt.trim().split('\n').forEach(l=>{const [nl,uk,hint]=l.split('|');const id=nl.trim();WORDS.push({id,nl:id,uk:(uk||'').trim(),hint:(hint||'').trim(),cat,em:EMO[id]||CATEMO[cat]||'🇳🇱'})});
}
const CATS=Object.keys(RAW);
const NOUNS=WORDS.filter(w=>/^(de|het) [a-zà-ÿ]/i.test(w.nl)&&!w.nl.includes('?'));
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- storage ---------- */
const KEY='taalfiets-v1',DAY=86400000,INTERVALS=[0,1,2,4,7,14,30];
function dstr(d){return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()}
function today(){return dstr(new Date())}
let S={box:{},due:{},xp:0,streak:0,last:'',done:{date:'',n:0},goal:20,rate:1,voice:''};
try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s)S=Object.assign(S,s)}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function touchDay(){const t=today();if(S.done.date!==t){const ys=dstr(new Date(Date.now()-DAY));if(S.last!==t&&S.last!==ys)S.streak=0;S.done={date:t,n:0}}}
function credit(xp){touchDay();const t=today();if(S.last!==t){S.streak=(S.streak||0)+1;S.last=t}S.done.n++;S.xp+=xp;save();drawHero();if(S.done.n===S.goal){toast('Денну ціль виконано! Goed zo!');confetti(90)}}
function setBox(w,b){S.box[w.id]=b;S.due[w.id]=Date.now()+INTERVALS[b]*DAY-3600000}
function grade(w,ok){const b=S.box[w.id]||0;setBox(w,ok?Math.min(b+1,6):Math.max(0,b-2));credit(ok?10:2)}
function isDue(w){return S.box[w.id]!==undefined&&(S.due[w.id]||0)<=Date.now()}
function learned(w){return (S.box[w.id]||0)>=3}

/* ---------- speech: pre-recorded neural voices (Piper) ---------- */
const AIDX=/*AIDX*/{};
const INLINE_AUDIO=/*AUDIO*/null;
const CHUNKS={},LOADING={};let audioFail=false;
function cleanText(t){return t.replace(/\s\/\s/g,', ').replace(/\(.*?\)/g,'').replace(/\.\.\.|…|___/g,'').replace(/\s+/g,' ').trim()}
function b64url(b){const bin=atob(b);const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return URL.createObjectURL(new Blob([u],{type:'audio/mpeg'}))}
function loadChunk(c){
  if(CHUNKS[c])return Promise.resolve(CHUNKS[c]);
  if(INLINE_AUDIO&&INLINE_AUDIO[c]){CHUNKS[c]=INLINE_AUDIO[c];return Promise.resolve(CHUNKS[c])}
  if(!LOADING[c])LOADING[c]=fetch('audio/'+c+'.json').then(r=>{if(!r.ok)throw 0;return r.json()}).then(d=>{CHUNKS[c]=d;audioFail=false;return d}).catch(e=>{delete LOADING[c];audioFail=true;throw e});
  return LOADING[c];
}
const URLS={};
const player=new Audio();player.preload='auto';
const SILENT='data:audio/mpeg;base64,SUQzBAAAAAAAI1RTU0UAAAAPAAADTGF2ZjU4Ljc2LjEwMAAAAAAAAAAAAAAA//tQxAADB8AhSmxhIIEVCSiJrDCQBTcu3UrAIwUdkRgQbFAZC1CQEwTJ9mjRvBA4UOLD8nKVOWfh+UlK3z/177OXrfOdKl7pyn3Xf//WreyTRUoAWgBgkOAGbZHBgG1OF6zM82DWbZaUmMBptgQhGjsyYqc9ae9XFz280948NMBWInljyzsNRFLPWdnZGWrddDsjK1unuSrVN9jJsK8KuQtQCtMBjCEtImISdNKJOopIpBFpNSMbIHCSRpRR5iakjTiyzLhchUUBwCgyKiweBv/7UsQbg8isVNoMPMjAAAA0gAAABEVFGmgqK////9bP/6XCykxBTUUzLjEwMKqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqq';
document.addEventListener('pointerdown',()=>{try{player.src=SILENT;player.play().catch(()=>{})}catch(e){}},{once:true});
let playToken=0;
function stopSpeech(){playToken++;try{player.pause()}catch(e){}document.querySelectorAll('.speak.talking').forEach(b=>b.classList.remove('talking'))}
function say(text,o={}){
  const t=cleanText(text);if(!t)return;
  const voice=o.voice||'m';const ref=AIDX[voice+'|'+t]||AIDX['m|'+t];
  if(!o.queue)stopSpeech();
  const tok=++playToken;
  const done=()=>{o.btn&&o.btn.classList.remove('talking');o.onend&&o.onend()};
  if(!ref){done();return}
  if(o.btn)o.btn.classList.add('talking');
  loadChunk(ref[0]).then(d=>{
    if(tok!==playToken)return;
    const k=ref[0]+':'+ref[1];if(!URLS[k])URLS[k]=b64url(d[ref[1]]);
    player.onended=()=>{if(tok===playToken)done()};player.onerror=()=>{if(tok===playToken)done()};
    player.src=URLS[k];player.playbackRate=o.rate||S.rate;try{player.preservesPitch=true}catch(e){}
    const p=player.play();if(p&&p.catch)p.catch(()=>{if(tok===playToken){done();if(!o.auto)toast('Натисніть ще раз, щоб увімкнути звук')}});
  }).catch(()=>{if(tok!==playToken)return;done();if(!o.auto)speechHelp()});
}
function prefetchAll(){const cs=[...new Set(Object.values(AIDX).map(r=>r[0]))];let i=0;const nx=()=>{if(i>=cs.length)return;loadChunk(cs[i++]).then(()=>setTimeout(nx,200),()=>{})};nx()}
setTimeout(prefetchAll,1500);
function speechHelp(){
  const host=document.getElementById('sheetHost');
  host.innerHTML=`<div class="sheet" id="sheet"><div class="card" role="dialog" aria-modal="true" aria-labelledby="shT">
    <div class="row" style="justify-content:space-between"><h2 id="shT">🔇 Звук не завантажився</h2><button class="btn" id="shX" aria-label="Закрити">✕</button></div>
    <div>Записи вимови завантажуються з інтернету при першому прослуховуванні. Перевірте з'єднання і спробуйте ще раз. Також перевірте, що на телефоні не вимкнено звук (на iPhone — перемикач збоку).</div>
    <div class="row"><button class="btn primary" id="shTry">${SPK} Спробувати ще раз</button></div></div></div>`;
  const close=()=>host.innerHTML='';
  document.getElementById('shX').onclick=close;
  document.getElementById('sheet').onclick=e=>{if(e.target.id==='sheet')close()};
  document.getElementById('shTry').onclick=()=>{close();say('Hallo! Ik spreek Nederlands.')};
}
const SPK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4V5z" fill="currentColor"/><path d="M15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/></svg>';
function spkBtn(text,label,voice){return `<button class="speak" data-say="${esc(text)}"${voice?` data-voice="${voice}"`:''} aria-label="Слухати: ${esc(label||text)}" title="Слухати">${SPK}</button>`}

/* ---------- fx ---------- */
const CF=['#2f5bff','#ff7a1a','#f03a6c','#10a86f','#ffbf1a','#7d55ff'];
function confetti(n=40,x,y){if(reduced)return;x=x??innerWidth/2;y=y??innerHeight/3;
  for(let i=0;i<n;i++){const s=document.createElement('i');s.className='cf';s.style.background=CF[i%6];s.style.left=x+'px';s.style.top=y+'px';document.body.appendChild(s);
    const a=Math.random()*Math.PI*2,v=60+Math.random()*180,dx=Math.cos(a)*v,dy=Math.sin(a)*v-140;
    const an=s.animate([{transform:'translate(0,0) rotate(0)',opacity:1},{transform:`translate(${dx}px,${dy+300}px) rotate(${Math.random()*900}deg)`,opacity:0}],{duration:1100+Math.random()*700,easing:'cubic-bezier(.2,.6,.4,1)'});an.onfinish=()=>s.remove()}}
function xpFloat(el,txt){if(reduced||!el)return;const r=el.getBoundingClientRect();const s=document.createElement('div');s.className='xpf';s.textContent=txt;s.style.left=(r.left+r.width/2-16)+'px';s.style.top=(r.top-6)+'px';document.body.appendChild(s);
  s.animate([{transform:'translateY(0) scale(.8)',opacity:0},{transform:'translateY(-14px) scale(1.15)',opacity:1,offset:.25},{transform:'translateY(-50px) scale(1)',opacity:0}],{duration:1000,easing:'ease-out'}).onfinish=()=>s.remove()}

/* ---------- helpers ---------- */
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function artHTML(nl){const m=nl.match(/^(de|het) (.*)$/);return m?`<span class="art-${m[1]}">${m[1]}</span> ${esc(m[2])}`:esc(nl)}
function norm(s){return s.toLowerCase().replace(/^(de|het|een) /,'').replace(/[?!.,¿¡'’]/g,'').replace(/\s+/g,' ').trim()}
let tt;function toast(m){const t=document.getElementById('toast');t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,3200)}
function hashStr(s){let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))|0;return Math.abs(h)}
const $=s=>document.querySelector(s);
const catIdx=c=>CATS.indexOf(c)%6;

/* ---------- tabs ---------- */
const TABS=[['today','🏠 Сьогодні'],['words','🃏 Слова'],['quiz','🎯 Тренажер'],['dialogs','💬 Діалоги'],['grammar','📘 Граматика'],['sounds','🎙️ Вимова'],['hacks','💡 Лайфхаки'],['progress','🏆 Прогрес']];
let cur=(location.hash||'').slice(1);if(!TABS.some(t=>t[0]===cur))cur='today';
function drawTabs(){$('#tabs').innerHTML=TABS.map(([id,n])=>`<button class="tab" role="tab" data-tab="${id}" aria-selected="${id===cur}">${n}</button>`).join('')}
function drawHero(){touchDay();$('#hstats').innerHTML=`<span>🔥 ${S.streak||0} дн.</span><span>⭐ ${S.xp} XP</span><span>📚 ${WORDS.filter(learned).length}/${WORDS.length}</span>`}
function go(id){cur=id;try{history.replaceState(null,'','#'+id)}catch(e){}drawTabs();render();const n=document.querySelector('nav.tabs');if(n&&window.scrollY>n.offsetTop)window.scrollTo({top:n.offsetTop-4})}
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(h!==cur&&TABS.some(t=>t[0]===h)){cur=h;drawTabs();render()}});
document.addEventListener('click',e=>{
  const s=e.target.closest('[data-say]');if(s){e.stopPropagation();say(s.dataset.say,{voice:s.dataset.voice,rate:s.dataset.rate?+s.dataset.rate:undefined,btn:s.classList.contains('speak')?s:null});return}
  const t=e.target.closest('[data-tab]');if(t){go(t.dataset.tab);return}
  const g=e.target.closest('[data-go]');if(g){go(g.dataset.go);return}
});

/* ---------- views ---------- */
function render(){stopSpeech();({today:vToday,words:vWords,quiz:vQuiz,dialogs:vDialogs,grammar:vGrammar,sounds:vSounds,hacks:vHacks,progress:vProgress})[cur]()}

function vToday(){
  touchDay();
  const wod=WORDS[hashStr(today())%WORDS.length];
  const due=WORDS.filter(isDue).length, nw=WORDS.filter(w=>S.box[w.id]===undefined).length;
  const pct=Math.min(100,Math.round(S.done.n/S.goal*100));
  const hack=HACKS[hashStr(today()+'h')%HACKS.length];
  $('#view').innerHTML=`
  <section class="card" style="background:linear-gradient(135deg,var(--sun-soft),var(--pink-soft))">
    <div class="label">Слово дня</div>
    <div class="row" style="flex-wrap:nowrap;gap:14px">
      <div class="q-pic" style="font-size:64px">${wod.em}</div>
      <div style="min-width:0;flex:1"><div class="q-big" style="text-align:left;padding:0">${artHTML(wod.nl)}</div>
      <div style="font-weight:800">${esc(wod.uk)}</div>${wod.hint?`<div class="small muted">${esc(wod.hint)}</div>`:''}</div>
      ${spkBtn(wod.nl)}
    </div>
  </section>
  <section class="card">
    <div class="row" style="flex-wrap:nowrap;gap:16px">
      <div class="ring" style="--p:${pct}"><div>${pct}%</div></div>
      <div style="min-width:0;display:grid;gap:6px">
        <h2>Ціль на сьогодні</h2>
        <div class="small muted">${S.done.n} з ${S.goal} вправ · ${S.xp} XP</div>
        <div class="row"><span class="pill fire">🔥 Серія: ${S.streak||0} дн.</span>${due?`<span class="pill">🔁 На повторення: ${due}</span>`:''}</div>
      </div>
    </div>
    <div class="row">
      <button class="btn primary" id="startDue">${due?`🔁 Повторити (${due})`:'✨ Нові слова'}</button>
      <button class="btn sunny" data-go="quiz">🎯 Тренажер</button>
      <button class="btn" data-go="dialogs">💬 Діалог</button>
    </div>
    <div class="small muted">${due?'Інтервальне повторення не дасть словам забутися.':`Ще ${nw} нових слів чекають на тебе.`}</div>
  </section>
  <section class="card" style="background:linear-gradient(135deg,var(--blue-soft),var(--purple-soft))">
    <div class="label">💡 Лайфхак дня</div>
    <h3>${esc(hack[0])}</h3><div>${esc(hack[1])}</div>
  </section>
  <section class="card">
    <h2>Як проходити курс</h2>
    <div class="grid2">
      ${[['🃏','Слова','Картки з картинками й озвучкою. «Знаю» чи «Ще раз» — програма сама вирішить, коли повторити.','c0'],['🎯','Тренажер','Переклад, аудіювання, написання і гра de/het. Застряг — тисни «Підказка».','c2'],['💬','Діалоги','9 життєвих ситуацій. Слухай, а потім грай роль одного зі співрозмовників.','c1'],['🎙️','Вимова','Складні звуки з поясненням українською і повільною озвучкою.','c3']].map(([e,h,t,c])=>`<div class="stat ${c}"><div style="font-size:1.8rem">${e}</div><b>${h}</b><span class="small">${t}</span></div>`).join('')}
    </div>
  </section>`;
  $('#startDue').onclick=()=>{wordsState.cat=due?'__due':'__new';buildDeck();go('words')};
}

/* words / flashcards */
const wordsState={cat:'__new',dir:'nl',q:[],i:0,flipped:false,search:''};
function buildDeck(){
  let pool;const c=wordsState.cat;
  if(c==='__due')pool=WORDS.filter(isDue);
  else if(c==='__new')pool=WORDS.filter(w=>S.box[w.id]===undefined).slice(0,15);
  else if(c==='__all')pool=shuffle(WORDS).slice(0,25);
  else pool=WORDS.filter(w=>w.cat===c);
  wordsState.q=c==='__new'?pool:shuffle(pool);wordsState.i=0;wordsState.flipped=false;
}
function vWords(){
  if(!wordsState.q.length||wordsState.i>=wordsState.q.length)buildDeck();
  const opts=[['__new','✨ Нові (15)'],['__due','🔁 На повторення ('+WORDS.filter(isDue).length+')'],['__all','🎲 Мікс із усіх']].concat(CATS.map(c=>[c,CATEMO[c]+' '+c+' ('+WORDS.filter(w=>w.cat===c).length+')']));
  $('#view').innerHTML=`
  <section class="card">
    <div class="row">
      <select id="cat" aria-label="Набір слів" style="flex:1;min-width:0">${opts.map(([v,n])=>`<option value="${esc(v)}" ${v===wordsState.cat?'selected':''}>${esc(n)}</option>`).join('')}</select>
      <button class="btn" id="dir">${wordsState.dir==='nl'?'🇳🇱 → 🇺🇦':'🇺🇦 → 🇳🇱'}</button>
    </div>
    <div id="cardArea"></div>
  </section>
  <section class="card">
    <h2>Теми</h2>
    <div class="tiles">${CATS.map(c=>{const ws=WORDS.filter(w=>w.cat===c);const l=ws.filter(learned).length;return `<button class="tilebtn c${catIdx(c)}" data-cat="${esc(c)}"><span class="e">${CATEMO[c]}</span><span>${esc(c)}</span><span class="small muted">${l}/${ws.length}</span><span class="bar"><i style="width:${l/ws.length*100}%"></i></span></button>`}).join('')}</div>
  </section>
  <section class="card">
    <div class="row" style="justify-content:space-between"><h2>📖 Словник</h2><span class="small muted">${WORDS.length} слів · <span class="art-de">de</span> / <span class="art-het">het</span></span></div>
    <input type="search" id="search" placeholder="Пошук нідерландською чи українською" value="${esc(wordsState.search)}" aria-label="Пошук слова">
    <div class="list" id="dict"></div>
  </section>`;
  $('#cat').onchange=e=>{wordsState.cat=e.target.value;buildDeck();drawCard()};
  $('#dir').onclick=()=>{wordsState.dir=wordsState.dir==='nl'?'uk':'nl';wordsState.flipped=false;vWords()};
  $('#search').oninput=e=>{wordsState.search=e.target.value;drawDict()};
  document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{wordsState.cat=b.dataset.cat;$('#cat').value=b.dataset.cat;buildDeck();drawCard();$('#cardArea').scrollIntoView({behavior:reduced?'auto':'smooth',block:'center'})});
  drawCard();drawDict();
}
function drawCard(anim){
  const a=$('#cardArea');const st=wordsState;
  if(!st.q.length){a.innerHTML=`<div class="flipwrap in"><div class="flipper" style="cursor:default"><div class="face front"><div><div class="pic">🎉</div><div class="word">Klaar!</div><div class="hint">${st.cat==='__due'?'Немає слів на повторення. Приходь завтра або вчи нові.':'У цьому наборі вже немає нових слів.'}</div></div></div></div></div>`;return}
  if(st.i>=st.q.length){confetti(70);a.innerHTML=`<div class="flipwrap in"><div class="flipper" style="cursor:default"><div class="face front"><div><div class="pic">🏆</div><div class="word">Goed gedaan!</div><div class="tr">Набір пройдено: ${st.q.length} карток</div><div class="row" style="justify-content:center;margin-top:14px"><button class="btn primary" id="again">Ще набір</button><button class="btn sunny" data-go="quiz">🎯 Перевірити</button></div></div></div></div></div>`;$('#again').onclick=()=>{buildDeck();drawCard()};return}
  const w=st.q[st.i];const nlF=st.dir==='nl';
  const b=S.box[w.id];
  a.innerHTML=`
  <div class="row" style="justify-content:space-between"><span class="small muted">${st.i+1} / ${st.q.length} · ${CATEMO[w.cat]} ${esc(w.cat)}</span><span class="pill ${b>=3?'ok':''}">${b===undefined?'✨ нове':'рівень '+b}</span></div>
  <div class="bar" style="height:8px"><i style="width:${st.i/st.q.length*100}%"></i></div>
  <div class="flipwrap ${anim===false?'':'in'}" id="fw">
    <div class="flipper ${st.flipped?'flipped':''}" id="flip" tabindex="0" role="button" aria-label="Перевернути картку">
      <div class="face front"><span class="spk">${spkBtn(w.nl)}</span><div>
        <div class="pic">${w.em}</div>
        <div class="word">${nlF?artHTML(w.nl):esc(w.uk)}</div>
        <div class="hint">👆 Торкнись, щоб перевернути</div></div></div>
      <div class="face back"><span class="spk">${spkBtn(w.nl)}</span><div>
        <div class="pic">${w.em}</div>
        <div class="word">${nlF?esc(w.uk):artHTML(w.nl)}</div>
        <div class="tr muted">${nlF?artHTML(w.nl):esc(w.uk)}</div>
        ${w.hint?`<div class="hint">💡 ${esc(w.hint)}</div>`:''}</div></div>
    </div>
  </div>
  <div class="row" style="justify-content:center" id="cbtns"></div>`;
  const btns=()=>{$('#cbtns').innerHTML=st.flipped?`<button class="btn bad" id="no">🔁 Ще раз</button><button class="btn good" id="yes">✅ Знаю</button>`:`<button class="btn primary" id="show">Показати переклад</button>`;
    if($('#show'))$('#show').onclick=flip;
    if($('#yes'))$('#yes').onclick=e=>{grade(w,true);xpFloat(e.currentTarget,'+10');next('out-r')};
    if($('#no'))$('#no').onclick=()=>{grade(w,false);st.q.push(w);next('out-l')}};
  const flip=()=>{st.flipped=!st.flipped;$('#flip').classList.toggle('flipped',st.flipped);if(st.flipped)say(w.nl,{auto:true});btns()};
  const next=cls=>{const fw=$('#fw');if(reduced){st.i++;st.flipped=false;drawCard();return}fw.classList.remove('in');void fw.offsetWidth;fw.classList.add(cls);setTimeout(()=>{st.i++;st.flipped=false;drawCard()},300)};
  $('#flip').onclick=flip;$('#flip').onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();flip()}};
  btns();
}
function drawDict(){
  const q=norm(wordsState.search||'');
  const list=WORDS.filter(w=>!q||norm(w.nl).includes(q)||w.uk.toLowerCase().includes(q));

/* quiz */
const QZ={mode:null,qs:[],i:0,score:0,answered:false,hint:0,cat:''};
const MODES=[
 ['choice','🖼️','Вибери переклад','Бачиш слово з картинкою — обираєш переклад.','c0'],
 ['listen','🎧','На слух','Чуєш слово — обираєш, яке прозвучало.','c1'],
 ['type','⌨️','Напиши слово','Пишеш нідерландською. Артикль можна не писати.','c2'],
 ['article','🎲','De чи het?','Гра на артиклі — найкорисніші 2 хвилини.','c3']
];
function vQuiz(){
  if(!QZ.mode){
    $('#view').innerHTML=`<section class="card"><h2>🎯 Тренажер</h2><div class="muted small">Раунд — 10 питань. Слова, з якими помиляєшся, повертаються частіше.</div>
    <label class="label" for="qcat">Тема</label><select id="qcat"><option value="">🌈 Усі теми</option>${CATS.map(c=>`<option value="${esc(c)}" ${QZ.cat===c?'selected':''}>${CATEMO[c]} ${esc(c)}</option>`).join('')}</select></section>
    ${MODES.map(([id,e,n,d,c])=>`<section class="card"><div class="mode"><div class="mi ${c}">${e}</div><div style="min-width:0;flex:1"><h3>${n}</h3><div class="small muted">${d}</div></div><button class="btn primary" data-mode="${id}">Грати</button></div></section>`).join('')}`;
    $('#qcat').onchange=e=>QZ.cat=e.target.value;
    document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>startQuiz(b.dataset.mode));
    return;
  }
  drawQ();
}
function startQuiz(mode){
  let pool=mode==='article'?NOUNS:WORDS;
  if(QZ.cat)pool=pool.filter(w=>w.cat===QZ.cat);
  if(pool.length<4)pool=mode==='article'?NOUNS:WORDS;
  const weak=pool.filter(w=>S.box[w.id]!==undefined&&S.box[w.id]<3);
  const qs=shuffle(weak).slice(0,4).concat(shuffle(pool)).filter((w,i,a)=>a.indexOf(w)===i).slice(0,10);
  Object.assign(QZ,{mode,qs:shuffle(qs),i:0,score:0,answered:false,hint:0,pool});
  vQuiz();
}
function distractors(w,key){return shuffle(QZ.pool.filter(x=>x!==w&&x[key]!==w[key])).slice(0,3)}
function drawQ(){
  const v=$('#view');
  if(QZ.i>=QZ.qs.length){
    const p=QZ.score/QZ.qs.length;if(p>=.6)confetti(p>=.9?120:60);
    v.innerHTML=`<section class="card" style="text-align:center;background:linear-gradient(135deg,var(--sun-soft),var(--green-soft))"><div class="q-pic">${p>=.9?'🏆':p>=.6?'🌷':'💪'}</div><div class="q-big">${QZ.score} / ${QZ.qs.length}</div>
    <div style="font-weight:800">${p>=.9?'Uitstekend! Відмінно!':p>=.6?'Goed zo! Добре, ще трохи практики.':'Niet erg! Повтори картки й спробуй ще.'}</div>
    <div class="row" style="justify-content:center"><button class="btn primary" id="rq">Ще раунд</button><button class="btn" id="bq">Інший режим</button></div></section>`;
    $('#rq').onclick=()=>startQuiz(QZ.mode);$('#bq').onclick=()=>{QZ.mode=null;vQuiz()};return;
  }
  const w=QZ.qs[QZ.i];QZ.answered=false;QZ.hint=0;
  const head=`<div class="row" style="justify-content:space-between"><span class="small muted">Питання ${QZ.i+1} / ${QZ.qs.length} · ✅ ${QZ.score}</span><button class="btn" id="quit">✕ Вийти</button></div><div class="bar"><i style="width:${QZ.i/QZ.qs.length*100}%"></i></div>`;
  let body='';
  if(QZ.mode==='choice'){
    const o=shuffle([w,...distractors(w,'uk')]);
    body=`<div class="q-pic">${w.em}</div><div class="row" style="justify-content:center;gap:12px"><div class="q-big">${artHTML(w.nl)}</div>${spkBtn(w.nl)}</div><div class="opts">${o.map(x=>`<button class="opt" data-a="${x===w}">${esc(x.uk)}</button>`).join('')}</div>`;
  }else if(QZ.mode==='listen'){
    const o=shuffle([w,...distractors(w,'nl')]);
    body=`<div class="q-pic">🎧</div><div class="row" style="justify-content:center"><button class="btn primary" id="play">${SPK} Слухати</button><button class="btn" data-say="${esc(w.nl)}" data-rate="0.7">🐢 Повільно</button></div><div class="opts">${o.map(x=>`<button class="opt" data-a="${x===w}">${artHTML(x.nl)}</button>`).join('')}</div>`;
  }else if(QZ.mode==='type'){
    body=`<div class="q-pic">${w.em}</div><div class="q-big">${esc(w.uk)}</div><form id="tf" class="row" style="flex-wrap:nowrap"><input type="text" id="ans" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="нідерландською…" aria-label="Відповідь"><button class="btn primary">OK</button></form>`;
  }else{
    const m=w.nl.match(/^(de|het) (.*)$/);
    body=`<div class="q-pic">${w.em}</div><div class="row" style="justify-content:center;gap:12px"><div class="q-big">___ ${esc(m[2])}</div>${spkBtn(m[2])}</div><div class="small muted" style="text-align:center">${esc(w.uk)}</div><div class="opts"><button class="opt" data-a="${m[1]==='de'}" style="text-align:center;font-size:1.3rem"><span class="art-de">de</span></button><button class="opt" data-a="${m[1]==='het'}" style="text-align:center;font-size:1.3rem"><span class="art-het">het</span></button></div>`;
  }
  v.innerHTML=`<section class="card">${head}${body}<div class="row"><button class="btn sunny" id="hint">💡 Підказка</button><span id="hintText" class="small muted" style="flex:1;min-width:0"></span></div><div id="fb" class="feedback" aria-live="polite"></div><div class="row" id="nextRow" hidden><button class="btn primary" id="next">Далі →</button></div></section>`;
  $('#quit').onclick=()=>{QZ.mode=null;vQuiz()};
  if($('#play')){$('#play').onclick=e=>say(w.nl,{btn:null});setTimeout(()=>say(w.nl,{auto:true}),300)}
  $('#hint').onclick=()=>{QZ.hint++;$('#hintText').textContent=hintFor(w,QZ.hint)};
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    if(QZ.answered)return;const ok=b.dataset.a==='true';
    document.querySelectorAll('.opt').forEach(x=>{if(x.dataset.a==='true')x.classList.add('right')});
    if(!ok)b.classList.add('wrong');else{const r=b.getBoundingClientRect();confetti(24,r.left+r.width/2,r.top+r.height/2);xpFloat(b,QZ.hint?'+5':'+10')}
    finish(w,ok);
  });
  if($('#tf')){
    $('#ans').focus({preventScroll:true});
    $('#tf').onsubmit=e=>{e.preventDefault();if(QZ.answered)return;const val=norm($('#ans').value);if(!val)return;
      const target=norm(w.nl);const alts=w.nl.split('/').map(norm);
      const ok=val===target||alts.includes(val);const close=!ok&&lev(val,target)<=1;
      if(ok||close){const r=$('#ans').getBoundingClientRect();confetti(24,r.left+r.width/2,r.top);xpFloat($('#ans'),'+10')}else{$('#ans').animate([{transform:'translateX(-7px)'},{transform:'translateX(7px)'},{transform:'none'}],{duration:300,iterations:2})}
      finish(w,ok||close,close?`Майже! Правильно: ${w.nl}`:null)};
  }
}
function hintFor(w,n){
  const base=w.nl.replace(/^(de|het) /,'');
  if(QZ.mode==='article')return n===1?'Закінчується на -je? Тоді het. Множина завжди de.':(w.hint||'Приблизно 2/3 слів мають de.');
  if(n===1)return w.hint?w.hint:`Починається на «${base[0]}», ${base.length} літер`;
  if(n===2)return `Починається на «${base.slice(0,Math.ceil(base.length/2))}…»`;
  say(w.nl);return '🔊 Озвучую — слухай уважно';
}
function lev(a,b){const d=[];for(let i=0;i<=a.length;i++){d[i]=[i];for(let j=1;j<=b.length;j++)d[i][j]=i?Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1)):j}return d[a.length][b.length]}
function finish(w,ok,msg){
  QZ.answered=true;if(ok)QZ.score++;
  const b=S.box[w.id]||0;setBox(w,ok?Math.min(b+1,6):Math.max(0,b-1));
  credit(ok?(QZ.hint?5:10):1);
  const fb=$('#fb');fb.className='feedback '+(ok?'ok':'no');
  fb.innerHTML=(msg?'🙂 '+esc(msg):ok?'🎉 Goed zo! Правильно.':`😅 Ні. Правильно: ${artHTML(w.nl)} — ${esc(w.uk)}`)+(w.hint&&!ok?`<div class="small muted" style="font-weight:600">💡 ${esc(w.hint)}</div>`:'');
  if(QZ.mode!=='listen')say(w.nl,{auto:true});
  $('#nextRow').hidden=false;$('#next').focus({preventScroll:true});$('#next').onclick=()=>{QZ.i++;drawQ()};
}

  <section class="card"><h2>За темами</h2>${CATS.map(c=>{const ws=WORDS.filter(w=>w.cat===c);const l=ws.filter(learned).length;return `<div><div class="row" style="justify-content:space-between"><span class="small" style="font-weight:700">${CATEMO[c]} ${esc(c)}</span><span class="small muted" style="font-variant-numeric:tabular-nums">${l}/${ws.length}</span></div><div class="bar" style="height:8px"><i style="width:${l/ws.length*100}%"></i></div></div>`}).join('')}</section>
  <section class="card"><h2>⚙️ Налаштування</h2>
    <label class="small" for="goal" style="font-weight:800">Денна ціль (вправ)</label><select id="goal">${[10,20,30,50].map(n=>`<option ${S.goal===n?'selected':''}>${n}</option>`).join('')}</select>
    <label class="small" for="rate2" style="font-weight:800">Швидкість вимови: <span id="rv2">${S.rate.toFixed(2)}</span></label><input type="range" id="rate2" min="0.6" max="1.2" step="0.05" value="${S.rate}" style="width:100%;accent-color:var(--pink)">
    <div class="small muted">🎧 Озвучка — природні нейромережеві голоси (чоловічий для слів, жіночий і чоловічий у діалогах). Працює однаково на будь-якому телефоні, нічого встановлювати не треба.</div>
    <div class="row"><button class="btn primary" data-say="Hallo! Welkom bij de cursus Nederlands.">${SPK} Перевірити звук</button></div>
    <div class="row" id="resetRow"><button class="btn" id="reset">Скинути прогрес</button></div>
  </section>`;
  $('#goal').onchange=e=>{S.goal=+e.target.value;save()};
  $('#rate2').oninput=e=>{S.rate=+e.target.value;$('#rv2').textContent=S.rate.toFixed(2);save()};
  $('#reset').onclick=()=>{$('#resetRow').innerHTML='<span class="small">Точно скинути весь прогрес?</span><button class="btn bad" id="rYes">Так, скинути</button><button class="btn" id="rNo">Скасувати</button>';
    $('#rYes').onclick=()=>{S.box={};S.due={};S.xp=0;S.streak=0;S.last='';S.done={date:'',n:0};save();toast('Прогрес скинуто');drawHero();vProgress()};$('#rNo').onclick=vProgress};
}

drawTabs();drawHero();render();
</script>
